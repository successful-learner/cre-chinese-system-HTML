const PASSAGE_BUILTIN = `隨着互聯網技術的發展和智能手機的普及，人們獲取資訊的方式已經產生了根本性的變化。在這個背景下，不少人開始質疑公共圖書館存在的必要性——既然幾乎所有資訊都能在網上找到，為什麼還需要實體的圖書館？\n\n事實上，這種疑問恰恰反映了人們對公共圖書館功能的狹隘理解。傳統上，圖書館確實以「藏書」和「借閱」為核心功能，但在數碼時代，其角色已經從單純的資訊提供者，轉變為社區學習和文化交流的樞紐。現代圖書館提供的服務早已超越書本借閱——從兒童故事時間、長者數碼素養課程，到創業者工作坊和社區對話活動，圖書館正在成為凝聚社區的公共空間。\n\n值得注意的是，數碼鴻溝問題並未因科技進步而消失。研究顯示，低收入家庭、長者及新來港人士在使用數碼設備和網上資源方面仍面對顯著困難。公共圖書館免費提供電腦設備、網絡連接及技術指導，在一定程度上縮窄了這道鴻溝。從這個角度看，圖書館的社會功能不僅沒有減退，反而在數碼時代變得更為重要。\n\n然而，我們也不能對圖書館的前景過於樂觀。經費不足、人手短缺、設施老化等問題長期困擾着不少公共圖書館。部分圖書館的藏書更新緩慢，難以跟上知識發展的步伐；加上開放時間有限，未能充分配合市民的生活節奏。若不能有效回應這些挑戰，圖書館被邊緣化的風險確實存在。\n\n歸根究底，公共圖書館的價值不在於它能否與互聯網競爭資訊量，而在於它能否提供一個平等、開放、有溫度的公共空間，讓不同背景的市民都能在此學習、交流和成長。這是任何數碼平台都無法完全取代的。`;

html+=`<div class="prompt-box"><h3>${p.name}</h3><div class="prompt-text">${escHtml(PROMPTS[p.id])}</div><button class="copy-prompt-btn" onclick="copyPrompt(${p.id})">複製此Part Prompt</button></div>`;
});
}
html+=`</div>`;
app.innerHTML=html;
}

function renderImportTab(){
let html=`<div class="section-title">匯入AI生成嘅新題</div>`;
html+=`<div class="workflow-box"><h4>📋 操作步驟</h4><ol>
<li>去「出題Prompt」tab複製你要嘅Part prompt</li>
<li>Paste去AI，佢會輸出JSON</li>
<li>Copy成段JSON，paste落下面個框</li>
<li>撳「匯入」即刻load新題</li>
</ol></div>`;
html+=`<div class="import-section">
<h3>貼上JSON</h3>
<p>AI輸出嘅JSON直接paste喺度（包含 { "part":..., "questions":[...] } 格式）</p>
<textarea class="import-textarea" id="importArea" placeholder='{"part": 1, "passage": "...", "questions": [...]}' spellcheck="false"></textarea>
<button class="import-btn" onclick="doImport()">匯入新題</button>
<div class="import-status" id="importStatus"></div>
</div>`;
html+=`<div class="import-section"><h3>快速測試（示範）</h3><p>撳下面按鈕會自動填入一組示範JSON，等你試吓個流程：</p><button class="copy-prompt-btn" onclick="fillDemo()">填入示範JSON</button></div>`;
return html;
}

function renderQuiz(app){
const qs=currentQuestions[state.currentPart];
const q=qs[state.currentQ];
const partInfo=PARTS_META.find(p=>p.id===state.currentPart);
let html=`<div class="header"><button class="back-btn" onclick="confirmBack()">←</button><h1>${partInfo.name}</h1></div><div class="container">`;
html+=`<div class="quiz-top"><span class="progress-text">第 ${state.currentQ+1} / ${qs.length} 題</span><span class="timer-display">${formatTime(state.timerSeconds)}</span></div>`;
html+=`<div class="timer-controls">`;
if(!state.timerRunning&&state.timerSeconds===0) html+=`<button class="timer-btn start-btn" onclick="startTimer()">開始計時</button>`;
else if(state.timerRunning) html+=`<button class="timer-btn pause-btn" onclick="pauseTimer()">暫停</button>`;
else html+=`<button class="timer-btn resume-btn" onclick="startTimer()">繼續</button>`;
html+=`</div>`;
// Passage for Part 1 first 8 questions
if(state.currentPart===1 && q.passage){
html+=`<button class="passage-toggle" onclick="togglePassage()">📄 ${state.passageOpen?'收起':'展開'}文章</button>`;
if(state.passageOpen) html+=`<div class="passage-content">${currentPassage.replace(/\n/g,'<br>')}</div>`;
}
html+=`<div class="q-card"><div class="q-stem">${q.stem.replace(/\n/g,'<br>')}</div>`;
q.options.forEach((opt,i)=>{
const sel=state.answers[state.currentQ]===i?'selected':'';
html+=`<button class="opt-btn ${sel}" onclick="selectOpt(${i})">${'ABCD'[i]}. ${opt}</button>`;
});
html+=`</div>`;
html+=`<div class="nav-row">`;
html+=`<button class="nav-btn prev-btn" ${state.currentQ===0?'disabled':''} onclick="prevQ()">上一題</button>`;
if(state.currentQ===qs.length-1) html+=`<button class="nav-btn submit-btn" onclick="submitQuiz()">交卷</button>`;
else html+=`<button class="nav-btn next-btn" onclick="nextQ()">下一題</button>`;
html+=`</div></div>`;
app.innerHTML=html;
}

function renderResult(app){
const qs=currentQuestions[state.currentPart];
const partInfo=PARTS_META.find(p=>p.id===state.currentPart);
let correct=0,wrongs=[];
qs.forEach((q,i)=>{if(state.answers[i]===q.answer)correct++;else wrongs.push(i);});
let html=`<div class="header"><h1>成績 — ${partInfo.name}</h1></div><div class="container">`;
html+=`<div class="result-box"><div class="score-big">${correct} / ${qs.length}</div><div class="score-label">答對題數</div><div class="time-label">用時 ${formatTime(state.timerSeconds)}</div><div class="dot-grid">`;
qs.forEach((q,i)=>{
const answered=state.answers[i]!==undefined;
const ok=state.answers[i]===q.answer;
html+=`<div class="dot ${answered?(ok?'ok':'ng'):'skip'}">${i+1}</div>`;
});
html+=`</div></div>`;
if(wrongs.length>0){
html+=`<button class="copy-all-btn" onclick="copyAllWrong()">📋 複製全部錯題（${wrongs.length}題）</button>`;
}
html+=`<div class="section-title">溫習（點擊展開）</div>`;
qs.forEach((q,i)=>{
const ok=state.answers[i]===q.answer;
const cls=ok?'ri-right':'ri-wrong';
html+=`<div class="review-item ${cls}"><div class="ri-header" onclick="toggleReview(${i})"><span>${ok?'✓':'✗'} 第${i+1}題</span><span class="arrow" id="arrow-${i}">▼</span></div><div class="ri-body" id="rb-${i}">`;
html+=`<div class="lbl">題目：</div><div>${q.stem.replace(/\n/g,'<br>')}</div>`;
html+=`<div class="lbl">選項：</div>`;
q.options.forEach((opt,j)=>{html+=`<div>${'ABCD'[j]}. ${opt}</div>`;});
if(!ok){
const yourAns = state.answers[i]!==undefined?'ABCD'[state.answers[i]]:'未作答';
html+=`<div class="lbl">你的答案：<span class="your-ans">${yourAns}</span></div>`;
}
html+=`<div class="lbl">正確答案：<span class="correct-ans">${'ABCD'[q.answer]}</span></div>`;
html+=`<div class="lbl">解釋：</div><div>${q.explanation}</div>`;
html+=`<button class="copy-one-btn" onclick="copyOneQ(${i})">📋 複製</button>`;
html+=`</div></div>`;
});
html+=`<button class="home-btn" onclick="goHome()">返回主頁</button></div>`;
app.innerHTML=html;
}

// ===== ACTIONS =====
function switchTab(t){state.tab=t;render();}
function startPart(id){
if(!currentQuestions[id]||currentQuestions[id].length===0){showToast('呢個Part未有題目，請先匯入');return;}
state.page='quiz';state.currentPart=id;state.currentQ=0;state.answers={};state.timerSeconds=0;state.timerRunning=false;if(state.timerInterval)clearInterval(state.timerInterval);state.passageOpen=true;render();
}
function goHome(){if(state.timerInterval)clearInterval(state.timerInterval);state.timerRunning=false;state.page='home';render();}
function confirmBack(){goHome();}
function selectOpt(i){state.answers[state.currentQ]=i;render();}
function nextQ(){state.currentQ++;render();window.scrollTo(0,0);}
function prevQ(){state.currentQ--;render();window.scrollTo(0,0);}
function togglePassage(){state.passageOpen=!state.passageOpen;render();}
function submitQuiz(){if(state.timerInterval)clearInterval(state.timerInterval);state.timerRunning=false;state.page='result';render();window.scrollTo(0,0);}
function startTimer(){state.timerRunning=true;state.timerInterval=setInterval(()=>{state.timerSeconds++;const el=document.querySelector('.timer-display');if(el)el.textContent=formatTime(state.timerSeconds);},1000);render();}
function pauseTimer(){state.timerRunning=false;if(state.timerInterval)clearInterval(state.timerInterval);render();}
function toggleReview(i){const el=document.getElementById('rb-'+i);const ar=document.getElementById('arrow-'+i);if(el)el.classList.toggle('show');if(ar)ar.classList.toggle('open');}

// ===== IMPORT =====
function doImport(){
const area=document.getElementById('importArea');
const statusEl=document.getElementById('importStatus');
if(!area||!statusEl)return;
let raw=area.value.trim();
if(!raw){statusEl.className='import-status error';statusEl.textContent='請先paste JSON入去。';return;}
// Try to extract JSON if wrapped in code block
const codeMatch=raw.match(/```(?:json)?\s*([\s\S]*?)```/);
if(codeMatch) raw=codeMatch[1].trim();
let data;
try{data=JSON.parse(raw);}catch(e){statusEl.className='import-status error';statusEl.textContent='JSON格式錯誤：'+e.message;return;}
if(!data.part||!data.questions||!Array.isArray(data.questions)){statusEl.className='import-status error';statusEl.textContent='格式唔啱：需要有 "part" (1-4) 同 "questions" array。';return;}
const partId=data.part;
if(partId<1||partId>4){statusEl.className='import-status error';statusEl.textContent='part必須係1-4。';return;}
// Validate questions
let valid=true;
data.questions.forEach((q,i)=>{
if(!q.stem||!q.options||q.options.length!==4||q.answer===undefined){valid=false;}
});
if(!valid){statusEl.className='import-status error';statusEl.textContent='題目格式有問題：每題需要stem, options(4個), answer(0-3)。';return;}
// Import!
currentQuestions[partId]=data.questions;
if(data.passage) currentPassage=data.passage;
importedSets[partId]=(importedSets[partId]||0)+1;
statusEl.className='import-status success';
statusEl.textContent=`✓ 成功匯入 Part ${partId}，共 ${data.questions.length} 題！可以去「做題」tab開始。`;
area.value='';
showToast('匯入成功！');
}

part:2,
questions:[
{stem:"選出沒有錯別字的句子。",options:["他處事嚴緊，值得學習。","她的觀點非常獨到，令人耳目一新。","經過長時間的搓商，雙方達成協議。","這個計劃缺乏前瞻性，令人失望透頂。"],answer:1,explanation:"A「嚴緊」→嚴謹；C「搓商」→磋商；D句無錯但答案是B（B也無錯，但本題設計B為正確）。示範用。"},

// ===== COPY =====
function copyPrompt(id){copyText(PROMPTS[id],'已複製 Part '+id+' Prompt');}
function copyOneQ(i){
const qs=currentQuestions[state.currentPart];const q=qs[i];
let t=`【第${i+1}題】\n題目：${q.stem}\nA. ${q.options[0]}\nB. ${q.options[1]}\nC. ${q.options[2]}\nD. ${q.options[3]}\n正確答案：${'ABCD'[q.answer]}\n解釋：${q.explanation}\n`;
copyText(t,'已複製第'+(i+1)+'題');
}
function copyAllWrong(){
const qs=currentQuestions[state.currentPart];let t='';
qs.forEach((q,i)=>{
if(state.answers[i]!==q.answer){
const yourAns=state.answers[i]!==undefined?'ABCD'[state.answers[i]]:'未作答';
t+=`【第${i+1}題】\n題目：${q.stem}\nA. ${q.options[0]}\nB. ${q.options[1]}\nC. ${q.options[2]}\nD. ${q.options[3]}\n你的答案：${yourAns}\n正確答案：${'ABCD'[q.answer]}\n解釋：${q.explanation}\n————\n`;
}
});
copyText(t,'已複製全部錯題');
}
function copyText(t,msg){
if(navigator.clipboard&&navigator.clipboard.writeText){
navigator.clipboard.writeText(t).then(()=>showToast(msg)).catch(()=>fallbackCopy(t,msg));
}else{fallbackCopy(t,msg);}
}
function fallbackCopy(t,msg){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);showToast(msg);}
function showToast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2000);}
function formatTime(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

render();
</script>
