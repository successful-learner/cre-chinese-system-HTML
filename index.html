<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0">
<title>CRE中文運用 — 練習系統 v12</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+TC:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
--pri:#2d2d2d;--pri-l:#f5f5f7;--accent:#00c4b4;--accent-d:#00a89a;--accent-l:#e6faf8;
--blue:#4a7dff;--blue-l:#eef3ff;--purple:#8b5cf6;--purple-l:#f3effe;
--rose:#f43f5e;--rose-l:#fef1f3;--amber:#f59e0b;--amber-l:#fefce8;
--green:#10b981;--green-l:#ecfdf5;
--g0:#ffffff;--g50:#fafafa;--g100:#f5f5f5;--g150:#efefef;--g200:#e5e5e5;--g300:#d4d4d4;--g400:#a3a3a3;--g500:#737373;--g600:#525252;--g700:#404040;--g800:#262626;--g900:#171717;
--r:20px;--rs:14px;--rx:10px;
--sh:0 1px 2px rgba(0,0,0,.03),0 4px 12px rgba(0,0,0,.04);
--shm:0 4px 20px rgba(0,0,0,.08);
--shl:0 12px 48px rgba(0,0,0,.12);
--ease:cubic-bezier(.22,1,.36,1);
--font:'Inter','Noto Sans TC',-apple-system,BlinkMacSystemFont,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--g50);color:var(--g800);line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;padding-bottom:100px;overflow-x:hidden}
.container{max-width:480px;margin:0 auto;padding:0 20px}
@media(min-width:768px){.container{max-width:560px}}

/* Bottom Nav */
.btm-nav{position:fixed;bottom:0;left:0;right:0;z-index:200;padding:0 16px env(safe-area-inset-bottom,8px)}
.btm-nav-inner{max-width:420px;margin:0 auto;background:var(--g0);border-radius:28px;box-shadow:0 -1px 0 rgba(0,0,0,.03),0 8px 32px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:space-around;padding:6px 12px;margin-bottom:8px}
.btm-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 10px;border:none;background:transparent;color:var(--g400);font-size:10px;font-weight:500;cursor:pointer;transition:.2s var(--ease);border-radius:16px;min-width:48px}
.btm-item svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;transition:.2s}
.btm-item.active{color:var(--g800)}
.btm-item.active svg{stroke-width:2.2}
.btm-center{display:flex;flex-direction:column;align-items:center;gap:2px;border:none;background:transparent;cursor:pointer;margin:0 4px}
.btm-center-btn{width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 16px rgba(0,196,180,.3);transition:.3s var(--ease);margin-top:-10px}
.btm-center-btn svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2.5;transition:.3s}
.btm-center-btn:active{transform:scale(.9)}
.btm-center-btn.open{background:var(--g800);transform:rotate(45deg);box-shadow:0 4px 16px rgba(0,0,0,.2)}
.btm-center-label{font-size:10px;color:var(--g500);font-weight:500;margin-top:2px}

/* Quick Action Overlay */
.qa-overlay{position:fixed;inset:0;z-index:190;opacity:0;pointer-events:none;transition:.35s var(--ease)}
.qa-overlay.show{opacity:1;pointer-events:auto}
.qa-bg{position:absolute;inset:0;background:rgba(255,255,255,.92);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
.qa-panel{position:absolute;bottom:0;left:0;right:0;padding:40px 24px 120px;transform:translateY(30px);opacity:0;transition:.4s var(--ease)}
.qa-overlay.show .qa-panel{transform:translateY(0);opacity:1}
.qa-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;max-width:320px;margin:0 auto}
.qa-item{display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;transition:.2s}
.qa-item:active{transform:scale(.9)}
.qa-icon{width:60px;height:60px;border-radius:18px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.qa-icon svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:1.8;position:relative;z-index:1}
.qa-icon.qi-quiz{background:linear-gradient(135deg,#7c3aed,#a78bfa)}
.qa-icon.qi-pool{background:linear-gradient(135deg,#ec4899,#f472b6)}
.qa-icon.qi-wrong{background:linear-gradient(135deg,#f97316,#fbbf24)}
.qa-icon.qi-wrong svg{stroke:#fff}
.qa-icon.qi-memo{background:linear-gradient(135deg,#e2e8f0,#f1f5f9)}
.qa-icon.qi-memo svg{stroke:#475569}
.qa-icon.qi-notes{background:linear-gradient(135deg,#fce7f3,#fdf2f8)}
.qa-icon.qi-notes svg{stroke:#9d174d}
.qa-icon.qi-import{background:linear-gradient(135deg,#67e8f9,#a5f3fc)}
.qa-icon.qi-import svg{stroke:#0e7490}
.qa-label{font-size:12px;color:var(--g600);font-weight:600;text-align:center}

/* Stat Pills Scroll Container */
.stat-scroll-wrap{position:relative;margin:12px 0 4px}
.stat-pills{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none;scroll-behavior:smooth}
.stat-pills::-webkit-scrollbar{display:none}
.scroll-arrow{position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;background:var(--g0);border:1px solid var(--g200);box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:5;transition:.2s}
.scroll-arrow:hover{background:var(--g100);box-shadow:var(--shm)}
.scroll-arrow:active{transform:translateY(-50%) scale(.9)}
.scroll-arrow svg{width:16px;height:16px;stroke:var(--g600);stroke-width:2.5}
.scroll-arrow.left{left:-6px}
.scroll-arrow.right{right:-6px}
.stat-pill{flex-shrink:0;background:var(--g0);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:10px;box-shadow:var(--sh);border:1px solid var(--g100);min-width:110px;cursor:pointer;transition:.2s var(--ease)}
.stat-pill:active{transform:scale(.97)}
.stat-pill .sp-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.stat-pill .sp-icon svg{width:18px;height:18px;stroke-width:2}
.sp-icon.ic-err{background:var(--rose-l)}
.sp-icon.ic-err svg{stroke:var(--rose)}
.sp-icon.ic-unc{background:var(--amber-l)}
.sp-icon.ic-unc svg{stroke:var(--amber)}
.sp-icon.ic-pool{background:var(--accent-l)}
.sp-icon.ic-pool svg{stroke:var(--accent)}
.sp-icon.ic-memo{background:var(--purple-l)}
.sp-icon.ic-memo svg{stroke:var(--purple)}
.sp-icon.ic-note{background:var(--blue-l)}
.sp-icon.ic-note svg{stroke:var(--blue)}
.stat-pill .sp-num{font-size:18px;font-weight:800;color:var(--g800)}
.stat-pill .sp-lbl{font-size:10px;color:var(--g400);font-weight:500}

/* Stat Hero */
.stat-hero{background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);border-radius:var(--r);padding:24px;margin:12px 0;color:#fff;position:relative;overflow:hidden}
.stat-hero::after{content:'';position:absolute;top:-40%;right:-20%;width:200px;height:200px;background:radial-gradient(circle,rgba(0,196,180,.15) 0%,transparent 70%);border-radius:50%}
.stat-hero .sh-amount{font-size:36px;font-weight:800;letter-spacing:-1px}
.stat-hero .sh-sub{font-size:12px;opacity:.5;margin-top:4px}

/* Cards */
.m-card{background:var(--g0);border-radius:var(--r);padding:20px;margin-bottom:12px;box-shadow:var(--sh);border:1px solid rgba(0,0,0,.03);transition:.2s var(--ease)}

/* Section */
.sec{margin:20px 0 10px}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sec-title{font-size:16px;font-weight:700;color:var(--g800)}

/* Paper Item */
.paper-item{background:var(--g0);border-radius:var(--r);padding:16px 18px;margin-bottom:8px;box-shadow:var(--sh);border:1px solid rgba(0,0,0,.03);cursor:pointer;transition:.2s var(--ease);display:flex;align-items:center;gap:14px}
.paper-item:active{transform:scale(.98)}
.paper-item .pi-icon{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--g100)}
.paper-item .pi-icon svg{width:20px;height:20px;stroke-width:1.8;stroke:var(--g500)}
.paper-item .pi-body{flex:1;min-width:0}
.paper-item .pi-name{font-size:14px;font-weight:600;color:var(--g800);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.paper-item .pi-meta{font-size:11px;color:var(--g400);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.paper-item .pi-parts{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.pi-part-tag{font-size:9px;padding:2px 6px;border-radius:6px;font-weight:600;background:var(--g100);color:var(--g500)}
.pi-part-tag.pt1{background:#fce4ec;color:#c62828}
.pi-part-tag.pt2{background:#e8f5e9;color:#2e7d32}
.pi-part-tag.pt3{background:#fff3e0;color:#e65100}
.pi-part-tag.pt4{background:#e3f2fd;color:#1565c0}
.paper-item .pi-arrow{color:var(--g300);font-size:16px}
.paper-item .pi-actions{display:flex;gap:4px}
.paper-item .pi-act-btn{width:28px;height:28px;border-radius:50%;border:none;background:var(--g100);cursor:pointer;display:flex;align-items:center;justify-content:center}
.paper-item .pi-act-btn svg{width:14px;height:14px;stroke:var(--g500);stroke-width:2}
.paper-item .pi-act-btn:active{background:var(--g200)}

/* Date Filter */
.date-chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.date-chips::-webkit-scrollbar{display:none}
.date-chip{flex-shrink:0;padding:7px 14px;border-radius:20px;border:1.5px solid var(--g200);background:var(--g0);font-size:12px;font-weight:500;color:var(--g500);cursor:pointer;transition:.2s;white-space:nowrap}
.date-chip.on{background:var(--g900);color:#fff;border-color:var(--g900)}

/* Mode Toggle */
.mode-toggle{display:flex;gap:4px;background:var(--g100);padding:3px;border-radius:var(--rs);margin:10px 0}
.mode-toggle button{flex:1;padding:9px;border:none;border-radius:var(--rx);background:transparent;font-size:12px;font-weight:600;cursor:pointer;color:var(--g500);transition:.2s}
.mode-toggle button.on{background:var(--g0);color:var(--g800);box-shadow:0 1px 3px rgba(0,0,0,.06)}

/* Part Item */
.part-item{background:var(--g0);border-radius:var(--r);padding:16px 18px;margin-bottom:8px;box-shadow:var(--sh);cursor:pointer;transition:.2s var(--ease);display:flex;align-items:center;gap:14px;border:1px solid rgba(0,0,0,.03)}
.part-item:active{transform:scale(.98)}
.part-item .pt-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.part-item .pt-icon svg{width:20px;height:20px;stroke-width:1.8}
.pt-icon.pt1{background:#fce4ec}
.pt-icon.pt1 svg{stroke:#c62828}
.pt-icon.pt2{background:#e8f5e9}
.pt-icon.pt2 svg{stroke:#2e7d32}
.pt-icon.pt3{background:#fff3e0}
.pt-icon.pt3 svg{stroke:#e65100}
.pt-icon.pt4{background:#e3f2fd}
.pt-icon.pt4 svg{stroke:#1565c0}
.part-item .pt-body{flex:1}
.part-item .pt-name{font-size:14px;font-weight:600}
.part-item .pt-count{font-size:12px;color:var(--g400)}
.part-item .pt-arrow{color:var(--g300)}

/* Sub Tabs */
.sub-tabs{display:flex;gap:4px;padding:3px;background:var(--g100);border-radius:var(--rs);margin-bottom:14px;overflow-x:auto}
.sub-tab{flex:1;padding:9px 8px;border:none;border-radius:var(--rx);background:transparent;color:var(--g500);font-size:12px;font-weight:600;cursor:pointer;text-align:center;white-space:nowrap;transition:.2s}
.sub-tab.on{background:var(--g0);color:var(--g800);box-shadow:0 1px 3px rgba(0,0,0,.06)}

/* Quiz */
.quiz-header{background:var(--g0);border-radius:var(--r);padding:14px 18px;margin-bottom:12px;box-shadow:var(--sh);display:flex;align-items:center;justify-content:space-between}
.q-progress{font-size:12px;font-weight:600;color:var(--g500)}
.q-timer{font-size:20px;font-weight:800;color:var(--g800);letter-spacing:-1px;font-variant-numeric:tabular-nums}
.timer-btns{display:flex;gap:4px}
.timer-btn{width:30px;height:30px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.timer-btn svg{width:14px;height:14px;stroke-width:2}
.tb-play{background:var(--green-l)}
.tb-play svg{stroke:var(--green)}
.tb-pause{background:var(--amber-l)}
.tb-pause svg{stroke:var(--amber)}
.tb-reset{background:var(--g100)}
.tb-reset svg{stroke:var(--g500)}

/* Q Map */
.qmap-wrap{background:var(--g0);border-radius:var(--rs);padding:10px 12px;margin-bottom:12px;box-shadow:var(--sh)}
.qmap-toggle{width:100%;background:transparent;border:none;padding:4px;font-size:12px;color:var(--g500);cursor:pointer;font-weight:500;display:flex;align-items:center;justify-content:center;gap:4px}
.qmap{display:flex;flex-wrap:wrap;gap:5px;padding:8px 0 4px}
.qmap-dot{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;cursor:pointer;border:1.5px solid var(--g200);background:var(--g0);color:var(--g500);transition:.15s}
.qmap-dot.cur{border-color:var(--g900);background:var(--g900);color:#fff}
.qmap-dot.done{border-color:var(--accent);background:var(--accent-l);color:var(--accent-d)}
.qmap-dot.flag{border-color:var(--amber);background:var(--amber-l);color:var(--amber)}

/* Question Card */
.q-card{background:var(--g0);border-radius:var(--r);padding:22px;box-shadow:var(--sh);margin-bottom:12px}
.q-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.q-num{font-size:11px;color:var(--g400);font-weight:600;letter-spacing:.5px}
.flag-btn{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--g200);background:var(--g0);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.flag-btn svg{width:16px;height:16px;stroke:var(--g400);stroke-width:2;fill:none}
.flag-btn.on{border-color:var(--amber);background:var(--amber-l)}
.flag-btn.on svg{stroke:var(--amber);fill:var(--amber)}
.q-stem{font-size:15px;font-weight:500;line-height:1.9;color:var(--g800);white-space:pre-wrap;margin-bottom:14px}
.opt-btn{width:100%;padding:13px 16px;margin-top:8px;border:1.5px solid var(--g200);border-radius:var(--rs);background:var(--g0);font-size:14px;text-align:left;cursor:pointer;transition:.2s var(--ease);line-height:1.6;display:flex;align-items:center;gap:10px}
.opt-btn:active{transform:scale(.98)}
.opt-btn .opt-letter{width:26px;height:26px;border-radius:50%;background:var(--g100);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--g500);flex-shrink:0}
.opt-btn.sel{border-color:var(--accent);background:var(--accent-l);color:var(--g800)}
.opt-btn.sel .opt-letter{background:var(--accent);color:#fff}
.nav-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}

/* Part Divider */
.part-div{background:var(--g100);border-radius:var(--rs);padding:12px;margin-bottom:10px;text-align:center}
.part-div h4{font-size:13px;font-weight:700;color:var(--g600)}

/* Passage */
.psg-toggle{width:100%;background:var(--g0);border:1.5px solid var(--g200);border-radius:var(--rs);padding:10px 16px;text-align:left;font-size:13px;color:var(--g600);cursor:pointer;font-weight:500;margin-bottom:10px;transition:.15s}
.psg-toggle:active{background:var(--g50)}
.psg-box{background:var(--g0);border:1px solid var(--g200);border-radius:var(--rs);padding:16px;margin-bottom:12px;font-size:15px;line-height:2.2;max-height:260px;overflow-y:auto}

/* Result */
.result-hero{background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);border-radius:var(--r);padding:28px 24px;text-align:center;color:#fff;margin-bottom:16px;position:relative;overflow:hidden}
.result-hero::after{content:'';position:absolute;bottom:-30%;left:-10%;width:200px;height:200px;background:radial-gradient(circle,rgba(0,196,180,.12) 0%,transparent 70%);border-radius:50%}
.result-hero .rh-score{font-size:52px;font-weight:900;letter-spacing:-2px}
.result-hero .rh-pct{font-size:15px;opacity:.7;margin-top:4px;font-weight:500}
.result-hero .rh-time{font-size:12px;opacity:.4;margin-top:4px}
.result-hero .rh-detail{font-size:11px;opacity:.5;margin-top:6px;line-height:1.6}
.result-dots{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin:12px 0}
.dot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;cursor:pointer;transition:.2s var(--ease)}
.dot:active{transform:scale(1.3)}
.dot.ok{background:var(--green)}.dot.ng{background:var(--rose)}.dot.sk{background:var(--g300)}
.dot.expanded{transform:scale(1.3);box-shadow:0 2px 8px rgba(0,0,0,.2)}

/* Review Item */
.ri{background:var(--g0);border-radius:var(--rs);margin-bottom:6px;overflow:hidden;box-shadow:var(--sh);border:1px solid rgba(0,0,0,.03)}
.ri.rw{border-left:3px solid var(--rose)}.ri.rr{border-left:3px solid var(--green)}
.ri-h{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-size:12px;font-weight:600}
.ri-h:active{background:var(--g50)}
.ri-tag{font-size:10px;padding:3px 8px;border-radius:12px;font-weight:600}
.ri-tag-g{background:var(--green-l);color:var(--green)}
.ri-tag-r{background:var(--rose-l);color:var(--rose)}
.ri-tag-w{background:var(--amber-l);color:var(--amber)}
.ri-b{padding:0 14px 14px;border-top:1px solid var(--g100);display:none;font-size:13px;line-height:1.8}
.ri-b.show{display:block;padding-top:12px}
.ri-b .lbl{font-weight:700;color:var(--g400);font-size:10px;margin-top:8px;margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px}
.ri-b .opt-correct{color:var(--green);font-weight:600}
.ri-b .opt-wrong{color:var(--rose);text-decoration:line-through}

/* History Card */
.hi-card{background:var(--g0);border-radius:var(--r);padding:16px 18px;margin-bottom:8px;box-shadow:var(--sh);border:1px solid rgba(0,0,0,.03);cursor:pointer;transition:.2s var(--ease)}
.hi-card:active{transform:scale(.98)}
.hi-card .hi-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.hi-card .hi-date{font-size:11px;color:var(--g400);font-weight:500;display:flex;align-items:center;gap:6px}
.hi-card .hi-date svg{width:12px;height:12px;stroke:var(--g400);stroke-width:2}
.hi-card .hi-title{font-size:14px;font-weight:700;color:var(--g800);margin-bottom:2px}
.hi-card .hi-bottom{display:flex;align-items:center;gap:12px}
.hi-card .hi-score{font-size:14px;color:var(--accent-d);font-weight:700}
.hi-card .hi-time{font-size:11px;color:var(--g400);display:flex;align-items:center;gap:3px}
.hi-card .hi-time svg{width:11px;height:11px;stroke:var(--g400);stroke-width:2}
.hi-card .hi-paper{font-size:11px;color:var(--g500);background:var(--g100);padding:2px 8px;border-radius:8px}

/* Pool Group */
.pool-group{background:var(--g0);border-radius:var(--r);margin-bottom:8px;box-shadow:var(--sh);overflow:hidden}
.pool-group-head{padding:14px 18px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.pool-group-head:active{background:var(--g50)}
.pool-group-head .pg-label{font-size:13px;font-weight:600}
.pool-group-head .pg-right{display:flex;align-items:center;gap:8px}
.pool-group-head .pg-count{font-size:11px;padding:3px 8px;border-radius:12px;background:var(--accent-l);color:var(--accent-d);font-weight:600}
.pool-group-head .pg-arrow{transition:.2s;color:var(--g400)}
.pool-group-head .pg-arrow svg{width:14px;height:14px;stroke:var(--g400);stroke-width:2;transition:.2s}
.pool-group-head .pg-arrow.open svg{transform:rotate(180deg)}
.pool-group-body{border-top:1px solid var(--g100);padding:12px 18px;display:none}
.pool-group-body.show{display:block}

function tStart(){if(S._tID)clearInterval(S._tID);S.tOn=true;S._tID=setInterval(()=>{S.tSec++;const e=document.getElementById('tmr');if(e)e.textContent=fmtT(S.tSec)},1000)}
function tPause(){S.tOn=false;if(S._tID){clearInterval(S._tID);S._tID=null}}
function tReset(){tPause();S.tSec=0}
function tStop(){tPause()}
function getPrompt(key){return CUSTOM_PROMPTS[key]||DEFAULT_PROMPTS[key]||''}
function buildSave(){return{v:'12',savedAt:nowStr(),wb:WB,ub:UB,hist:HIST,memo:MEMO,notes:NOTES,pc:PC,psg:PSG,pool:POOL,papers:PAPERS,customPrompts:CUSTOM_PROMPTS}}
function applyLoad(d){if(d.wb)WB=d.wb;if(d.ub)UB=d.ub;if(d.hist)HIST=d.hist;if(d.psg)PSG=d.psg;if(d.pc!==undefined)PC=d.pc;if(d.pool){for(let i=1;i<=4;i++)POOL[i]=d.pool[i]||[]}if(d.papers)PAPERS=d.papers;if(d.memo)MEMO=d.memo;if(d.notes)NOTES=d.notes;if(d.customPrompts)CUSTOM_PROMPTS=d.customPrompts;for(let i=1;i<=4;i++){if(!WB[i])WB[i]=[];if(!UB[i])UB[i]=[];if(!POOL[i])POOL[i]=[]}if(!MEMO)MEMO=[];if(!NOTES)NOTES=[];if(!CUSTOM_PROMPTS)CUSTOM_PROMPTS={}}
function cloudSaveAll(){const el=document.getElementById('cloudSt');if(el){el.className='cloud-status show loading';el.textContent='儲存中…';}fetch(CLOUD_URL,{method:'POST',body:JSON.stringify({token:CLOUD_TOKEN,file:CLOUD_FILE,data:JSON.stringify(buildSave())})}).then(r=>r.json()).then(res=>{if(res.ok){if(el){el.className='cloud-status show ok';el.textContent='已儲存 · '+nowStr();}toast('已儲存')}else{if(el){el.className='cloud-status show err';el.textContent='錯誤：'+(res.msg||'');}}}).catch(err=>{if(el){el.className='cloud-status show err';el.textContent='錯誤：'+err.message;}})}
function cloudLoadAll(cb){const el=document.getElementById('cloudSt');if(el){el.className='cloud-status show loading';el.textContent='讀取中…';}fetch(CLOUD_URL+'?token='+encodeURIComponent(CLOUD_TOKEN)+'&file='+encodeURIComponent(CLOUD_FILE)).then(r=>r.json()).then(res=>{if(res.ok){let d;try{d=JSON.parse(res.data)}catch(e){}if(d)applyLoad(d);if(el){el.className='cloud-status show ok';el.textContent='已讀取';}toast('已讀取')}else{if(el){el.className='cloud-status show err';el.textContent='未找到';}}if(cb)cb();R()}).catch(err=>{if(el){el.className='cloud-status show err';el.textContent='錯誤：'+err.message;}if(cb)cb();R()})}

function toggleQA(){
if(S.qaOpen){closeQA()}else{openQA()}
}
function openQA(){S.qaOpen=true;const ov=document.getElementById('qaOv');ov.classList.add('show');const g=document.getElementById('qaGrid');
g.innerHTML=`<div class="qa-item" onclick="closeQA();S.tab='home';R()"><div class="qa-icon qi-quiz">${IC.grid}</div><div class="qa-label">做題</div></div><div class="qa-item" onclick="closeQA();S.tab='pool';R()"><div class="qa-icon qi-pool">${IC.layers}</div><div class="qa-label">題池</div></div><div class="qa-item" onclick="closeQA();S.tab='wrong';R()"><div class="qa-icon qi-wrong">${IC.xCirc}</div><div class="qa-label">錯題</div></div><div class="qa-item" onclick="closeQA();S.tab='memo';R()"><div class="qa-icon qi-memo">${IC.memo}</div><div class="qa-label">Memo</div></div><div class="qa-item" onclick="closeQA();S.tab='notes';R()"><div class="qa-icon qi-notes">${IC.notebook}</div><div class="qa-label">筆記</div></div><div class="qa-item" onclick="closeQA();S.tab='prompt';R()"><div class="qa-icon qi-import">${IC.file}</div><div class="qa-label">Prompt</div></div>`;
const cb=document.querySelector('.btm-center-btn');if(cb)cb.classList.add('open')}
function closeQA(){S.qaOpen=false;document.getElementById('qaOv').classList.remove('show');const cb=document.querySelector('.btm-center-btn');if(cb)cb.classList.remove('open')}

function scrollPills(dir){const el=document.getElementById('statPills');if(!el)return;el.scrollBy({left:dir*140,behavior:'smooth'})}

function R(){const app=document.getElementById('app');if(S.page==='quiz')renderQuiz(app);else if(S.page==='result')renderResult(app);else if(S.page==='detail')renderDetail(app);else if(S.page==='paperView')renderPaperView(app);else renderHome(app)}

function renderBottomBar(){
return`<nav class="btm-nav"><div class="btm-nav-inner"><button class="btm-item ${S.tab==='home'?'active':''}" onclick="S.tab='home';R()"><span class="bi-icon">${IC.home}</span>主頁</button><button class="btm-item ${S.tab==='save'?'active':''}" onclick="S.tab='save';R()"><span class="bi-icon">${IC.save}</span>存檔</button><div class="btm-center"><button class="btm-center-btn ${S.qaOpen?'open':''}" onclick="toggleQA()">${IC.plus}</button><span class="btm-center-label">起動</span></div><button class="btm-item ${S.tab==='import'?'active':''}" onclick="S.tab='import';R()"><span class="bi-icon">${IC.import2}</span>匯入</button><button class="btm-item ${S.tab==='history'?'active':''}" onclick="S.tab='history';R()"><span class="bi-icon">${IC.clock}</span>記錄</button></div></nav>`;
}

function renderHome(app){
let h=`<div class="container" style="padding-top:20px">`;
if(S.tab==='home')h+=tabHome();
else if(S.tab==='pool')h+=tabPool();
else if(S.tab==='wrong')h+=tabWrong();
else if(S.tab==='memo')h+=tabMemo();
else if(S.tab==='notes')h+=tabNotes();
else if(S.tab==='history')h+=tabHist();
else if(S.tab==='import')h+=tabImport();
else if(S.tab==='prompt')h+=tabPrompt();
else h+=tabSave();
h+=`</div>${renderBottomBar()}`;app.innerHTML=h;
}

function getUniqueDates(){const dates=[...new Set(PAPERS.map(p=>p.date))];dates.sort((a,b)=>b.localeCompare(a));return dates}
function getFilteredPapers(){if(S.dateFilter==='all')return PAPERS.slice().reverse();return PAPERS.filter(p=>p.date===S.dateFilter).reverse()}
function getPaperQCount(pid){let c=0;for(let i=1;i<=4;i++)c+=POOL[i].filter(q=>q.paperId===pid).length;return c}
function getPaperParts(pid){const parts=[];for(let i=1;i<=4;i++){const n=POOL[i].filter(q=>q.paperId===pid).length;if(n>0)parts.push({id:i,count:n})}return parts}

function tabHome(){
const tw=Object.values(WB).reduce((a,b)=>a+b.length,0);
const tu=Object.values(UB).reduce((a,b)=>a+b.length,0);
const tp=Object.values(POOL).reduce((a,b)=>a+b.length,0);
let h='';
h+=`<div class="stat-hero"><div class="sh-amount">${HIST.length} <span style="font-size:14px;opacity:.6">次練習</span></div><div class="sh-sub">題池 ${tp} 題 · ${PAPERS.length} 份Paper</div></div>`;
// Scrollable stat pills with arrows
h+=`<div class="stat-scroll-wrap"><button class="scroll-arrow left" onclick="scrollPills(-1)">${IC.chevLeft}</button><div class="stat-pills" id="statPills">`;
h+=`<div class="stat-pill" onclick="S.tab='wrong';S.wbSub='wrong';R()"><div class="sp-icon ic-err">${IC.xCirc}</div><div><div class="sp-num">${tw}</div><div class="sp-lbl">錯題</div></div></div>`;
h+=`<div class="stat-pill" onclick="S.tab='wrong';S.wbSub='uncertain';R()"><div class="sp-icon ic-unc">${IC.alert}</div><div><div class="sp-num">${tu}</div><div class="sp-lbl">不確定</div></div></div>`;
h+=`<div class="stat-pill" onclick="S.tab='pool';R()"><div class="sp-icon ic-pool">${IC.layers}</div><div><div class="sp-num">${tp}</div><div class="sp-lbl">題池</div></div></div>`;
h+=`<div class="stat-pill" onclick="S.tab='memo';R()"><div class="sp-icon ic-memo">${IC.memo}</div><div><div class="sp-num">${MEMO.length}</div><div class="sp-lbl">Memo</div></div></div>`;
h+=`<div class="stat-pill" onclick="S.tab='notes';R()"><div class="sp-icon ic-note">${IC.notebook}</div><div><div class="sp-num">${NOTES.length}</div><div class="sp-lbl">筆記</div></div></div>`;
h+=`</div><button class="scroll-arrow right" onclick="scrollPills(1)">${IC.chevRight}</button></div>`;
// Papers
h+=`<div class="sec"><div class="sec-head"><div class="sec-title">選Paper做題</div></div></div>`;
const dates=getUniqueDates();
if(dates.length>0){
h+=`<div class="date-chips"><div class="date-chip ${S.dateFilter==='all'?'on':''}" onclick="S.dateFilter='all';R()">全部</div>`;
dates.forEach(d=>{const cnt=PAPERS.filter(p=>p.date===d).length;h+=`<div class="date-chip ${S.dateFilter===d?'on':''}" onclick="S.dateFilter='${d}';R()">${d}（${cnt}）</div>`});
h+=`</div>`}
const filtered=getFilteredPapers();
if(!filtered.length)h+=`<div class="empty">${IC.file}<div>未有Paper，去「匯入」加卷</div></div>`;
else filtered.forEach(p=>{
const cnt=getPaperQCount(p.id);
const parts=getPaperParts(p.id);
if(S.editingPaper===p.id){
h+=`<div class="paper-item" style="cursor:default"><div class="inline-edit" style="width:100%"><input id="editN_${p.id}" value="${esc(p.label)}"><button style="background:var(--green);color:#fff" onclick="savePaperName('${p.id}')">✓</button><button style="background:var(--g200);color:var(--g600)" onclick="S.editingPaper=null;R()">✕</button></div></div>`;
}else{
h+=`<div class="paper-item" onclick="openPaperView('${p.id}')"><div class="pi-icon">${IC.file}</div><div class="pi-body"><div class="pi-name">${esc(p.label)}</div><div class="pi-meta"><span>${p.date}</span><span>${cnt}題</span></div>`;
if(parts.length>0){h+=`<div class="pi-parts">${parts.map(pt=>`<span class="pi-part-tag pt${pt.id}">P${pt.id} ${pt.count}題</span>`).join('')}</div>`}
h+=`</div><div class="pi-actions" onclick="event.stopPropagation()"><button class="pi-act-btn" onclick="S.editingPaper='${p.id}';R()">${IC.edit}</button></div><span class="pi-arrow">${IC.chevRight}</span></div>`;
}});
// Mix
if(PAPERS.length){
h+=`<div class="sec"><div class="sec-head"><div class="sec-title">混合練習</div></div></div>`;
h+=`<div class="mix-card">`;
PAPERS.slice().reverse().forEach(p=>{const cnt=getPaperQCount(p.id);h+=`<div class="mix-item"><input type="checkbox" class="shp-cb" value="${p.id}" checked><div class="mi-body"><div class="mi-name">${esc(p.label)}</div><div class="mi-sub">${p.date}</div></div><div class="mi-count">${cnt}題</div></div>`});
h+=`<div class="mode-toggle"><button class="on" id="mt-shuffle" onclick="this.classList.add('on');document.getElementById('mt-order').classList.remove('on')">撈亂</button><button id="mt-order" onclick="this.classList.add('on');document.getElementById('mt-shuffle').classList.remove('on')">按次序</button></div>`;
h+=`<div style="margin:10px 0;display:flex;align-items:center;gap:8px"><span style="font-size:12px;font-weight:500">抽取上限</span><input type="number" id="shNum" value="0" min="0" style="width:60px;border:1.5px solid var(--g200);border-radius:8px;padding:7px 10px;font-size:13px"><span style="font-size:11px;color:var(--g400)">0=全部</span></div>`;
h+=`<button class="btn btn-dark" onclick="startMixPractice()">開始練習</button></div>`;}
return h;
}
function savePaperName(pid){const input=document.getElementById('editN_'+pid);if(!input)return;const p=PAPERS.find(x=>x.id===pid);if(p)p.label=input.value.trim()||p.label;S.editingPaper=null;toast('已更新');cloudSaveAll();R()}

function openPaperView(paperId){S._paperView=paperId;S.page='paperView';R()}
function renderPaperView(app){
const paper=PAPERS.find(p=>p.id===S._paperView);if(!paper){goHome();return}
let h=`<div class="container" style="padding-top:20px"><div style="display:flex;align-items:center;gap:12px;margin-bottom:16px"><button class="pg-back" onclick="goHome()">${IC.chevLeft}</button><div style="flex:1;font-size:18px;font-weight:700">${esc(paper.label)}</div></div>`;
h+=`<div class="info-box ib-accent">${paper.date} · ${paper.type} · 共${getPaperQCount(paper.id)}題</div>`;
const allQ=getAllPaperQs(paper.id);
if(allQ.length>0)h+=`<button class="btn btn-dark" style="margin-bottom:16px" onclick="startPaperFull('${paper.id}')">做全份（${allQ.length}題）</button>`;
h+=`<div class="sec"><div class="sec-head"><div class="sec-title">分Part練習</div></div></div>`;
PM.forEach(pm=>{const pqs=POOL[pm.id].filter(q=>q.paperId===paper.id);if(!pqs.length)return;h+=`<div class="part-item" onclick="startPaperPart('${paper.id}',${pm.id})"><div class="pt-icon ${pm.grad}">${pm.icon}</div><div class="pt-body"><div class="pt-name">${pm.name}</div><div class="pt-count">${pqs.length}題</div></div><span class="pt-arrow">${IC.chevRight}</span></div>`});
h+=`<div class="sec"><div class="sec-head"><div class="sec-title">自選</div></div></div><div class="m-card"><div class="part-select">`;
PM.forEach(pm=>{const n=POOL[pm.id].filter(q=>q.paperId===paper.id).length;if(!n)return;h+=`<label><input type="checkbox" class="pv-cb" value="${pm.id}" checked><span>P${pm.id}（${n}）</span></label>`});
h+=`</div><div class="mode-toggle"><button class="on" id="pv-order" onclick="this.classList.add('on');document.getElementById('pv-shuffle').classList.remove('on')">按次序</button><button id="pv-shuffle" onclick="this.classList.add('on');document.getElementById('pv-order').classList.remove('on')">撈亂</button></div>`;
h+=`<button class="btn btn-accent" style="margin-top:10px" onclick="startPaperCustom('${paper.id}')">開始</button></div>`;
h+=`</div>${renderBottomBar()}`;app.innerHTML=h;
}
function getAllPaperQs(paperId){let all=[];for(let i=1;i<=4;i++){POOL[i].filter(q=>q.paperId===paperId).forEach(q=>{all.push({...JSON.parse(JSON.stringify(q)),_part:i})})}return all}
function startPaperFull(paperId){const paper=PAPERS.find(p=>p.id===paperId);if(!paper)return;const all=getAllPaperQs(paperId);if(!all.length){toast('冇題目');return}S._curPsg=paper.passage||'';S._paperLabels=paper.label;beginQ(all,'order',0,paper.type==='全份卷')}
function startPaperPart(paperId,partId){const paper=PAPERS.find(p=>p.id===paperId);if(!paper)return;const qs=POOL[partId].filter(q=>q.paperId===paperId).map(q=>({...JSON.parse(JSON.stringify(q)),_part:partId}));if(!qs.length){toast('冇題目');return}S._curPsg=paper.passage||'';S._paperLabels=paper.label;beginQ(qs,'order',partId,false)}
function startPaperCustom(paperId){const paper=PAPERS.find(p=>p.id===paperId);if(!paper)return;const cbs=document.querySelectorAll('.pv-cb:checked');if(!cbs.length){toast('請揀Part');return}const parts=[...cbs].map(c=>parseInt(c.value));let all=[];parts.forEach(pid=>{POOL[pid].filter(q=>q.paperId===paperId).forEach(q=>{all.push({...JSON.parse(JSON.stringify(q)),_part:pid})})});if(!all.length){toast('冇題目');return}const isShuffle=document.getElementById('pv-shuffle')&&document.getElementById('pv-shuffle').classList.contains('on');if(isShuffle)all=shuffleArr(all);S._curPsg=paper.passage||'';S._paperLabels=paper.label;beginQ(all,isShuffle?'shuffle':'order',parts.length===1?parts[0]:0,false)}

function tabPool(){
if(S.poolPart)return tabPoolDetail(S.poolPart);
const tp=Object.values(POOL).reduce((a,b)=>a+b.length,0);
let h=`<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px"><button class="pg-back" onclick="S.tab='home';R()">${IC.chevLeft}</button></div>`;
h+=`<div class="info-box ib-accent">共 <strong>${tp}</strong> 題 · <strong>${PAPERS.length}</strong> 份Paper</div>`;
PM.forEach(p=>{h+=`<div class="part-item" onclick="S.poolPart=${p.id};R()"><div class="pt-icon ${p.grad}">${p.icon}</div><div class="pt-body"><div class="pt-name">${p.name}</div><div class="pt-count">${(POOL[p.id]||[]).length}題</div></div><span class="pt-arrow">${IC.chevRight}</span></div>`});
h+=`<div class="sec"><div class="sec-head"><div class="sec-title">Papers</div></div></div>`;
if(!PAPERS.length)h+=`<div class="empty">${IC.file}<div>未有Paper</div></div>`;
else PAPERS.slice().reverse().forEach(p=>{const cnt=getPaperQCount(p.id);h+=`<div class="paper-item" style="cursor:default"><div class="pi-icon">${IC.file}</div><div class="pi-body"><div class="pi-name">${esc(p.label)}</div><div class="pi-meta"><span>${p.date}</span><span>${cnt}題</span></div></div><div class="pi-actions" onclick="event.stopPropagation()"><button class="pi-act-btn" onclick="delPaper('${p.id}')">${IC.trash}</button></div></div>`});
return h;
}
function tabPoolDetail(pid){
const pm=PM.find(p=>p.id===pid);const items=POOL[pid]||[];
const groups={};items.forEach(q=>{const k=q.paperId||'unknown';if(!groups[k])groups[k]=[];groups[k].push(q)});
let h=`<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px"><button class="pg-back" onclick="S.poolPart=null;R()">${IC.chevLeft}</button><span style="font-size:16px;font-weight:700">${pm.short}（${items.length}）</span></div>`;
Object.keys(groups).forEach(paperId=>{
const paper=PAPERS.find(p=>p.id===paperId);const pqs=groups[paperId];
const isOpen=S.poolGroupOpen[paperId];
h+=`<div class="pool-group"><div class="pool-group-head" onclick="togglePoolGroup('${paperId}')"><div class="pg-label">${esc(paper?paper.label:'未分類')}</div><div class="pg-right"><span class="pg-count">${pqs.length}題</span><button class="btn btn-dark btn-sm" onclick="event.stopPropagation();startPoolPartPaper('${paperId}',${pid})">練習</button><span class="pg-arrow ${isOpen?'open':''}">${IC.chevDown}</span></div></div>`;
h+=`<div class="pool-group-body ${isOpen?'show':''}">`;
pqs.forEach((q,i)=>{h+=`<div class="pq-item"><strong>Q${i+1}</strong> ${esc((q.stem||'').substring(0,60))}${(q.stem||'').length>60?'…':''}</div>`});
h+=`</div></div>`;});return h;
}
function togglePoolGroup(id){S.poolGroupOpen[id]=!S.poolGroupOpen[id];R()}
function startPoolPartPaper(paperId,partId){const paper=PAPERS.find(p=>p.id===paperId);const qs=POOL[partId].filter(q=>q.paperId===paperId).map(q=>({...JSON.parse(JSON.stringify(q)),_part:partId}));if(!qs.length){toast('冇題目');return}S._curPsg=(paper&&paper.passage)||'';S._paperLabels=paper?paper.label:'';beginQ(qs,'order',partId,false)}
function delPaper(id){showM('刪除Paper','刪除此Paper及全部題目？',()=>{for(let i=1;i<=4;i++)POOL[i]=POOL[i].filter(q=>q.paperId!==id);PAPERS=PAPERS.filter(p=>p.id!==id);cloudSaveAll();toast('已刪除');R()},'刪除')}

function tabWrong(){
const tw=Object.values(WB).reduce((a,b)=>a+b.length,0);const tu=Object.values(UB).reduce((a,b)=>a+b.length,0);
let h=`<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px"><button class="pg-back" onclick="S.tab='home';R()">${IC.chevLeft}</button></div>`;
h+=`<div class="sub-tabs"><button class="sub-tab ${S.wbSub==='wrong'?'on':''}" onclick="S.wbSub='wrong';R()">錯題（${tw}）</button><button class="sub-tab ${S.wbSub==='uncertain'?'on':''}" onclick="S.wbSub='uncertain';R()">不確定（${tu}）</button></div>`;
if(S.wbSub==='wrong')h+=renderBank(WB,'wrong');else h+=renderBank(UB,'uncertain');return h;
}
function renderBank(bank,type){
const total=Object.values(bank).reduce((a,b)=>a+b.length,0);
if(!total)return`<div class="empty">${type==='wrong'?IC.xCirc:IC.alert}<div>${type==='wrong'?'冇錯題':'未標記'}</div></div>`;
let h=`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px"><button class="btn ${type==='wrong'?'btn-danger':'btn-accent'} btn-sm" onclick="startBankShuffle('${type}')">重做全部（${total}）</button><button class="btn btn-ghost btn-sm" onclick="showM('清空','確定？',()=>{${type==='wrong'?'WB':'UB'}={1:[],2:[],3:[],4:[]};toast('已清空');R()})">清空</button></div>`;
PM.forEach(p=>{const items=bank[p.id]||[];if(!items.length)return;
h+=`<div class="sec"><div class="sec-head"><div class="sec-title">${p.short}（${items.length}）</div><button class="btn btn-sm btn-outline" onclick="startReview(${p.id},'${type}')">重做</button></div></div>`;
items.forEach((q,i)=>{h+=bankItem(q,i,p.id,type)});});return h;
}
function bankItem(q,idx,pid,bank){
const isW=bank==='wrong';const cls=isW?'rw':'';
const elId=bank+pid+'_'+idx;
let h=`<div class="ri ${cls}"><div class="ri-h" onclick="togB('${elId}')"><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px">${esc((q.stem||'').substring(0,40))}</span><span style="display:flex;align-items:center;gap:4px"><span class="ri-tag ${isW?'ri-tag-r':'ri-tag-w'}">${isW?'錯誤':'不確定'}</span><button class="ri-del" onclick="event.stopPropagation();delBank('${bank}',${pid},${idx})">${IC.x}</button></span></div>`;
h+=`<div class="ri-b" id="${elId}"><div class="lbl">題目</div><div style="white-space:pre-wrap;margin-bottom:5px">${esc(q.stem)}</div><div class="lbl">選項</div>`;
(q.options||[]).forEach((o,j)=>{let c='';if(j===q.answer)c='opt-correct';else if(j===q.yourAnswer&&j!==q.answer)c='opt-wrong';h+=`<div class="${c}">${'ABCD'[j]}. ${esc(o)}${j===q.answer?' ✓':''}${j===q.yourAnswer&&j!==q.answer?' ←你揀':''}</div>`});

function renderQuiz(app){

let h=`<div class="container" style="padding-top:16px"><div style="display:flex;align-items:center;gap:10px;margin-bottom:12px"><button class="pg-back" onclick="showM('離開','進度不保存',goHome,'離開')">${IC.chevLeft}</button></div>`;

h+=S.tOn?`<button class="timer-btn tb-pause" onclick="tPause();R()">${IC.pause}</button>`:`<button class="timer-btn tb-play" onclick="tStart();R()">${IC.play}</button>`;

if(S.mapOpen){h+=`<div class="qmap">`;qs.forEach((qq,i)=>{let cls='qmap-dot';if(i===S.qi)cls+=' cur';if(S.flags[i])cls+=' flag';else if(S.ans[i]!==undefined)cls+=' done';h+=`<div class="${cls}" onclick="S.qi=${i};R()">${i+1}</div>`});h+=`</div>`}
h+=`</div>`;
if(q._part){const prev=S.qi>0?qs[S.qi-1]:null;if(!prev||prev._part!==q._part){const pm=PM.find(p=>p.id===q._part);h+=`<div class="part-div"><h4>${pm?pm.name:''}</h4></div>`}}
if(q._part===1&&q.passage&&S._curPsg){h+=`<button class="psg-toggle" onclick="S.psgOpen=!S.psgOpen;R()">${S.psgOpen?'收起':'展開'}文章</button>`;if(S.psgOpen)h+=`<div class="psg-box">${S._curPsg.replace(/\n/g,'<br>')}</div>`}
h+=`<div class="q-card"><div class="q-head"><span class="q-num">${q._part?partShort(q._part)+' · ':''}Q${S.qi+1}</span><button class="flag-btn ${S.flags[S.qi]?'on':''}" onclick="S.flags[S.qi]=!S.flags[S.qi];R()">${IC.flag}</button></div>`;
h+=`<div class="q-stem">${esc(q.stem).replace(/\n/g,'<br>')}</div>`;

h+=`</div></div>`;app.innerHTML=h;
}
function preSubmit(){const qs=S.qs;const un=qs.filter((_,i)=>S.ans[i]===undefined).length;const fl=Object.values(S.flags).filter(Boolean).length;let msg=`共${qs.length}題`;if(un)msg+=`\n${un}題未答`;if(fl)msg+=`\n${fl}題不確定`;showM('交卷',msg,submitQ,'交卷')}

function renderResult(app){
const qs=S.qs;let cor=0;qs.forEach((q,i)=>{if(S.ans[i]===q.answer)cor++});
const pct=qs.length?Math.round(cor/qs.length*100):0;
let h=`<div class="container" style="padding-top:16px">`;
h+=`<div class="result-hero"><div class="rh-score">${cor}/${qs.length}</div><div class="rh-pct">${pct}%</div><div class="rh-time">用時 ${fmtT(S.tSec)}</div>`;
if(S._paperLabels)h+=`<div class="rh-detail">${esc(S._paperLabels)}</div>`;
if(S.isFP||S.part===0){h+=`<div class="bd">`;PM.forEach(p=>{const pqs=qs.filter(q=>q._part===p.id);if(!pqs.length)return;const pc=pqs.filter(q=>{const gi=qs.indexOf(q);return S.ans[gi]===q.answer}).length;h+=`<div class="bd-i"><div class="bl">${p.short}</div><div class="bs">${pc}/${pqs.length}</div></div>`});h+=`</div>`}
h+=`<div class="result-dots">`;qs.forEach((q,i)=>{const a=S.ans[i];const cls=a===undefined?'sk':a===q.answer?'ok':'ng';h+=`<div class="dot ${cls} ${S.expandedDot===i?'expanded':''}" onclick="toggleDot(${i})">${i+1}</div>`});h+=`</div></div>`;
if(S._bu)h+=`<div class="bank-msg">+${S._bu.a}錯題 · ${S._bu.r}掌握 · 現存${S._bu.tw}題</div>`;

if(S.expandedDot!==null&&S.expandedDot>=0&&S.expandedDot<qs.length){
const ei=S.expandedDot,eq=qs[ei],eua=S.ans[ei],eok=eua===eq.answer;
h+=`<div class="m-card" style="border-left:3px solid ${eok?'var(--green)':'var(--rose)'}"><div style="font-size:11px;color:var(--g400);margin-bottom:6px">Q${ei+1} · ${eok?'正確':'錯誤'}</div><div style="font-size:13px;line-height:1.8;white-space:pre-wrap;margin-bottom:8px">${esc(eq.stem)}</div>`;
eq.options.forEach((o,j)=>{let c='';if(j===eq.answer)c='color:var(--green);font-weight:600';else if(j===eua&&!eok)c='color:var(--rose);text-decoration:line-through';h+=`<div style="${c};font-size:13px;padding:2px 0">${'ABCD'[j]}. ${esc(o)}${j===eq.answer?' ✓':''}${j===eua&&!eok?' ←':''}</div>`});
if(eq.explanation)h+=`<div style="margin-top:6px;font-size:12px;color:var(--g500)">${esc(eq.explanation)}</div>`;
h+=`</div>`;
}

h+=`<div class="sec"><div class="sec-head"><div class="sec-title">逐題溫習</div></div></div>`;
let lp=0;qs.forEach((q,i)=>{if(q._part&&q._part!==lp){lp=q._part;const pm=PM.find(p=>p.id===q._part);h+=`<div class="part-div"><h4>${pm?pm.name:''}</h4></div>`}const ua=S.ans[i],ok=ua===q.answer;h+=riItem(q,i,ua,ok)});
h+=`<button class="btn btn-dark" style="margin-top:16px" onclick="goHome()">返回</button></div>${renderBottomBar()}`;app.innerHTML=h;
}
function toggleDot(i){S.expandedDot=S.expandedDot===i?null:i;R()}
function riItem(q,i,ua,ok){let h=`<div class="ri ${ok?'rr':'rw'}"><div class="ri-h" onclick="togRI(${i})"><span>${ok?'✓':'✗'} Q${i+1}</span><span class="ri-tag ${ok?'ri-tag-g':'ri-tag-r'}">${ok?'正確':'錯誤'}</span></div><div class="ri-b" id="rb${i}"><div class="lbl">題目</div><div style="white-space:pre-wrap;margin-bottom:5px">${esc(q.stem)}</div><div class="lbl">選項</div>`;q.options.forEach((o,j)=>{let cls='';if(j===q.answer)cls='opt-correct';else if(j===ua&&!ok)cls='opt-wrong';h+=`<div class="${cls}">${'ABCD'[j]}. ${esc(o)}${j===q.answer?' ✓':''}${j===ua&&!ok?' ←你揀':''}</div>`});if(!ok&&ua!==undefined)h+=`<div class="lbl">你揀</div><div style="color:var(--rose)">${'ABCD'[ua]}</div>`;h+=`<div class="lbl">正確</div><div style="color:var(--green);font-weight:600">${'ABCD'[q.answer]}</div>`;if(q.explanation)h+=`<div class="lbl">解釋</div><div>${esc(q.explanation)}</div>`;h+=`</div></div>`;return h}
function togRI(i){const e=document.getElementById('rb'+i);if(e)e.classList.toggle('show')}
function renderDetail(app){const r=HIST.find(x=>x.id===S.viewRec);if(!r||!r.questions){toast('無法載入');goHome();return}S.qs=r.questions;S.ans=r.answers||{};S.isFP=r.isFP;S.part=r.part;S.tSec=r.time;S._bu=null;S._curPsg=r.passage||'';S._paperLabels=r.paperLabels||'';S.expandedDot=null;renderResult(app)}

// Actions
function goHome(){tStop();S.page='home';S.expandedDot=null;R()}
function pickA(i){S.ans[S.qi]=i;R()}
function viewR(id){S.viewRec=id;S.page='detail';R();scrollTo(0,0)}
function startMixPractice(){const cbs=document.querySelectorAll('.shp-cb:checked');if(!cbs.length){toast('請揀Paper');return}const ids=[...cbs].map(c=>c.value);let all=[];for(let i=1;i<=4;i++){POOL[i].filter(q=>ids.includes(q.paperId)).forEach(q=>{all.push({...JSON.parse(JSON.stringify(q)),_part:i})})}if(!all.length){toast('冇題目');return}const isShuffle=document.getElementById('mt-shuffle')&&document.getElementById('mt-shuffle').classList.contains('on');if(isShuffle)all=shuffleArr(all);const numEl=document.getElementById('shNum');let num=numEl?parseInt(numEl.value):0;if(num>0&&num<all.length)all=all.slice(0,num);const fp=PAPERS.find(p=>ids.includes(p.id)&&p.passage);S._curPsg=fp?fp.passage:'';S._paperLabels=ids.map(id=>{const p=PAPERS.find(x=>x.id===id);return p?p.label:''}).filter(Boolean).join(', ');beginQ(all,isShuffle?'shuffle':'order',0,false)}
function startReview(pid,bank){const src=bank==='wrong'?WB:UB;if(!src[pid]||!src[pid].length){toast('冇題目');return}let qs=JSON.parse(JSON.stringify(src[pid]));qs.forEach(q=>q._part=pid);S._curPsg='';beginQ(qs,'review',pid,false)}
function startBankShuffle(bank){const src=bank==='wrong'?WB:UB;let all=[];Object.keys(src).forEach(k=>src[k].forEach(q=>all.push({...JSON.parse(JSON.stringify(q)),_part:+k})));if(!all.length){toast('冇題目');return}shuffleArr(all);S._curPsg='';beginQ(all,'shuffle',0,false)}
function beginQ(qs,mode,part,fp){S.page='quiz';S.qs=qs;S.mode=mode;S.part=part;S.isFP=fp;S.qi=0;S.ans={};S.flags={};S.tSec=0;S.tOn=false;S.mapOpen=false;S._bu=null;S.expandedDot=null;if(S._tID){clearInterval(S._tID);S._tID=null}R()}

function submitQ(){
tStop();const qs=S.qs;const t=nowStr();let cor=0,added=0,removed=0;
qs.forEach((q,i)=>{const pid=q._part||S.part||1;if(pid<1||pid>4)return;const key=qKey(q);const bi=WB[pid].findIndex(e=>qKey(e)===key);
if(S.ans[i]===q.answer){cor++;if(bi>=0){WB[pid].splice(bi,1);removed++}}
else if(S.ans[i]!==undefined){if(bi<0){WB[pid].push({stem:q.stem,options:q.options,answer:q.answer,explanation:q.explanation||'',_part:pid,dateAdded:t,yourAnswer:S.ans[i],comments:[],paperId:q.paperId||''});added++}else{WB[pid][bi].yourAnswer=S.ans[i];WB[pid][bi].dateAdded=t}}
if(S.flags[i]){const ui=UB[pid].findIndex(e=>qKey(e)===key);if(ui<0){UB[pid].push({stem:q.stem,options:q.options,answer:q.answer,explanation:q.explanation||'',_part:pid,dateAdded:t,yourAnswer:S.ans[i],comments:[],paperId:q.paperId||''})}}
});
PC++;HIST.push({id:uid(),date:t,part:S.part||0,mode:S.mode,total:qs.length,correct:cor,time:S.tSec,isFP:S.isFP,passage:S._curPsg||'',paperLabels:S._paperLabels||'',questions:qs.map(q=>({stem:q.stem,options:q.options,answer:q.answer,explanation:q.explanation||'',_part:q._part,passage:q.passage||false})),answers:{...S.ans}});
const tw=Object.values(WB).reduce((a,b)=>a+b.length,0);S._bu={a:added,r:removed,tw};
S.page='result';S.expandedDot=null;R();scrollTo(0,0);toast(`+${added}錯題`);cloudSaveAll();
}

function doImport(){
const area=document.getElementById('impA'),msg=document.getElementById('impMsg'),labelEl=document.getElementById('impLabel');if(!area)return;
let raw=area.value.trim();if(!raw){sMsg(msg,'請paste JSON','r');return}
const cm=raw.match(/```(?:json)?\s*([\s\S]*?)```/);if(cm)raw=cm[1].trim();
let d;try{d=JSON.parse(raw)}catch(e){sMsg(msg,'JSON錯誤：'+e.message,'r');return}
const label=(labelEl&&labelEl.value.trim())||shortDate()+' 練習';
const paperId='paper_'+Date.now().toString(36)+Math.random().toString(36).substr(2,4);
if(d.fullPaper&&d.parts){let tot=0;const counts={};for(let pid=1;pid<=4;pid++){const pqs=d.parts[String(pid)];if(!pqs||!Array.isArray(pqs))continue;pqs.forEach(q=>{q._part=pid;q.id=uid();q.paperId=paperId;q.paperDate=dateStr()});POOL[pid]=POOL[pid].concat(pqs);tot+=pqs.length;counts[pid]=pqs.length}PAPERS.push({id:paperId,date:dateStr(),label,addedAt:nowStr(),type:'全份卷',passage:d.passage||'',counts,totalQ:tot});if(d.passage)PSG=d.passage;sMsg(msg,`「${label}」+${tot}題`,'g');area.value='';clearDraft('import_json');toast('匯入成功');cloudSaveAll();R();return}
if(!d.part||!d.questions){sMsg(msg,'格式錯誤','r');return}
const pid=d.part;if(pid<1||pid>4){sMsg(msg,'part須1-4','r');return}
d.questions.forEach(q=>{q._part=pid;q.id=uid();q.paperId=paperId;q.paperDate=dateStr()});POOL[pid]=POOL[pid].concat(d.questions);PAPERS.push({id:paperId,date:dateStr(),label,addedAt:nowStr(),type:partShort(pid),passage:d.passage||'',counts:{[pid]:d.questions.length},totalQ:d.questions.length});if(d.passage)PSG=d.passage;sMsg(msg,`「${label}」+${d.questions.length}題`,'g');area.value='';clearDraft('import_json');toast('匯入成功');cloudSaveAll();R();
}
function sMsg(el,txt,c){if(!el)return;el.style.display='block';el.style.background=c==='r'?'var(--rose-l)':'var(--green-l)';el.style.color=c==='r'?'var(--rose)':'#065f46';el.textContent=txt}
function doExport(){copyTxt(JSON.stringify(buildSave()));toast('已複製')}
function doLoad(){const a=document.getElementById('loadA');if(!a)return;let r=a.value.trim();if(!r){toast('請paste');return}let d;try{d=JSON.parse(r)}catch(e){toast('JSON錯誤');return}applyLoad(d);toast('已還原');a.value='';R()}

document.addEventListener('keydown',e=>{
if(S.page!=='quiz')return;if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT')return;
const qs=S.qs;if(!qs)return;
if(e.key>='1'&&e.key<='4'){e.preventDefault();pickA(parseInt(e.key)-1)}
else if(e.key==='ArrowRight'||e.key==='Enter'){e.preventDefault();if(S.qi<qs.length-1){S.qi++;R();scrollTo(0,0)}}
else if(e.key==='ArrowLeft'){e.preventDefault();if(S.qi>0){S.qi--;R();scrollTo(0,0)}}
else if(e.key.toLowerCase()==='f'){e.preventDefault();S.flags[S.qi]=!S.flags[S.qi];R()}
});

cloudLoadAll(()=>{});
</script>
