<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0">
<title>CRE中文運用 — 練習系統 v8.3</title>
<style>
:root{
--pri:#2563eb;--pri-d:#1d4ed8;--pri-dd:#1e40af;--pri-bg:#eff6ff;--pri-l:#dbeafe;--pri-b:#bfdbfe;
--suc:#16a34a;--suc-bg:#f0fdf4;--suc-l:#dcfce7;
--err:#dc2626;--err-bg:#fef2f2;--err-l:#fee2e2;
--wrn:#d97706;--wrn-bg:#fffbeb;--wrn-l:#fef3c7;
--pur:#7c3aed;--pur-bg:#faf5ff;--pur-l:#ede9fe;
--g50:#f9fafb;--g100:#f3f4f6;--g200:#e5e7eb;--g300:#d1d5db;--g400:#9ca3af;--g500:#6b7280;--g600:#4b5563;--g700:#374151;--g800:#1f2937;--g900:#111827;
--r:12px;--rs:8px;--rx:6px;
--sh:0 1px 3px rgba(0,0,0,.08);--shm:0 4px 6px rgba(0,0,0,.1);--shl:0 10px 15px rgba(0,0,0,.1);
--ease:cubic-bezier(.4,0,.2,1);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;background:var(--g50);color:var(--g800);line-height:1.6;-webkit-font-smoothing:antialiased}
.container{max-width:480px;margin:0 auto;padding:16px;padding-bottom:80px}
@media(min-width:768px){.container{max-width:680px;padding:20px 24px 80px}}
@media(min-width:1024px){.container{max-width:780px;padding:24px 32px 80px}}
.header{background:linear-gradient(135deg,var(--pri-dd),#1e3a8a);color:#fff;padding:16px 20px;text-align:center;position:sticky;top:0;z-index:100;box-shadow:var(--shl)}
.header h1{font-size:15px;font-weight:700;letter-spacing:.3px}
.header .ver{font-size:10px;opacity:.5;margin-top:1px}
.back-btn{position:absolute;left:12px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.15);border:none;color:#fff;font-size:18px;cursor:pointer;padding:6px 10px;border-radius:var(--rs);transition:.2s}
.back-btn:hover{background:rgba(255,255,255,.25)}
.tab-bar{display:flex;gap:2px;margin:14px 0;background:var(--g100);padding:4px;border-radius:var(--r);overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab-btn{flex:1;min-width:40px;padding:9px 4px;border:none;border-radius:var(--rs);background:transparent;color:var(--g500);font-size:11px;font-weight:600;cursor:pointer;text-align:center;transition:.2s;white-space:nowrap}
.tab-btn.active{background:#fff;color:var(--pri);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.card{background:#fff;border-radius:var(--r);padding:16px;margin-bottom:10px;box-shadow:var(--sh);border:1px solid var(--g100)}
.stat-row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-bottom:14px}
@media(max-width:400px){.stat-row{grid-template-columns:1fr 1fr;gap:6px}}
.stat-card{background:#fff;border-radius:var(--r);padding:12px 6px;text-align:center;box-shadow:var(--sh);border:1px solid var(--g100)}
.stat-num{font-size:22px;font-weight:800;color:var(--pri)}
.stat-num.wrn{color:var(--wrn)}
.stat-lbl{font-size:10px;color:var(--g400);margin-top:2px;font-weight:500}
.sec-title{font-size:13px;font-weight:700;color:var(--g600);margin:18px 0 8px;display:flex;align-items:center;gap:6px}
.sec-title::before{content:'';width:3px;height:14px;background:var(--pri);border-radius:2px}
.sec-title .rt{margin-left:auto}
.part-card{background:#fff;border-radius:var(--r);padding:16px;margin-bottom:8px;box-shadow:var(--sh);border:1px solid var(--g100);cursor:pointer;transition:all .15s var(--ease);position:relative;overflow:hidden;border-left:4px solid var(--pri)}
.part-card:hover{box-shadow:var(--shm);transform:translateY(-1px)}
.part-card:active{transform:scale(.98)}
.part-card.fp{border-left-color:var(--pur);border-color:var(--pur-l)}
.part-card h3{font-size:13px;color:var(--g800);font-weight:700;padding-left:4px}
.part-card.fp h3{color:var(--pur)}
.part-card p{font-size:11px;color:var(--g400);margin-top:2px;padding-left:4px}
.part-card .arrow{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--g300);font-size:16px}
.badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:12px;font-weight:600;margin-top:4px;margin-right:3px}
.badge-b{background:var(--pri-bg);color:var(--pri);border:1px solid var(--pri-l)}
.badge-r{background:var(--err-bg);color:var(--err);border:1px solid var(--err-l)}
.badge-g{background:var(--suc-bg);color:var(--suc);border:1px solid var(--suc-l)}
.badge-w{background:var(--wrn-bg);color:var(--wrn);border:1px solid var(--wrn-l)}
.badge-p{background:var(--pur-bg);color:var(--pur);border:1px solid var(--pur-l)}
.btn{width:100%;padding:12px;border:none;border-radius:var(--rs);font-size:14px;font-weight:700;cursor:pointer;transition:.15s var(--ease);display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-p{background:var(--pri);color:#fff}.btn-p:hover:not(:disabled){background:var(--pri-d)}
.btn-e{background:var(--err);color:#fff}.btn-s{background:var(--suc);color:#fff}
.btn-pur{background:var(--pur);color:#fff}
.btn-wrn{background:var(--wrn);color:#fff}
.btn-o{background:#fff;color:var(--pri);border:2px solid var(--pri-l)}
.btn-g{background:var(--g100);color:var(--g600)}
.btn-sm{padding:7px 12px;font-size:12px;width:auto;min-height:32px;border-radius:var(--rx)}
.info-box{border-radius:var(--rs);padding:12px 14px;margin-bottom:12px;font-size:12px;line-height:1.7}
.info-box h4{font-size:12px;margin-bottom:3px}
.info-box ol,.info-box ul{padding-left:16px}
.ib-b{background:var(--pri-bg);border:1px solid var(--pri-l);color:var(--pri-dd)}
.ib-w{background:var(--wrn-bg);border:1px solid var(--wrn-l);color:#92400e}
.ib-g{background:var(--suc-bg);border:1px solid var(--suc-l);color:var(--suc)}
.ib-r{background:var(--err-bg);border:1px solid var(--err-l);color:var(--err)}
.ib-p{background:var(--pur-bg);border:1px solid var(--pur-l);color:var(--pur)}
.textarea{width:100%;border:2px solid var(--g200);border-radius:var(--rs);padding:10px;font-size:12px;font-family:'SF Mono',monospace;resize:vertical;transition:border-color .2s;line-height:1.5}
.textarea:focus{border-color:var(--pri);outline:none}
.prompt-box{background:var(--g50);border:1px solid var(--g200);border-radius:var(--rs);padding:10px;font-size:11px;max-height:140px;overflow-y:auto;white-space:pre-wrap;line-height:1.5;font-family:monospace;margin-bottom:8px}
/* Quiz */
.quiz-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 0}
.timer-area{display:flex;align-items:center;gap:5px}
.timer-n{font-size:20px;font-weight:800;color:var(--pri);font-variant-numeric:tabular-nums}
.timer-btn{padding:4px 8px;border-radius:var(--rx);border:none;font-size:11px;font-weight:600;cursor:pointer}
.tb-go{background:var(--suc-l);color:var(--suc)}.tb-pa{background:var(--wrn-l);color:var(--wrn)}.tb-re{background:var(--g100);color:var(--g500)}
.qmap{display:flex;flex-wrap:wrap;gap:4px;padding:10px;background:var(--g50);border-radius:var(--rs);margin-bottom:12px;border:1px solid var(--g200)}
.qmap-dot{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;cursor:pointer;border:2px solid var(--g200);background:#fff;color:var(--g500);transition:.15s}
.qmap-dot:hover{border-color:var(--pri)}
.qmap-dot.cur{border-color:var(--pri);background:var(--pri-bg);color:var(--pri)}
.qmap-dot.done{border-color:var(--suc);background:var(--suc-l);color:var(--suc)}
.qmap-dot.flag{border-color:var(--wrn);background:var(--wrn-l);color:var(--wrn)}
.qmap-toggle{width:100%;background:var(--g50);border:1px solid var(--g200);border-radius:var(--rs);padding:8px;text-align:center;font-size:11px;color:var(--g500);cursor:pointer;margin-bottom:10px;font-weight:600}
.part-div{background:linear-gradient(135deg,var(--pri-bg),var(--pur-bg));border:1px solid var(--pri-l);border-radius:var(--r);padding:12px;margin-bottom:12px;text-align:center}
.part-div h4{font-size:13px;font-weight:700;color:var(--pri-d)}
.part-div p{font-size:11px;color:var(--g400);margin-top:2px}
.psg-toggle{width:100%;background:var(--pri-bg);border:1px solid var(--pri-l);border-radius:var(--rs);padding:10px 14px;text-align:left;font-size:12px;color:var(--pri);cursor:pointer;font-weight:600;margin-bottom:10px}
.psg-box{background:var(--g50);border:1px solid var(--g200);border-radius:var(--rs);padding:14px;margin-bottom:14px;font-size:14px;line-height:2;max-height:240px;overflow-y:auto}
.q-card{background:#fff;border-radius:var(--r);padding:18px;box-shadow:var(--sh);border:1px solid var(--g100);margin-bottom:12px}
.q-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.q-stem{font-size:15px;font-weight:600;line-height:1.8;color:var(--g800);white-space:pre-wrap}
.flag-btn{padding:6px 10px;border-radius:var(--rx);border:1.5px solid var(--g200);background:#fff;cursor:pointer;font-size:14px;transition:.15s}
.flag-btn.on{border-color:var(--wrn);background:var(--wrn-l)}
.opt-btn{width:100%;min-height:44px;padding:12px 14px;margin-top:8px;border:2px solid var(--g200);border-radius:var(--rs);background:#fff;font-size:14px;text-align:left;cursor:pointer;transition:.15s;line-height:1.5;display:flex;align-items:center}
.opt-btn:hover{border-color:var(--pri-b);background:var(--pri-bg)}
.opt-btn.sel{border-color:var(--pri);background:var(--pri-l);font-weight:600}
.nav-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
/* Result */
.result-hero{background:linear-gradient(135deg,var(--pri),#1e3a8a);border-radius:var(--r);padding:24px 18px;text-align:center;color:#fff;margin-bottom:14px;box-shadow:var(--shl)}
.result-hero.fp{background:linear-gradient(135deg,var(--pur),#1e3a8a)}
.result-hero .big{font-size:44px;font-weight:900}
.result-hero .pct{font-size:14px;opacity:.8;margin-top:2px}
.result-hero .tm{font-size:12px;opacity:.6;margin-top:4px}
.dots{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin:12px 0}
.dot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff}
.dot.ok{background:var(--suc)}.dot.ng{background:var(--err)}.dot.sk{background:var(--g400)}
.bd{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.bd-i{background:rgba(255,255,255,.12);border-radius:var(--rs);padding:8px;text-align:center}
.bd-i .bl{font-size:9px;opacity:.7}.bd-i .bs{font-size:15px;font-weight:800}
.bank-msg{background:var(--suc-bg);border:1px solid var(--suc-l);border-radius:var(--rs);padding:10px 12px;margin-bottom:12px;font-size:12px;color:var(--suc)}
/* Review Item */
.ri{background:#fff;border-radius:var(--rs);margin-bottom:6px;border:1px solid var(--g100);overflow:hidden}
.ri.rw{border-left:3px solid var(--err)}.ri.rr{border-left:3px solid var(--suc)}.ri.ru{border-left:3px solid var(--wrn)}
.ri-h{padding:10px 12px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-size:12px;font-weight:600}
.ri-h:hover{background:var(--g50)}
.ri-tag{font-size:10px;padding:2px 6px;border-radius:8px;font-weight:600}
.ri-tag-r{background:var(--err-l);color:var(--err)}
.ri-tag-g{background:var(--suc-l);color:var(--suc)}
.ri-tag-w{background:var(--wrn-l);color:var(--wrn)}
.ri-b{padding:0 12px 12px;border-top:1px solid var(--g100);display:none;font-size:13px;line-height:1.7}
.ri-b.show{display:block;padding-top:10px}
.ri-b .lbl{font-weight:700;color:var(--g500);font-size:11px;margin-top:6px;margin-bottom:2px}
.ri-b .opt-line{padding:2px 0}
.ri-b .opt-correct{color:var(--suc);font-weight:600}
.ri-b .opt-wrong{color:var(--err);text-decoration:line-through}
.ri-del{background:none;border:none;color:var(--g400);font-size:14px;cursor:pointer;padding:4px;margin-left:8px}
.ri-del:hover{color:var(--err)}
.psg-in-bank{background:var(--g50);border:1px solid var(--g200);border-radius:var(--rx);padding:10px;margin-top:6px;font-size:12px;line-height:1.8;max-height:150px;overflow-y:auto;white-space:pre-wrap}
.psg-label{display:inline-block;background:var(--pri-bg);color:var(--pri);font-size:10px;font-weight:600;padding:1px 6px;border-radius:4px;margin-bottom:4px}
/* History */
.hi-card{background:#fff;border-radius:var(--rs);padding:12px 14px;margin-bottom:6px;box-shadow:0 1px 2px rgba(0,0,0,.04);border:1px solid var(--g100);cursor:pointer;transition:.15s}
.hi-card:hover{border-color:var(--pri-l);box-shadow:var(--sh)}
.hi-card.fp{border-left:3px solid var(--pur)}
.hi-card .hd{font-size:11px;color:var(--g400)}.hi-card .ht{font-size:13px;font-weight:700;margin:2px 0}.hi-card .hs{font-size:12px;color:var(--pri);font-weight:600}
.grp-title{font-size:11px;font-weight:700;color:var(--g400);letter-spacing:.5px;margin:14px 0 6px}
.empty{text-align:center;padding:40px 16px;color:var(--g400);font-size:13px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--g800);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:500;z-index:999;opacity:0;transition:.3s var(--ease);pointer-events:none;box-shadow:var(--shl)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:.2s}
.modal-ov.show{opacity:1;pointer-events:auto}
.modal-bx{background:#fff;border-radius:var(--r);padding:24px;max-width:340px;width:100%;box-shadow:var(--shl);text-align:center}
.modal-bx h3{font-size:16px;margin-bottom:6px}.modal-bx p{font-size:13px;color:var(--g500);margin-bottom:16px;white-space:pre-wrap}
.modal-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modal-btns .btn{font-size:13px;padding:10px}
.sub-tabs{display:flex;gap:2px;background:var(--g100);padding:3px;border-radius:var(--rs);margin-bottom:12px}
.sub-tab{flex:1;padding:7px 4px;border:none;border-radius:var(--rx);background:transparent;color:var(--g500);font-size:11px;font-weight:600;cursor:pointer;text-align:center}
.sub-tab.on{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.sub-tab.on.err-tab{color:var(--err)}
.sub-tab.on.unc-tab{color:var(--wrn)}
.save-info{background:var(--g50);border:1px solid var(--g200);border-radius:var(--rs);padding:10px 12px;font-size:11px;line-height:1.7;color:var(--g600);margin:8px 0}
.save-info strong{color:var(--g800)}
.kbd-hint{display:none;font-size:10px;color:var(--g400);margin-top:6px;text-align:center}
@media(min-width:1024px){.kbd-hint{display:block}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<div class="modal-ov" id="mo"><div class="modal-bx"><h3 id="mT"></h3><p id="mM"></p><div class="modal-btns"><button class="btn btn-o" onclick="closeM()">取消</button><button class="btn btn-e" id="mC">確定</button></div></div></div>
<script>
function showM(t,m,cb,ok){document.getElementById('mT').textContent=t;document.getElementById('mM').textContent=m;const b=document.getElementById('mC');b.textContent=ok||'確定';b.onclick=()=>{closeM();cb()};document.getElementById('mo').classList.add('show')}
function closeM(){document.getElementById('mo').classList.remove('show')}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function nowStr(){const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+' '+p2(d.getHours())+':'+p2(d.getMinutes())}
function p2(n){return String(n).padStart(2,'0')}
function fmtT(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function fmtB(b){return b<1024?b+'B':b<1048576?(b/1024).toFixed(1)+'KB':(b/1048576).toFixed(1)+'MB'}
function uid(){return Date.now().toString(36)+Math.random().toString(36).substr(2,5)}
function qKey(q){return(q.stem||'').substring(0,50)+'##'+((q.options&&q.options[0])||'')}

const PM=[
{id:1,name:"Part 1 — 閱讀理解",desc:"文章+片段閱讀",count:14,icon:"📖"},
{id:2,name:"Part 2 — 字詞辨識",desc:"錯別字+簡化字",count:8,icon:"✍️"},
{id:3,name:"Part 3 — 句子辨析",desc:"語病+邏輯",count:8,icon:"🔍"},
{id:4,name:"Part 4 — 詞句運用",desc:"填充+銜接+排序",count:15,icon:"📝"}
];

const PSG_BUILTIN=`隨着互聯網技術的發展和智能手機的普及，人們獲取資訊的方式已經產生了根本性的變化。在這個背景下，不少人開始質疑公共圖書館存在的必要性——既然幾乎所有資訊都能在網上找到，為什麼還需要實體的圖書館？\n\n事實上，這種疑問恰恰反映了人們對公共圖書館功能的狹隘理解。傳統上，圖書館確實以「藏書」和「借閱」為核心功能，但在數碼時代，其角色已經從單純的資訊提供者，轉變為社區學習和文化交流的樞紐。現代圖書館提供的服務早已超越書本借閱——從兒童故事時間、長者數碼素養課程，到創業者工作坊和社區對話活動，圖書館正在成為凝聚社區的公共空間。\n\n值得注意的是，數碼鴻溝問題並未因科技進步而消失。研究顯示，低收入家庭、長者及新來港人士在使用數碼設備和網上資源方面仍面對顯著困難。公共圖書館免費提供電腦設備、網絡連接及技術指導，在一定程度上縮窄了這道鴻溝。從這個角度看，圖書館的社會功能不僅沒有減退，反而在數碼時代變得更為重要。\n\n然而，我們也不能對圖書館的前景過於樂觀。經費不足、人手短缺、設施老化等問題長期困擾着不少公共圖書館。部分圖書館的藏書更新緩慢，難以跟上知識發展的步伐；加上開放時間有限，未能充分配合市民的生活節奏。若不能有效回應這些挑戰，圖書館被邊緣化的風險確實存在。\n\n歸根究底，公共圖書館的價值不在於它能否與互聯網競爭資訊量，而在於它能否提供一個平等、開放、有溫度的公共空間，讓不同背景的市民都能在此學習、交流和成長。這是任何數碼平台都無法完全取代的。`;

const INIT_Q={

function bankItem(q,idx,pid,bank){
const isW=bank==='wrong';
const cls=isW?'rw':'ru';const tagCls=isW?'ri-tag-r':'ri-tag-w';const tagTxt=isW?'錯誤':'不確定';

h+=`<div class="ri-b" id="${elId}">`;
if(q._passage){
h+=`<div class="lbl">📄 所屬文章 <span class="psg-label">${esc(q._psgLabel||'')}</span></div>`;
h+=`<div class="psg-in-bank">${esc(q._passage).substring(0,300)}${q._passage.length>300?'…（展開見完整）':''}</div>`;
}
h+=`<div class="lbl">題目</div><div style="white-space:pre-wrap;margin-bottom:6px">${esc(q.stem)}</div>`;
h+=`<div class="lbl">選項</div>`;
(q.options||[]).forEach((o,j)=>{
let c='opt-line';
if(j===q.answer)c+=' opt-correct';
else if(j===q.yourAnswer&&j!==q.answer)c+=' opt-wrong';
h+=`<div class="${c}">${'ABCD'[j]}. ${esc(o)}${j===q.answer?' ✓':''}${j===q.yourAnswer&&j!==q.answer?' ← 你揀咗':''}</div>`;
});
if(q.yourAnswer!==undefined&&q.yourAnswer!==q.answer){
h+=`<div class="lbl">你的答案</div><div style="color:var(--err);font-weight:600">${'ABCD'[q.yourAnswer]}</div>`;
}
h+=`<div class="lbl">正確答案</div><div style="color:var(--suc);font-weight:600">${'ABCD'[q.answer]}. ${esc((q.options||[])[q.answer]||'')}</div>`;

h+=`<div class="lbl">加入時間</div><div style="font-size:11px;color:var(--g400)">${q.dateAdded||'—'}</div>`;
h+=`</div></div>`;
return h;
}

else UB[pid].splice(idx,1);
toast('已移除');R();
}

function preSubmit(){

function renderResult(app){

const pct=qs.length?Math.round(cor/qs.length*100):0;
const title=S.isFP?'全份試卷成績':(PM.find(p=>p.id===S.part)?.name||'混合')+' 成績';
let h=`<div class="header"><h1>${title}</h1></div><div class="container">`;
h+=`<div class="result-hero ${S.isFP?'fp':''}"><div class="big">${cor}/${qs.length}</div><div class="pct">${pct}%</div><div class="tm">⏱ 用時 ${fmtT(S.tSec)}</div>`;
if(S.isFP){h+=`<div class="bd">`;PM.forEach(p=>{const pqs=qs.filter(q=>q._part===p.id);const pc=pqs.filter(q=>{const gi=qs.indexOf(q);return S.ans[gi]===q.answer}).length;h+=`<div class="bd-i"><div class="bl">P${p.id}</div><div class="bs">${pc}/${pqs.length}</div></div>`;});h+=`</div>`;}
h+=`<div class="dots">`;qs.forEach((q,i)=>{const a=S.ans[i];h+=`<div class="dot ${a===undefined?'sk':a===q.answer?'ok':'ng'}">${i+1}</div>`});h+=`</div></div>`;
if(S._bu)h+=`<div class="bank-msg">✅ 錯題庫：+${S._bu.a}新 · ${S._bu.r}掌握 · 現存${S._bu.tw}題${S._bu.u?`<br>⚠️ 不確定：+${S._bu.u}題加入`:''}</div>`;
const wc=qs.filter((q,i)=>S.ans[i]!==undefined&&S.ans[i]!==q.answer).length;
if(wc)h+=`<button class="btn btn-e" style="margin-bottom:12px" onclick="cpWrong()">📋 複製錯題到Keep（${wc}題）</button>`;
h+=`<div class="sec-title">逐題溫習</div>`;
let lp=0;
qs.forEach((q,i)=>{
if(S.isFP&&q._part&&q._part!==lp){lp=q._part;const pm=PM.find(p=>p.id===q._part);h+=`<div class="part-div"><h4>${pm?pm.icon:''} ${pm?pm.name:''}</h4></div>`;}
const ua=S.ans[i],ok=ua===q.answer;h+=riItem(q,i,ua,ok);
});
h+=`<button class="btn btn-p" style="margin-top:16px" onclick="goHome()">返回主頁</button></div>`;
app.innerHTML=h;
}

function riItem(q,i,ua,ok){
let h=`<div class="ri ${ok?'rr':'rw'}"><div class="ri-h" onclick="togRI(${i})"><span>${ok?'✓':'✗'} Q${i+1}</span><span class="ri-tag ${ok?'ri-tag-g':'ri-tag-r'}">${ok?'正確':'錯誤'}</span></div><div class="ri-b" id="rb${i}">`;
h+=`<div class="lbl">題目</div><div style="white-space:pre-wrap;margin-bottom:4px">${esc(q.stem)}</div><div class="lbl">選項</div>`;
q.options.forEach((o,j)=>{
let cls='opt-line';if(j===q.answer)cls+=' opt-correct';else if(j===ua&&!ok)cls+=' opt-wrong';
h+=`<div class="${cls}">${'ABCD'[j]}. ${esc(o)}${j===q.answer?' ✓':''}${j===ua&&!ok?' ← 你揀咗':''}</div>`;
});
if(!ok&&ua!==undefined)h+=`<div class="lbl">你的答案</div><div style="color:var(--err);font-weight:600">${'ABCD'[ua]}</div>`;
h+=`<div class="lbl">正確答案</div><div style="color:var(--suc);font-weight:600">${'ABCD'[q.answer]}</div>`;
if(q.explanation)h+=`<div class="lbl">解釋</div><div>${esc(q.explanation)}</div>`;
h+=`</div></div>`;return h;
}
function togRI(i){const e=document.getElementById('rb'+i);if(e)e.classList.toggle('show')}

function renderDetail(app){
const r=HIST.find(x=>x.id===S.viewRec);
if(!r||!r.questions){toast('無法載入');goHome();return}
S.qs=r.questions;S.ans=r.answers||{};S.isFP=r.isFP;S.part=r.part;S.tSec=r.time;S._bu=null;S._curPsg=r.passage||'';
renderResult(app);
}

// ===== ACTIONS =====
function goHome(){tStop();S.page='home';R()}
function pickA(i){S.ans[S.qi]=i;R()}
function viewR(id){S.viewRec=id;S.page='detail';R();scrollTo(0,0)}

function startP(pid){
if(!CQ[pid]||!CQ[pid].length){toast('冇題目');return}
let qs=JSON.parse(JSON.stringify(CQ[pid]));qs.forEach(q=>q._part=pid);
S._curPsg=PSG;
beginQ(qs,'normal',pid,false);
}
function startFP(){
let qs=[];for(let i=1;i<=4;i++){const p=JSON.parse(JSON.stringify(CQ[i]||[]));p.forEach(q=>q._part=i);qs=qs.concat(p)}
if(!qs.length){toast('冇題目');return}
S._curPsg=PSG;
beginQ(qs,'normal',0,true);
}
function startReview(pid,bank){
const src=bank==='wrong'?WB:UB;
if(!src[pid]||!src[pid].length){toast('冇題目');return}
let qs=JSON.parse(JSON.stringify(src[pid]));qs.forEach(q=>q._part=pid);
// Use stored passage from first question if available
S._curPsg=(qs[0]&&qs[0]._passage)||PSG;
beginQ(qs,'review',pid,false);
}
function startShuffle(bank){
const src=bank==='wrong'?WB:UB;
let all=[];Object.keys(src).forEach(k=>src[k].forEach(q=>all.push({...JSON.parse(JSON.stringify(q)),_part:+k})));
if(!all.length){toast('冇題目');return}
for(let i=all.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[all[i],all[j]]=[all[j],all[i]]}
S._curPsg=PSG;
beginQ(all,'shuffle',0,false);
}
function beginQ(qs,mode,part,fp){
S.page='quiz';S.qs=qs;S.mode=mode;S.part=part;S.isFP=fp;
S.qi=0;S.ans={};S.flags={};S.tSec=0;S.tOn=false;S.mapOpen=false;S.psgOpen=true;S._bu=null;
if(S._tID){clearInterval(S._tID);S._tID=null}
R();
}

// ===== SUBMIT =====
function submitQ(){
tStop();const qs=S.qs;const submitTime=nowStr();
let cor=0,added=0,removed=0,uncAdded=0;
// Build passage label
const psgLabel=submitTime+' 文章';
qs.forEach((q,i)=>{
const pid=q._part||S.part||1;if(pid<1||pid>4)return;
const key=qKey(q);
const bi=WB[pid].findIndex(e=>qKey(e)===key);
if(S.ans[i]===q.answer){
cor++;
if(bi>=0){WB[pid].splice(bi,1);removed++}
}else if(S.ans[i]!==undefined){
if(bi<0){
const entry={stem:q.stem,options:q.options,answer:q.answer,explanation:q.explanation||'',_part:pid,dateAdded:submitTime,yourAnswer:S.ans[i]};
// ★ For Part 1: store the passage with the wrong question
if(pid===1&&S._curPsg){entry._passage=S._curPsg;entry._psgLabel=psgLabel}
WB[pid].push(entry);
added++;
}else{WB[pid][bi].yourAnswer=S.ans[i];WB[pid][bi].dateAdded=submitTime}
}
if(S.flags[i]){
const ui=UB[pid].findIndex(e=>qKey(e)===key);
if(ui<0){
const entry={stem:q.stem,options:q.options,answer:q.answer,explanation:q.explanation||'',_part:pid,dateAdded:submitTime,yourAnswer:S.ans[i]};
if(pid===1&&S._curPsg){entry._passage=S._curPsg;entry._psgLabel=psgLabel}
UB[pid].push(entry);
uncAdded++;
}
}
});
PC++;
HIST.push({
id:uid(),
date:submitTime,
part:S.part||0,
mode:S.mode,
total:qs.length,
correct:cor,
time:S.tSec,
isFP:S.isFP,
passage:S._curPsg||'', // ★ store passage with history record
questions:qs.map(q=>({stem:q.stem,options:q.options,answer:q.answer,explanation:q.explanation||'',_part:q._part,passage:q.passage||false})),
answers:{...S.ans}
});
const tw=Object.values(WB).reduce((a,b)=>a+b.length,0);
S._bu={a:added,r:removed,tw,u:uncAdded};
S.page='result';R();scrollTo(0,0);
toast(`已儲存！+${added}錯題`);
}

// ===== COPY WRONG =====
function cpWrong(){
const qs=S.qs;
let txt=`📝 CRE中文 錯題 · ${nowStr()}\n${'═'.repeat(20)}\n\n`;
let n=0;
qs.forEach((q,i)=>{
if(S.ans[i]===undefined||S.ans[i]===q.answer)return;n++;
txt+=`❌ Q${i+1}${q._part?' [P'+q._part+']':''}\n`;
txt+=`${q.stem}\n\n`;
q.options.forEach((o,j)=>{txt+=`${j===q.answer?'✓':'　'}${'ABCD'[j]}. ${o}\n`});
txt+=`\n✗ 你選：${'ABCD'[S.ans[i]]}\n`;
if(q.explanation)txt+=`💡 ${q.explanation}\n`;
txt+=`\n${'─'.repeat(20)}\n\n`;
});
copyTxt(txt);toast(`已複製${n}題`);
}

// ===== IMPORT =====
function doImport(){
const area=document.getElementById('impA'),msg=document.getElementById('impMsg');if(!area)return;
let raw=area.value.trim();if(!raw){sMsg(msg,'請paste JSON','r');return}
const cm=raw.match(/```(?:json)?\s*([\s\S]*?)```/);if(cm)raw=cm[1].trim();
let d;try{d=JSON.parse(raw)}catch(e){sMsg(msg,'JSON錯誤：'+e.message,'r');return}
const impTime=nowStr();
if(d.fullPaper&&d.parts){
let tot=0;
for(let pid=1;pid<=4;pid++){const pqs=d.parts[String(pid)];if(!pqs||!Array.isArray(pqs))continue;pqs.forEach(q=>q._part=pid);CQ[pid]=pqs;IMP[pid]++;tot+=pqs.length;}
if(d.passage){PSG=d.passage;PSG_HIST.push({text:d.passage,importedAt:impTime,label:'全份卷 '+impTime})}
IMP.full++;
sMsg(msg,`✓ 全份卷匯入！共${tot}題`,'g');area.value='';toast('匯入成功');R();return;
}
if(!d.part||!d.questions){sMsg(msg,'格式錯誤','r');return}
const pid=d.part;if(pid<1||pid>4){sMsg(msg,'part須1-4','r');return}
d.questions.forEach(q=>q._part=pid);CQ[pid]=d.questions;
if(d.passage){PSG=d.passage;PSG_HIST.push({text:d.passage,importedAt:impTime,label:'P1 '+impTime})}
IMP[pid]++;
sMsg(msg,`✓ Part ${pid} 匯入 ${d.questions.length} 題`,'g');area.value='';toast('匯入成功');
}
function sMsg(el,txt,c){if(!el)return;el.style.display='block';el.style.background=c==='r'?'var(--err-bg)':'var(--suc-bg)';el.style.color=c==='r'?'var(--err)':'var(--suc)';el.textContent=txt}

// ===== SAVE/LOAD =====
function buildSave(){
return{v:'8.3',savedAt:nowStr(),wb:WB,ub:UB,hist:HIST,imp:IMP,pc:PC,cq:CQ,psg:PSG,psgHist:PSG_HIST};
}
function doExport(){
copyTxt(JSON.stringify(buildSave()));toast('存檔已複製！去備忘錄Paste保存');
}
function doLoad(){
const area=document.getElementById('loadA');if(!area)return;
let raw=area.value.trim();if(!raw){toast('請paste存檔');return}
let d;try{d=JSON.parse(raw)}catch(e){toast('JSON格式錯誤');return}
if(d.wb)WB=d.wb;if(d.ub)UB=d.ub;if(d.hist)HIST=d.hist;if(d.cq)CQ=d.cq;if(d.psg)PSG=d.psg;if(d.imp)IMP=d.imp;if(d.pc!==undefined)PC=d.pc;if(d.psgHist)PSG_HIST=d.psgHist;
for(let i=1;i<=4;i++){if(!WB[i])WB[i]=[];if(!UB[i])UB[i]=[]}
const qCount=Object.values(CQ).reduce((a,b)=>a+b.length,0);
toast(`讀檔成功！${HIST.length}筆記錄 · ${qCount}題`);area.value='';R();
}
function copyTxt(t){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).catch(()=>fbCopy(t));else fbCopy(t)}
function fbCopy(t){const ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta)}

// ===== KEYBOARD =====
document.addEventListener('keydown',e=>{
if(S.page!=='quiz')return;
if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT')return;
const qs=S.qs;if(!qs)return;const q=qs[S.qi];if(!q)return;
if(e.key>='1'&&e.key<=String(q.options.length)){e.preventDefault();pickA(parseInt(e.key)-1)}
else if(e.key==='ArrowRight'||e.key==='Enter'){e.preventDefault();if(S.qi<qs.length-1){S.qi++;R();scrollTo(0,0)}}
else if(e.key==='ArrowLeft'){e.preventDefault();if(S.qi>0){S.qi--;R();scrollTo(0,0)}}
else if(e.key.toLowerCase()==='f'){e.preventDefault();S.flags[S.qi]=!S.flags[S.qi];R()}
});

R();
</script>
