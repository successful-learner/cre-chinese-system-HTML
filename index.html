<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0">
<title>CRE中文運用 — 練習系統 v13</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+TC:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
--pri:#2d2d2d;--pri-l:#f5f5f7;--accent:#00c4b4;--accent-d:#00a89a;--accent-l:#e6faf8;
--blue:#4a7dff;--blue-l:#eef3ff;--purple:#8b5cf6;--purple-l:#f3effe;
--rose:#f43f5e;--rose-l:#fef1f3;--amber:#f59e0b;--amber-l:#fefce8;
--green:#10b981;--green-l:#ecfdf5;
--g0:#ffffff;--g50:#fafafa;--g100:#f5f5f5;--g150:#efefef;--g200:#e5e5e5;--g300:#d4d4d4;--g400:#a3a3a3;--g500:#737373;--g600:#525252;--g700:#404040;--g800:#262626;--g900:#171717;
--r:20px;--rs:14px;--rx:10px;
--sh:0 1px 2px rgba(0,0,0,.03),0 4px 12px rgba(0,0,0,.04);
--shm:0 4px 20px rgba(0,0,0,.08);
--shl:0 12px 48px rgba(0,0,0,.12);
--ease:cubic-bezier(.22,1,.36,1);
--font:'Inter','Noto Sans TC',-apple-system,BlinkMacSystemFont,sans-serif;
--theme-color:#1a1a2e;--theme-color2:#16213e;--theme-color3:#0f3460;--accent-color:#6c5ce7;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--g50);color:var(--g800);line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;padding-bottom:100px;overflow-x:hidden}
.container{max-width:480px;margin:0 auto;padding:0 20px}
@media(min-width:768px){.container{max-width:560px}}
.btm-nav{position:fixed;bottom:0;left:0;right:0;z-index:200;padding:0 16px env(safe-area-inset-bottom,8px)}
.btm-nav-inner{max-width:420px;margin:0 auto;background:var(--g0);border-radius:28px;box-shadow:0 -1px 0 rgba(0,0,0,.03),0 8px 32px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:space-around;padding:6px 12px;margin-bottom:8px}
.btm-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 10px;border:none;background:transparent;color:var(--g400);font-size:10px;font-weight:500;cursor:pointer;transition:.2s var(--ease);border-radius:16px;min-width:48px}
.btm-item svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;transition:.2s}
.btm-item.active{color:var(--g800)}.btm-item.active svg{stroke-width:2.2}
.btm-center{display:flex;flex-direction:column;align-items:center;gap:2px;border:none;background:transparent;cursor:pointer;margin:0 4px}
.btm-center-btn{width:52px;height:52px;border-radius:50%;background:var(--accent-color);color:#fff;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.2);transition:.25s var(--ease);margin-top:-10px}
.btm-center-btn svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2.5;transition:.3s}
.btm-center-btn:active{transform:scale(.9)}
.btm-center-btn.open{background:var(--accent);transform:rotate(45deg)}
.btm-center-label{font-size:10px;color:var(--g500);font-weight:500;margin-top:2px}
.qa-overlay{position:fixed;inset:0;z-index:190;opacity:0;pointer-events:none;transition:.35s var(--ease)}
.qa-overlay.show{opacity:1;pointer-events:auto}
.qa-bg{position:absolute;inset:0;background:rgba(255,255,255,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.qa-panel{position:absolute;bottom:0;left:0;right:0;padding:40px 24px 120px;transform:translateY(30px);opacity:0;transition:.4s var(--ease)}
.qa-overlay.show .qa-panel{transform:translateY(0);opacity:1}
.qa-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;max-width:320px;margin:0 auto}
.qa-item{display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;transition:.2s}
.qa-item:active{transform:scale(.9)}
.qa-icon{width:60px;height:60px;border-radius:20px;display:flex;align-items:center;justify-content:center}
.qa-icon svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:1.8}
.qa-icon.qi-quiz{background:linear-gradient(135deg,#667eea,#764ba2)}
.qa-icon.qi-pool{background:linear-gradient(135deg,#f093fb,#f5576c)}
.qa-icon.qi-wrong{background:linear-gradient(135deg,#fa709a,#fee140)}
.qa-icon.qi-memo{background:linear-gradient(135deg,#e2e8f0,#f8fafc)}.qa-icon.qi-memo svg{stroke:#475569}
.qa-icon.qi-notes{background:linear-gradient(135deg,#fce7f3,#fdf2f8)}.qa-icon.qi-notes svg{stroke:#9d174d}
.qa-icon.qi-import{background:linear-gradient(135deg,#89f7fe,#66a6ff)}
.qa-label{font-size:12px;color:var(--g600);font-weight:600;text-align:center}
.stat-pills{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none;scroll-behavior:smooth}
.stat-pills::-webkit-scrollbar{display:none}
.scroll-hint{display:flex;align-items:center;justify-content:center;gap:4px;padding:2px 0 8px}
.scroll-hint-bar{width:40px;height:3px;border-radius:2px;background:var(--g200);position:relative;overflow:hidden}
.scroll-hint-bar::after{content:'';position:absolute;left:0;top:0;width:50%;height:100%;background:var(--g400);border-radius:2px;animation:scrollHint 2s ease-in-out infinite}
@keyframes scrollHint{0%,100%{transform:translateX(0)}50%{transform:translateX(100%)}}
.scroll-hint-txt{font-size:9px;color:var(--g400);font-weight:500}
.stat-pill{flex-shrink:0;background:var(--g0);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:10px;box-shadow:var(--sh);border:1px solid var(--g100);min-width:110px;cursor:pointer;transition:.2s var(--ease)}
.stat-pill:active{transform:scale(.97)}
.stat-pill .sp-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.stat-pill .sp-icon svg{width:18px;height:18px;stroke-width:2}
.sp-icon.ic-err{background:var(--rose-l)}.sp-icon.ic-err svg{stroke:var(--rose)}
.sp-icon.ic-unc{background:var(--amber-l)}.sp-icon.ic-unc svg{stroke:var(--amber)}
.sp-icon.ic-pool{background:var(--accent-l)}.sp-icon.ic-pool svg{stroke:var(--accent)}
.sp-icon.ic-memo{background:var(--purple-l)}.sp-icon.ic-memo svg{stroke:var(--purple)}
.sp-icon.ic-note{background:var(--blue-l)}.sp-icon.ic-note svg{stroke:var(--blue)}
.stat-pill .sp-num{font-size:18px;font-weight:800;color:var(--g800)}
.stat-pill .sp-lbl{font-size:10px;color:var(--g400);font-weight:500}
.pill-mono .sp-icon{background:var(--accent-color)!important;opacity:.85}
.pill-mono .sp-icon svg{stroke:#fff!important}
.pill-mono .stat-pill{border-color:var(--g150)}
.stat-hero{background:linear-gradient(135deg,var(--theme-color) 0%,var(--theme-color2) 50%,var(--theme-color3) 100%);border-radius:var(--r);padding:24px;margin:12px 0;color:#fff;position:relative;overflow:hidden}
.stat-hero::after{content:'';position:absolute;top:-40%;right:-20%;width:200px;height:200px;background:radial-gradient(circle,rgba(0,196,180,.15) 0%,transparent 70%);border-radius:50%}
.m-card{background:var(--g0);border-radius:var(--r);padding:20px;margin-bottom:12px;box-shadow:var(--sh);border:1px solid rgba(0,0,0,.03)}
.sec{margin:20px 0 10px}.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sec-title{font-size:16px;font-weight:700;color:var(--g800)}
.sec-toggle{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.sec-toggle .sec-arrow{transition:.2s;display:flex;align-items:center}
.sec-toggle .sec-arrow svg{width:16px;height:16px;stroke:var(--g400);stroke-width:2.5}
.sec-toggle .sec-arrow.open svg{transform:rotate(180deg)}
.paper-item{background:var(--g0);border-radius:var(--r);padding:16px 18px;margin-bottom:8px;box-shadow:var(--sh);border:1px solid rgba(0,0,0,.03);cursor:pointer;transition:.2s var(--ease);display:flex;align-items:center;gap:14px}
.paper-item:active{transform:scale(.98)}
.paper-item .pi-icon{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.paper-item .pi-icon svg{width:20px;height:20px;stroke-width:1.8}
.paper-item .pi-icon.pi-grad-full{background:linear-gradient(135deg,var(--theme-color),var(--theme-color2));box-shadow:0 2px 8px rgba(30,27,75,.25)}
.paper-item .pi-icon.pi-grad-full svg{stroke:#a5b4fc}
.paper-item .pi-icon.pi-grad-part{background:linear-gradient(135deg,var(--theme-color2),var(--accent-color));box-shadow:0 2px 8px rgba(67,56,202,.25)}
.paper-item .pi-icon.pi-grad-part svg{stroke:#c7d2fe}
.paper-item .pi-body{flex:1;min-width:0}
.paper-item .pi-name{font-size:14px;font-weight:600;color:var(--g800);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.paper-item .pi-meta{font-size:11px;color:var(--g400);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.paper-item .pi-parts{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.pi-part-tag{font-size:9px;padding:2px 6px;border-radius:6px;font-weight:600;background:var(--g100);color:var(--g500)}
.pi-part-tag.pt1{background:#fce4ec;color:#c62828}
.pi-part-tag.pt2{background:#e8f5e9;color:#2e7d32}
.pi-part-tag.pt3{background:#fff3e0;color:#e65100}
.pi-part-tag.pt4{background:#e3f2fd;color:#1565c0}
.paper-item .pi-arrow{color:var(--g300)}
.paper-item .pi-actions{display:flex;gap:4px}
.paper-item .pi-act-btn{width:32px;height:32px;border-radius:10px;border:none;background:var(--g100);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.paper-item .pi-act-btn svg{width:14px;height:14px;stroke:var(--g500);stroke-width:2}
.paper-item .pi-act-btn:active{background:var(--g200);transform:scale(.9)}
.paper-item .pi-act-btn.pi-del-btn{background:var(--rose-l)}
.paper-item .pi-act-btn.pi-del-btn svg{stroke:var(--rose)}
.part-item{background:var(--g0);border-radius:var(--r);padding:16px 18px;margin-bottom:8px;box-shadow:var(--sh);cursor:pointer;transition:.2s var(--ease);display:flex;align-items:center;gap:14px;border:1px solid rgba(0,0,0,.03)}
.part-item:active{transform:scale(.98)}
.part-item .pt-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.part-item .pt-icon svg{width:20px;height:20px;stroke-width:1.8}
.pt-icon.pt1{background:linear-gradient(135deg,#fce4ec,#f8bbd0)}.pt-icon.pt1 svg{stroke:#c62828}
.pt-icon.pt2{background:linear-gradient(135deg,#e8f5e9,#c8e6c9)}.pt-icon.pt2 svg{stroke:#2e7d32}
.pt-icon.pt3{background:linear-gradient(135deg,#fff3e0,#ffe0b2)}.pt-icon.pt3 svg{stroke:#e65100}
.pt-icon.pt4{background:linear-gradient(135deg,#e3f2fd,#bbdefb)}.pt-icon.pt4 svg{stroke:#1565c0}
.part-item .pt-body{flex:1}.part-item .pt-name{font-size:14px;font-weight:600}
.part-item .pt-count{font-size:12px;color:var(--g400)}.part-item .pt-arrow{color:var(--g300)}
.sub-tabs{display:flex;gap:4px;padding:3px;background:var(--g100);border-radius:var(--rs);margin-bottom:14px;overflow-x:auto}
.sub-tab{flex:1;padding:9px 8px;border:none;border-radius:var(--rx);background:transparent;color:var(--g500);font-size:12px;font-weight:600;cursor:pointer;text-align:center;white-space:nowrap;transition:.2s}
.sub-tab.on{background:var(--g0);color:var(--g800);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.tag-chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.tag-chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:12px;font-size:11px;font-weight:600;background:var(--g100);color:var(--g600)}
.tag-chip .tag-del{background:none;border:none;cursor:pointer;font-size:13px;color:var(--g400);padding:0 2px}
.tag-input-wrap{display:flex;gap:6px;align-items:center;margin-top:6px}
.tag-input-wrap input{flex:1;border:1.5px solid var(--g200);border-radius:var(--rx);padding:7px 10px;font-size:12px;font-family:var(--font)}
.tag-input-wrap input:focus{border-color:var(--g900);outline:none}
.tag-input-wrap button{padding:7px 12px;border:none;border-radius:var(--rx);background:var(--g900);color:#fff;font-size:11px;font-weight:600;cursor:pointer}
.quiz-header{background:var(--g0);border-radius:var(--r);padding:14px 18px;margin-bottom:12px;box-shadow:var(--sh);display:flex;align-items:center;justify-content:space-between}
.q-progress{font-size:12px;font-weight:600;color:var(--g500)}
.q-timer{font-size:20px;font-weight:800;color:var(--g800);letter-spacing:-1px;font-variant-numeric:tabular-nums}
.timer-btns{display:flex;gap:4px}
.timer-btn{width:30px;height:30px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.timer-btn svg{width:14px;height:14px;stroke-width:2}
.tb-play{background:var(--green-l)}.tb-play svg{stroke:var(--green)}
.tb-pause{background:var(--amber-l)}.tb-pause svg{stroke:var(--amber)}
.tb-reset{background:var(--g100)}.tb-reset svg{stroke:var(--g500)}
.qmap-wrap{background:var(--g0);border-radius:var(--rs);padding:10px 12px;margin-bottom:12px;box-shadow:var(--sh)}
.qmap-toggle{width:100%;background:transparent;border:none;padding:4px;font-size:12px;color:var(--g500);cursor:pointer;font-weight:500;display:flex;align-items:center;justify-content:center;gap:4px}
.qmap{display:flex;flex-wrap:wrap;gap:5px;padding:8px 0 4px}
.qmap-dot{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;cursor:pointer;border:1.5px solid var(--g200);background:var(--g0);color:var(--g500);transition:.15s}
.qmap-dot.cur{border-color:var(--g900);background:var(--g900);color:#fff}
.qmap-dot.done{border-color:var(--accent);background:var(--accent-l);color:var(--accent-d)}
.qmap-dot.flag{border-color:var(--amber);background:var(--amber-l);color:var(--amber)}
.q-card{background:var(--g0);border-radius:var(--r);padding:22px;box-shadow:var(--sh);margin-bottom:12px}
.q-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.q-num{font-size:11px;color:var(--g400);font-weight:600}
.flag-btn{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--g200);background:var(--g0);cursor:pointer;display:flex;align-items:center;justify-content:center}
.flag-btn svg{width:16px;height:16px;stroke:var(--g400);stroke-width:2;fill:none}
.flag-btn.on{border-color:var(--amber);background:var(--amber-l)}
.flag-btn.on svg{stroke:var(--amber);fill:var(--amber)}
.q-stem{font-size:15px;font-weight:500;line-height:1.9;color:var(--g800);white-space:pre-wrap;margin-bottom:14px}
.opt-btn{width:100%;padding:13px 16px;margin-top:8px;border:1.5px solid var(--g200);border-radius:var(--rs);background:var(--g0);font-size:14px;text-align:left;cursor:pointer;transition:.2s var(--ease);line-height:1.6;display:flex;align-items:center;gap:10px}
.opt-btn:active{transform:scale(.98)}
.opt-btn .opt-letter{width:26px;height:26px;border-radius:50%;background:var(--g100);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--g500);flex-shrink:0}
.opt-btn.sel{border-color:var(--g900);background:var(--g900);color:#fff}
.opt-btn.sel .opt-letter{background:rgba(255,255,255,.2);color:#fff}
.nav-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.part-div{background:linear-gradient(135deg,var(--g100),var(--g50));border-radius:var(--rs);padding:12px;margin-bottom:10px;text-align:center}
.part-div h4{font-size:13px;font-weight:700;color:var(--g600)}
.psg-toggle{width:100%;background:var(--g0);border:1.5px solid var(--g200);border-radius:var(--rs);padding:10px 16px;text-align:left;font-size:13px;color:var(--g600);cursor:pointer;font-weight:500;margin-bottom:10px}
.psg-box{background:var(--g0);border:1px solid var(--g200);border-radius:var(--rs);padding:16px;margin-bottom:12px;font-size:15px;line-height:2.2;max-height:260px;overflow-y:auto}
.result-hero{background:linear-gradient(135deg,var(--theme-color),var(--theme-color2),var(--theme-color3));border-radius:var(--r);padding:28px 24px;text-align:center;color:#fff;margin-bottom:16px;position:relative;overflow:hidden}
.result-hero .rh-score{font-size:52px;font-weight:900;letter-spacing:-2px}
.result-hero .rh-pct{font-size:15px;opacity:.7;margin-top:4px}
.result-hero .rh-time{font-size:12px;opacity:.4;margin-top:4px}
.result-hero .rh-detail{font-size:11px;opacity:.5;margin-top:6px}
.result-dots{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin:12px 0}
.dot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;cursor:pointer;transition:.2s}
.dot.ok{background:var(--green)}.dot.ng{background:var(--rose)}.dot.sk{background:var(--g300)}
.dot.expanded{transform:scale(1.3);box-shadow:0 2px 8px rgba(0,0,0,.2)}
.ri{background:var(--g0);border-radius:var(--rs);margin-bottom:6px;overflow:hidden;box-shadow:var(--sh);border:1px solid rgba(0,0,0,.03)}
.ri.rw{border-left:3px solid var(--rose)}.ri.rr{border-left:3px solid var(--green)}
.ri-h{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-size:12px;font-weight:600}
.ri-h:active{background:var(--g50)}
.ri-tag{font-size:10px;padding:3px 8px;border-radius:12px;font-weight:600}
.ri-tag-g{background:var(--green-l);color:var(--green)}
.ri-tag-r{background:var(--rose-l);color:var(--rose)}
.ri-tag-w{background:var(--amber-l);color:var(--amber)}
.ri-b{padding:0 14px 14px;border-top:1px solid var(--g100);display:none;font-size:13px;line-height:1.8}
.ri-b.show{display:block;padding-top:12px}
.ri-b .lbl{font-weight:700;color:var(--g400);font-size:10px;margin-top:8px;margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px}
.ri-b .opt-correct{color:var(--green);font-weight:600}
.ri-b .opt-wrong{color:var(--rose);text-decoration:line-through}
.ri-del{background:none;border:none;color:var(--g400);cursor:pointer;padding:4px;display:flex;align-items:center}
.ri-del svg{width:14px;height:14px;stroke:var(--g400);stroke-width:2}
.hi-card{background:var(--g0);border-radius:var(--r);padding:16px 18px;margin-bottom:8px;box-shadow:var(--sh);border:1px solid rgba(0,0,0,.03);cursor:pointer;transition:.2s}
.hi-card:active{transform:scale(.98)}
.hi-card .hi-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.hi-card .hi-date{font-size:11px;color:var(--g400);font-weight:500;display:flex;align-items:center;gap:6px}
.hi-card .hi-date svg{width:12px;height:12px;stroke:var(--g400);stroke-width:2}
.hi-card .hi-title{font-size:14px;font-weight:700;margin-bottom:2px}
.hi-card .hi-bottom{display:flex;align-items:center;gap:12px}
.hi-card .hi-score{font-size:14px;color:var(--accent-d);font-weight:700}
.hi-card .hi-time{font-size:11px;color:var(--g400);display:flex;align-items:center;gap:3px}
.hi-card .hi-time svg{width:11px;height:11px;stroke:var(--g400);stroke-width:2}
.hi-card .hi-paper{font-size:11px;color:var(--g500);background:var(--g100);padding:2px 8px;border-radius:8px}
.memo-card,.note-card{background:var(--g0);border-radius:var(--r);padding:16px;margin-bottom:8px;box-shadow:var(--sh);border:1px solid rgba(0,0,0,.03);position:relative;cursor:pointer;transition:.2s var(--ease)}
.memo-card:active,.note-card:active{transform:scale(.98)}
.memo-card.selected{border-color:var(--accent);background:var(--accent-l)}
.note-card.selected{border-color:var(--purple);background:var(--purple-l)}
.mc-head,.nc-chips{display:flex;gap:6px;margin-bottom:5px;flex-wrap:wrap}
.mc-chip,.nc-chip{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600}
.mc-chip{background:var(--g100);color:var(--g500)}
.nc-chip.cat-thinking{background:var(--purple-l);color:var(--purple)}

function fmtT(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function fmtB(b){return b<1024?b+'B':b<1048576?(b/1024).toFixed(1)+'KB':(b/1048576).toFixed(1)+'MB'}

function deleteImageFromCloud(fileId){fetch(CLOUD_URL,{method:'POST',body:JSON.stringify({token:CLOUD_TOKEN,action:'deleteImage',fileId:fileId})}).then(r=>r.json())}
function handleImageFiles(files){Array.from(files).forEach(function(file){if(!file.type.startsWith('image/'))return;var reader=new FileReader();reader.onload=function(e){var base64=e.target.result.split(',')[1];var item={id:uid(),preview:e.target.result,uploading:true,url:'',fileId:'',name:file.name};_pendingImages.push(item);renderPendingImages();uploadImageToCloud(base64,file.name,file.type,function(err,res){var idx=_pendingImages.findIndex(x=>x.id===item.id);if(idx>=0){if(err){_pendingImages.splice(idx,1);toast('上傳失敗：'+err)}else{_pendingImages[idx].uploading=false;_pendingImages[idx].url=res.thumb||res.url;_pendingImages[idx].fileId=res.fileId;toast('圖片已上傳')}}renderPendingImages()})};reader.readAsDataURL(file)})}
function handlePaste(e){var items=e.clipboardData&&e.clipboardData.items;if(!items)return;for(var i=0;i<items.length;i++){if(items[i].type.indexOf('image')>=0){e.preventDefault();var file=items[i].getAsFile();if(file)handleImageFiles([file]);break}}}
function removePendingImage(idx){var item=_pendingImages[idx];if(item&&item.fileId)deleteImageFromCloud(item.fileId);_pendingImages.splice(idx,1);renderPendingImages()}

ass="scroll-hint-txt">左右滑動</span></div>';h+='<div class="sec"><div class="sec-head"><div class="sec-toggle" onclick="S.paperSecOpen=!S.paperSecOpen;R()"><div class="sec-title">選Paper做題</div><span class="sec-arrow '+(S.paperSecOpen?'open':'')+'">'+IC.chevDown+'</span></div></div></div>';if(S.paperSecOpen){var dates=getUniqueDates();if(dates.length>0){h+='<div class="date-dropdown"><label>日期：</label><select onchange="S.dateFilter=this.value;R()"><option value="all" '+(S.dateFilter==='all'?'selected':'')+'>全部</option>';dates.forEach(function(d){h+='<option value="'+d+'" '+(S.dateFilter===d?'selected':'')+'>'+d+'</option>'});h+='</select></div>'}var filtered=S.dateFilter==='all'?PAPERS.slice().reverse():PAPERS.filter(p=>p.date===S.dateFilter).reverse();if(!filtered.length)h+='<div class="empty">'+IC.file+'<div>未有Paper，去「匯入」加卷</div></div>';else filtered.forEach(function(p){var cnt=getPaperQCount(p.id),parts=getPaperParts(p.id);if(S.editingPaper===p.id){h+='<div class="paper-item" style="cursor:default"><div class="inline-edit" style="width:100%"><input id="editN_'+p.id+'" value="'+esc(p.label)+'"><button style="background:var(--green);color:#fff" onclick="savePaperName(\''+p.id+'\')">✓</button><button style="background:var(--g200)" onclick="S.editingPaper=null;R()">✕</button></div></div>'}else{h+='<div class="paper-item" onclick="openPaperView(\''+p.id+'\')"><div class="pi-icon pi-grad-full">'+IC.file+'</div><div class="pi-body"><div class="pi-name">'+esc(p.label)+'</div><div class="pi-meta"><span>'+p.date+'</span><span>'+cnt+'題</span></div>';if(parts.length){h+='<div class="pi-parts">';parts.forEach(function(pt){h+='<span class="pi-part-tag pt'+pt.id+'">'+PART_NAMES[pt.id]+' '+pt.count+'</span>'});h+='</div>'}h+='</div><div class="pi-actions" onclick="event.stopPropagation()"><button class="pi-act-btn" onclick="S.editingPaper=\''+p.id+'\';R()">'+IC.edit+'</button><button class="pi-act-btn pi-del-btn" onclick="delPaper(\''+p.id+'\')">'+IC.trash+'</button></div><span class="pi-arrow">'+IC.chevRight+'</span></div>'}})}if(PAPERS.length){h+='<div class="sec"><div class="sec-head"><div class="sec-toggle" onclick="S.mixSecOpen=!S.mixSecOpen;R()"><div class="sec-title">混合練習</div><span class="sec-arrow '+(S.mixSecOpen?'open':'')+'">'+IC.chevDown+'</span></div></div></div>';if(S.mixSecOpen){h+='<div class="mix-card">';PAPERS.slice().reverse().forEach(function(p){var cnt=getPaperQCount(p.id);h+='<div class="mix-item"><input type="checkbox" class="shp-cb" value="'+p.id+'" checked><div class="mi-body"><div class="mi-name">'+esc(p.label)+'</div><div class="mi-sub">'+p.date+'</div></div><div class="mi-count">'+cnt+'題</div></div>'});h+='<div class="mode-toggle"><button class="on" id="mt-shuffle">撈亂</button><button id="mt-order" onclick="this.classList.add(\'on\');document.getElementById(\'mt-shuffle\').classList.remove(\'on\')">按次序</button></div><div style="margin:10px 0;display:flex;align-items:center;gap:8px"><span style="font-size:12px;font-weight:500">上限</span><input type="number" id="shNum" value="0" min="0" style="width:60px;border:1.5px solid var(--g200);border-radius:8px;padding:7px 10px;font-size:13px"><span style="font-size:11px;color:var(--g400)">0=全部</span></div><button class="btn btn-dark" onclick="startMixPractice()">開始練習</button></div>'}}return h}

function savePaperName(pid){var input=document.getElementById('editN_'+pid);if(!input)return;var p=PAPERS.find(x=>x.id===pid);if(p)p.label=input.value.trim()||p.label;S.editingPaper=null;toast('已更新');cloudSaveAll();R()}
function openPaperView(id){S._paperView=id;S.page='paperView';R()}
function delPaper(id){var p=PAPERS.find(x=>x.id===id);showM('刪除','確定刪除「'+(p?p.label:'')+'」？',function(){for(var i=1;i<=4;i++)POOL[i]=POOL[i].filter(q=>q.paperId!==id);PAPERS=PAPERS.filter(x=>x.id!==id);cloudSaveAll();toast('已刪除');R()},'刪除')}
function renderPaperView(app){var paper=PAPERS.find(p=>p.id===S._paperView);if(!paper){goHome();return}var allQ=getAllPaperQs(paper.id);let h='<div class="container" style="padding-top:20px"><div style="display:flex;align-items:center;gap:12px;margin-bottom:16px"><button class="pg-back" onclick="goHome()">'+IC.chevLeft+'</button><div style="flex:1;font-size:18px;font-weight:700">'+esc(paper.label)+'</div></div><div class="info-box ib-accent">'+paper.date+' · 共'+allQ.length+'題</div>';if(allQ.length)h+='<button class="btn btn-dark" style="margin-bottom:16px" onclick="startPaperFull(\''+paper.id+'\')">做全份（'+allQ.length+'題）</button>';h+='<div class="sec"><div class="sec-title">分Part</div></div>';PM.forEach(function(pm){var pqs=POOL[pm.id].filter(q=>q.paperId===paper.id);if(!pqs.length)return;h+='<div class="part-item" onclick="startPaperPart(\''+paper.id+'\','+pm.id+')"><div class="pt-icon '+pm.grad+'">'+pm.icon+'</div><div class="pt-body"><div class="pt-name">'+pm.name+'</div><div class="pt-count">'+pqs.length+'題</div></div><span class="pt-arrow">'+IC.chevRight+'</span></div>'});h+='</div>'+renderBottomBar();app.innerHTML=h}
function startPaperFull(paperId){var paper=PAPERS.find(p=>p.id===paperId);if(!paper)return;var all=getAllPaperQs(paperId);if(!all.length){toast('冇題');return}S._curPsg=paper.passage||'';S._paperLabels=paper.label;beginQ(all,'order',0,true)}
function startPaperPart(paperId,partId){var paper=PAPERS.find(p=>p.id===paperId);if(!paper)return;var qs=POOL[partId].filter(q=>q.paperId===paperId).map(q=>Object.assign({},JSON.parse(JSON.stringify(q)),{_part:partId}));if(!qs.length){toast('冇題');return}S._curPsg=paper.passage||'';S._paperLabels=paper.label;beginQ(qs,'order',partId,false)}
function startMixPractice(){var cbs=document.querySelectorAll('.shp-cb:checked');if(!cbs.length){toast('請揀Paper');return}var ids=[].slice.call(cbs).map(c=>c.value);var all=[];for(var i=1;i<=4;i++)POOL[i].filter(q=>ids.includes(q.paperId)).forEach(q=>{all.push(Object.assign({},JSON.parse(JSON.stringify(q)),{_part:i}))});if(!all.length){toast('冇題');return}var isShuffle=document.getElementById('mt-shuffle')&&document.getElementById('mt-shuffle').classList.contains('on');if(isShuffle)all=shuffleArr(all);var numEl=document.getElementById('shNum');var num=numEl?parseInt(numEl.value):0;if(num>0&&num<all.length)all=all.slice(0,num);S._curPsg='';S._paperLabels=ids.map(id=>{var p=PAPERS.find(x=>x.id===id);return p?p.label:''}).filter(Boolean).join(', ');beginQ(all,isShuffle?'shuffle':'order',0,false)}

function tabPool(){if(S.poolPart)return tabPoolDetail(S.poolPart);var tp=Object.values(POOL).reduce((a,b)=>a+b.length,0);let h='<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px"><button class="pg-back" onclick="S.tab=\'home\';R()">'+IC.chevLeft+'</button><span style="font-size:16px;font-weight:700">題池</span></div><div class="info-box ib-accent">共 '+tp+' 題</div>';PM.forEach(function(p){h+='<div class="part-item" onclick="S.poolPart='+p.id+';R()"><div class="pt-icon '+p.grad+'">'+p.icon+'</div><div class="pt-body"><div class="pt-name">'+p.name+'</div><div class="pt-count">'+POOL[p.id].length+'題</div></div><span class="pt-arrow">'+IC.chevRight+'</span></div>'});return h}
function tabPoolDetail(pid){var pm=PM.find(p=>p.id===pid);var items=POOL[pid]||[];var groups={};items.forEach(q=>{var k=q.paperId||'x';if(!groups[k])groups[k]=[];groups[k].push(q)});let h='<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px"><button class="pg-back" onclick="S.poolPart=null;R()">'+IC.chevLeft+'</button><span style="font-size:16px;font-weight:700">'+pm.short+'（'+items.length+'）</span></div>';Object.keys(groups).forEach(function(paperId){var paper=PAPERS.find(p=>p.id===paperId);var pqs=groups[paperId];var isOpen=S.poolGroupOpen[paperId];h+='<div class="pool-group"><div class="pool-group-head" onclick="S.poolGroupOpen[\''+paperId+'\']=!S.poolGroupOpen[\''+paperId+'\'];R()"><div class="pg-label">'+esc(paper?paper.label:'未分類')+'</div><div class="pg-right"><span class="pg-count">'+pqs.length+'</span><span class="pg-arrow '+(isOpen?'open':'')+'">'+IC.chevDown+'</span></div></div><div class="pool-group-body '+(isOpen?'show':'')+'">';pqs.forEach(function(q,i){h+='<div class="pq-item"><strong>Q'+(i+1)+'</strong> '+esc((q.stem||'').substring(0,60))+'</div>'});h+='</div></div>'});return h}

function tabWrong(){var tw=Object.values(WB).reduce((a,b)=>a+b.length,0),tu=Object.values(UB).reduce((a,b)=>a+b.length,0);let h='<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px"><button class="pg-back" onclick="S.tab=\'home\';R()">'+IC.chevLeft+'</button></div><div class="sub-tabs"><button class="sub-tab '+(S.wbSub==='wrong'?'on':'')+'" onclick="S.wbSub=\'wrong\';R()">錯題（'+tw+'）</button><button class="sub-tab '+(S.wbSub==='uncertain'?'on':'')+'" onclick="S.wbSub=\'uncertain\';R()">不確定（'+tu+'）</button></div>';if(S.wbSub==='wrong')h+=renderBank(WB,'wrong');else h+=renderBank(UB,'uncertain');return h}
function renderBank(bank,type){var total=Object.values(bank).reduce((a,b)=>a+b.length,0);if(!total)return '<div class="empty">'+(type==='wrong'?IC.xCirc:IC.alert)+'<div>冇</div></div>';var bv=type==='wrong'?'WB':'UB';let h='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px"><button class="btn btn-sm '+(type==='wrong'?'btn-danger':'btn-accent')+'" onclick="startBankShuffle(\''+type+'\')">重做全部（'+total+'）</button><button class="btn btn-ghost btn-sm" onclick="showM(\'清空\',\'確定？\',function(){'+bv+'={1:[],2:[],3:[],4:[]};toast(\'已清空\');cloudSaveAll();R()})">清空</button></div>';PM.forEach(function(p){var items=bank[p.id]||[];if(!items.length)return;h+='<div class="sec"><div class="sec-head"><div class="sec-title">'+p.short+'（'+items.length+'）</div><button class="btn btn-sm btn-outline" onclick="startReview('+p.id+',\''+type+'\')">重做</button></div></div>';items.forEach(function(q,i){h+=bankItem(q,i,p.id,type)})});return h}
function bankItem(q,idx,pid,bank){var isW=bank==='wrong';var elId=bank+pid+'_'+idx;let h='<div class="ri '+(isW?'rw':'')+'"><div class="ri-h" onclick="togB(\''+elId+'\')"><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px">'+esc((q.stem||'').substring(0,40))+'</span><span style="display:flex;align-items:center;gap:4px"><span class="ri-tag '+(isW?'ri-tag-r':'ri-tag-w')+'">'+(isW?'錯':'?')+'</span><button class="ri-del" onclick="event.stopPropagation();delBank(\''+bank+'\','+pid+','+idx+')">'+IC.x+'</button></span></div><div class="ri-b" id="'+elId+'"><div class="lbl">題目</div><div style="white-space:pre-wrap;margin-bottom:5px">'+esc(q.stem)+'</div><div class="lbl">選項</div>';(q.options||[]).forEach(function(o,j){var c='';if(j===q.answer)c='opt-correct';else if(j===q.yourAnswer&&j!==q.answer)c='opt-wrong';h+='<div class="'+c+'">'+'ABCD'[j]+'. '+esc(o)+(j===q.answer?' ✓':'')+(j===q.yourAnswer&&j!==q.answer?' ←你揀':'')+'</div>'});if(q.explanation)h+='<div class="lbl">解釋</div><div>'+esc(q.explanation)+'</div>';h+='<div style="margin-top:10px;display:flex;gap:6px"><button class="btn btn-accent btn-sm" onclick="saveToMemo(\''+bank+'\','+pid+','+idx+')">存Memo</button><button class="btn btn-outline btn-sm" onclick="copyForAI(\''+bank+'\','+pid+','+idx+')">問AI</button></div></div></div>';return h}
function togB(id){var e=document.getElementById(id);if(e)e.classList.toggle('show')}
function delBank(bank,pid,idx){if(bank==='wrong')WB[pid].splice(idx,1);else UB[pid].splice(idx,1);toast('已移除');cloudSaveAll();R()}
function saveToMemo(bank,pid,idx){var src=bank==='wrong'?WB:UB;var q=src[pid][idx];if(!q)return;var content=q.stem+'\n\n';q.options.forEach(function(o,j){content+='ABCD'[j]+'. '+o+'\n'});content+='\n正確：'+'ABCD'[q.answer]+'\n';if(q.explanation)content+=q.explanation;MEMO.push({id:uid(),part:pid,title:(q.stem||'').substring(0,TITLE_MAX),content:content,tags:[partShort(pid)],date:nowStr()});toast('已存Memo');cloudSaveAll()}
function copyForAI(bank,pid,idx){var src=bank==='wrong'?WB:UB;var q=src[pid][idx];if(!q)return;var txt=q.stem+'\n\n';q.options.forEach(function(o,j){txt+='ABCD'[j]+'. '+o+'\n'});txt+='\n正確：'+'ABCD'[q.answer]+'\n';if(q.explanation)txt+='解釋：'+q.explanation+'\n';txt+='\n請詳細解釋。';copyTxt(txt);toast('已複製')}
function startReview(pid,bank){var src=bank==='wrong'?WB:UB;if(!src[pid]||!src[pid].length){toast('冇題');return}var qs=JSON.parse(JSON.stringify(src[pid]));qs.forEach(q=>{q._part=pid});S._curPsg='';beginQ(qs,'review',pid,false)}
function startBankShuffle(bank){var src=bank==='wrong'?WB:UB;var all=[];Object.keys(src).forEach(k=>{src[k].forEach(q=>{all.push(Object.assign({},JSON.parse(JSON.stringify(q)),{_part:+k}))})});if(!all.length){toast('冇題');return}shuffleArr(all);S._curPsg='';beginQ(all,'shuffle',0,false)}

function tabMemo(){var filters=['all',1,2,3,4];var fNames=['全部'].concat(PM.map(p=>p.short));let h='<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px"><button class="pg-back" onclick="S.tab=\'home\';R()">'+IC.chevLeft+'</button><span style="font-size:16px;font-weight:700">📝 Memo（'+MEMO.length+'）</span></div>';h+='<div class="sub-tabs">';filters.forEach(function(f,i){h+='<button class="sub-tab '+(S.memoFilter==f?'on':'')+'" onclick="S.memoFilter=\''+f+'\';R()">'+fNames[i]+'</button>'});h+='</div>';var filtered=MEMO.filter(m=>S.memoFilter==='all'||m.part==S.memoFilter);var selCount=Object.values(S.memoSel).filter(Boolean).length;if(selCount)h+='<div style="display:flex;gap:6px;margin-bottom:12px"><button class="btn btn-accent btn-sm" onclick="copySelectedMemos()">複製（'+selCount+'）</button><button class="btn btn-ghost btn-sm" onclick="S.memoSel={};R()">取消</button><button class="btn btn-sm" style="background:var(--rose-l);color:var(--rose)" onclick="delSelectedMemos()">刪除</button></div>';h+='<button class="btn btn-outline btn-sm" style="margin-bottom:12px" onclick="showAddMemo()">＋ 新增</button>';if(!filtered.length)h+='<div class="empty">'+IC.memo+'<div>未有Memo</div></div>';else filtered.slice().reverse().forEach(function(m){var sel=S.memoSel[m.id];h+='<div class="memo-card '+(sel?'selected':'')+'" onclick="toggleMemoSel(\''+m.id+'\')"><input type="checkbox" class="memo-sel" '+(sel?'checked':'')+' onclick="event.stopPropagation();toggleMemoSel(\''+m.id+'\')"><div class="mc-head"><span class="mc-chip">'+partShort(m.part)+'</span></div><div class="mc-title">'+esc(truncate(m.title,TITLE_MAX))+'</div><div class="mc-body">'+esc(truncate(m.content,CONTENT_PREVIEW_LEN))+'</div><div class="mc-footer"><span class="mc-date">'+m.date+'</span><span class="mc-actions"><button onclick="event.stopPropagation();editMemo(\''+m.id+'\')">'+IC.edit+'</button><button onclick="event.stopPropagation();copyOneMemo(\''+m.id+'\')">'+IC.copy+'</button><button onclick="event.stopPropagation();delMemo(\''+m.id+'\')">'+IC.trash+'</button></span></div></div>'});return h}

function editMemo(id){var m=MEMO.find(x=>x.id===id);if(!m)return;var app=document.getElementById('app');let h='<div class="container" style="padding-top:20px"><div style="display:flex;align-items:center;gap:12px;margin-bottom:14px"><button class="pg-back" onclick="R()">'+IC.chevLeft+'</button></div><div class="m-card"><input id="em-title" class="m-input" style="margin-bottom:12px" value="'+esc(m.title)+'"><textarea id="em-body" class="m-textarea m-textarea-xl" style="margin-bottom:12px">'+esc(m.content)+'</textarea><button class="btn btn-dark" onclick="saveMemoEdit(\''+m.id+'\')">儲存</button></div></div>'+renderBottomBar();app.innerHTML=h}

function beginQ(qs,mode,part,fp){S.page='quiz';S.qs=qs;S.mode=mode;S.part=part;S.isFP=fp;S.qi=0;S.ans={};S.flags={};S.tSec=0;S.tOn=false;S.mapOpen=false;S.psgOpen=true;S._bu=null;S.expandedDot=null;if(S._tID){clearInterval(S._tID);S._tID=null}R()}
function renderQuiz(app){var qs=S.qs,q=qs[S.qi];if(!q){goHome();return}let h='<div class="container" style="padding-top:16px"><div style="display:flex;align-items:center;gap:10px;margin-bottom:12px"><button class="pg-back" onclick="showM(\'離開\',\'進度不保存\',goHome,\'離開\')">'+IC.chevLeft+'</button></div><div class="quiz-header"><div class="q-progress">'+(S.qi+1)+'/'+qs.length+'</div><div style="display:flex;align-items:center;gap:8px"><span class="q-timer" id="tmr">'+fmtT(S.tSec)+'</span><div class="timer-btns">';h+=S.tOn?'<button class="timer-btn tb-pause" onclick="tPause();R()">'+IC.pause+'</button>':'<button class="timer-btn tb-play" onclick="tStart();R()">'+IC.play+'</button>';h+='<button class="timer-btn tb-reset" onclick="tReset();R()">'+IC.refresh+'</button></div></div></div>';h+='<div class="qmap-wrap"><button class="qmap-toggle" onclick="S.mapOpen=!S.mapOpen;R()">導覽 '+(S.mapOpen?'▲':'▼')+'</button>';if(S.mapOpen){h+='<div class="qmap">';qs.forEach(function(qq,i){var cls='qmap-dot';if(i===S.qi)cls+=' cur';if(S.flags[i])cls+=' flag';else if(S.ans[i]!==undefined)cls+=' done';h+='<div class="'+cls+'" onclick="S.qi='+i+';R()">'+(i+1)+'</div>'});h+='</div>'}h+='</div>';if(q._part){var prev=S.qi>0?qs[S.qi-1]:null;if(!prev||prev._part!==q._part){var pm=PM.find(p=>p.id===q._part);h+='<div class="part-div"><h4>'+(pm?pm.name:'')+'</h4></div>'}}if(q._part===1&&q.passage&&S._curPsg){h+='<button class="psg-toggle" onclick="S.psgOpen=!S.psgOpen;R()">'+(S.psgOpen?'收起':'展開')+'文章</button>';if(S.psgOpen)h+='<div class="psg-box">'+S._curPsg.replace(/\n/g,'<br>')+'</div>'}h+='<div class="q-card"><div class="q-head"><span class="q-num">'+(q._part?partShort(q._part)+' · ':'')+' Q'+(S.qi+1)+'</span><button class="flag-btn '+(S.flags[S.qi]?'on':'')+'" onclick="S.flags[S.qi]=!S.flags[S.qi];R()">'+IC.flag+'</button></div><div class="q-stem">'+esc(q.stem).replace(/\n/g,'<br>')+'</div>';q.options.forEach(function(o,i){h+='<button class="opt-btn '+(S.ans[S.qi]===i?'sel':'')+'" onclick="pickA('+i+')"><span class="opt-letter">'+'ABCD'[i]+'</span><span>'+esc(o)+'</span></button>'});h+='</div><div class="nav-row">';h+=S.qi>0?'<button class="btn btn-outline" onclick="S.qi--;R();scrollTo(0,0)">上一題</button>':'<div></div>';h+=S.qi===qs.length-1?'<button class="btn btn-danger" onclick="preSubmit()">交卷</button>':'<button class="btn btn-dark" onclick="S.qi++;R();scrollTo(0,0)">下一題</button>';h+='</div></div>';app.innerHTML=h}
function pickA(i){S.ans[S.qi]=i;R()}
function preSubmit(){var qs=S.qs,un=qs.filter((_,i)=>S.ans[i]===undefined).length,fl=Object.values(S.flags).filter(Boolean).length;var msg='共'+qs.length+'題';if(un)msg+='\n'+un+'題未答';if(fl)msg+='\n'+fl+'題不確定';showM('交卷',msg,submitQ,'交卷')}
function submitQ(){tStop();var qs=S.qs,t=nowStr();var cor=0,added=0,removed=0;qs.forEach(function(q,i){var pid=q._part||S.part||1;if(pid<1||pid>4)return;var key=qKey(q);var bi=WB[pid].findIndex(e=>qKey(e)===key);if(S.ans[i]===q.answer){cor++;if(bi>=0){WB[pid].splice(bi,1);removed++}}else if(S.ans[i]!==undefined){if(bi<0){WB[pid].push({stem:q.stem,options:q.options,answer:q.answer,explanation:q.explanation||'',_part:pid,dateAdded:t,yourAnswer:S.ans[i],comments:[],paperId:q.paperId||''});added++}else{WB[pid][bi].yourAnswer=S.ans[i];WB[pid][bi].dateAdded=t}}if(S.flags[i]){var ui=UB[pid].findIndex(e=>qKey(e)===key);if(ui<0)UB[pid].push({stem:q.stem,options:q.options,answer:q.answer,explanation:q.explanation||'',_part:pid,dateAdded:t,yourAnswer:S.ans[i],comments:[],paperId:q.paperId||''})}});PC++;HIST.push({id:uid(),date:t,part:S.part||0,mode:S.mode,total:qs.length,correct:cor,time:S.tSec,isFP:S.isFP,paperLabels:S._paperLabels||'',questions:qs.map(q=>({stem:q.stem,options:q.options,answer:q.answer,explanation:q.explanation||'',_part:q._part,passage:q.passage||false})),answers:Object.assign({},S.ans)});var tw=Object.values(WB).reduce((a,b)=>a+b.length,0);S._bu={a:added,r:removed,tw:tw};S.page='result';S.expandedDot=null;R();scrollTo(0,0);toast('+'+added+'錯題');cloudSaveAll()}
function renderResult(app){var qs=S.qs;var cor=0;qs.forEach(function(q,i){if(S.ans[i]===q.answer)cor++});var pct=qs.length?Math.round(cor/qs.length*100):0;let h='<div class="container" style="padding-top:16px"><div class="result-hero"><div class="rh-score">'+cor+'/'+qs.length+'</div><div class="rh-pct">'+pct+'%</div><div class="rh-time">用時 '+fmtT(S.tSec)+'</div>';if(S._paperLabels)h+='<div class="rh-detail">'+esc(S._paperLabels)+'</div>';if(S.isFP||S.part===0){h+='<div class="bd">';PM.forEach(function(p){var pqs=qs.filter(q=>q._part===p.id);if(!pqs.length)return;var pc=pqs.filter(function(q){return S.ans[qs.indexOf(q)]===q.answer}).length;h+='<div class="bd-i"><div class="bl">'+p.short+'</div><div class="bs">'+pc+'/'+pqs.length+'</div></div>'});h+='</div>'}h+='<div class="result-dots">';qs.forEach(function(q,i){var a=S.ans[i];var cls=a===undefined?'sk':a===q.answer?'ok':'ng';h+='<div class="dot '+cls+' '+(S.expandedDot===i?'expanded':'')+'" onclick="S.expandedDot=S.expandedDot==='+i+'?null:'+i+';R()">'+(i+1)+'</div>'});h+='</div></div>';if(S._bu)h+='<div class="bank-msg">+'+S._bu.a+'錯題 · '+S._bu.r+'掌握 · 現存'+S._bu.tw+'題</div>';if(S.expandedDot!==null){var ei=S.expandedDot,eq=qs[ei],eua=S.ans[ei],eok=eua===eq.answer;h+='<div class="m-card" style="border-left:3px solid '+(eok?'var(--green)':'var(--rose)')+'"><div style="font-size:11px;color:var(--g400);margin-bottom:6px">Q'+(ei+1)+' · '+(eok?'正確':'錯誤')+'</div><div style="font-size:13px;line-height:1.8;white-space:pre-wrap;margin-bottom:8px">'+esc(eq.stem)+'</div>';eq.options.forEach(function(o,j){var c='';if(j===eq.answer)c='color:var(--green);font-weight:600';else if(j===eua&&!eok)c='color:var(--rose);text-decoration:line-through';h+='<div style="'+c+';font-size:13px;padding:2px 0">'+'ABCD'[j]+'. '+esc(o)+(j===eq.answer?' ✓':'')+(j===eua&&!eok?' ←':'')+'</div>'});if(eq.explanation)h+='<div style="margin-top:6px;font-size:12px;color:var(--g500)">'+esc(eq.explanation)+'</div>';h+='</div>'}var lp=0;qs.forEach(function(q,i){if(q._part&&q._part!==lp){lp=q._part;var pm=PM.find(p=>p.id===q._part);h+='<div class="part-div"><h4>'+(pm?pm.name:'')+'</h4></div>'}var ua=S.ans[i],ok=ua===q.answer;h+='<div class="ri '+(ok?'rr':'rw')+'"><div class="ri-h" onclick="togRI('+i+')">'+(ok?'✓':'✗')+' Q'+(i+1)+' <span class="ri-tag '+(ok?'ri-tag-g':'ri-tag-r')+'">'+(ok?'正確':'錯')+'</span></div><div class="ri-b" id="rb'+i+'"><div style="white-space:pre-wrap;margin-bottom:5px;font-size:12px">'+esc(q.stem)+'</div>';q.options.forEach(function(o,j){var cls='';if(j===q.answer)cls='opt-correct';else if(j===ua&&!ok)cls='opt-wrong';h+='<div class="'+cls+'">'+'ABCD'[j]+'. '+esc(o)+(j===q.answer?' ✓':'')+'</div>'});if(q.explanation)h+='<div class="lbl">解釋</div><div>'+esc(q.explanation)+'</div>';h+='</div></div>'});h+='<button class="btn btn-dark" style="margin-top:16px" onclick="goHome()">返回</button></div>'+renderBottomBar();app.innerHTML=h}
function togRI(i){var e=document.getElementById('rb'+i);if(e)e.classList.toggle('show')}
function renderDetail(app){var r=HIST.find(x=>x.id===S.viewRec);if(!r||!r.questions){toast('無法載入');goHome();return}S.qs=r.questions;S.ans=r.answers||{};S.isFP=r.isFP;S.part=r.part;S.tSec=r.time;S._bu=null;S._curPsg=r.passage||'';S._paperLabels=r.paperLabels||'';S.expandedDot=null;renderResult(app)}
function goHome(){tStop();S.page='home';S.expandedDot=null;R()}

function doImport(){var area=document.getElementById('impA'),msg=document.getElementById('impMsg'),labelEl=document.getElementById('impLabel');if(!area)return;var raw=area.value.trim();if(!raw){sMsg(msg,'請paste JSON','r');return}var cm=raw.match(/```(?:json)?\s*([\s\S]*?)```/);if(cm)raw=cm[1].trim();var d;try{d=JSON.parse(raw)}catch(e){sMsg(msg,'JSON錯誤：'+e.message,'r');return}var label=(labelEl&&labelEl.value.trim())||shortDate()+' 練習';var paperId='paper_'+uid();if(d.fullPaper&&d.parts){var tot=0;for(var pid=1;pid<=4;pid++){var pqs=d.parts[String(pid)];if(!pqs||!Array.isArray(pqs))continue;pqs.forEach(q=>{q._part=pid;q.id=uid();q.paperId=paperId});POOL[pid]=POOL[pid].concat(pqs);tot+=pqs.length}PAPERS.push({id:paperId,date:dateStr(),label:label,type:'全份卷',passage:d.passage||'',totalQ:tot});if(d.passage)PSG=d.passage;sMsg(msg,'「'+label+'」+'+tot+'題','g');area.value='';toast('匯入成功');cloudSaveAll();R();return}if(d.part&&d.questions){var pid2=d.part;if(pid2<1||pid2>4){sMsg(msg,'part須1-4','r');return}d.questions.forEach(q=>{q._part=pid2;q.id=uid();q.paperId=paperId});POOL[pid2]=POOL[pid2].concat(d.questions);PAPERS.push({id:paperId,date:dateStr(),label:label,type:partShort(pid2),passage:d.passage||'',totalQ:d.questions.length});sMsg(msg,'「'+label+'」+'+d.questions.length+'題','g');area.value='';toast('匯入成功');cloudSaveAll();R();return}sMsg(msg,'格式錯誤','r')}
function sMsg(el,txt,c){if(!el)return;el.style.display='block';el.style.background=c==='r'?'var(--rose-l)':'var(--green-l)';el.style.color=c==='r'?'var(--rose)':'#065f46';el.textContent=txt}

document.addEventListener('keydown',function(e){if(S.page!=='quiz')return;if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT')return;if(e.key>='1'&&e.key<='4'){e.preventDefault();pickA(parseInt(e.key)-1)}else if(e.key==='ArrowRight'||e.key==='Enter'){e.preventDefault();if(S.qi<S.qs.length-1){S.qi++;R();scrollTo(0,0)}}else if(e.key==='ArrowLeft'){e.preventDefault();if(S.qi>0){S.qi--;R();scrollTo(0,0)}}else if(e.key.toLowerCase()==='f'){e.preventDefault();S.flags[S.qi]=!S.flags[S.qi];R()}});

applyTheme();cloudLoadAll(function(){});
</script>
