<head>

<title>CRE中文運用 — 練習系統 v9.2</title>
<style>
:root{
--pri:#2563eb;--pri-d:#1d4ed8;--pri-dd:#1e40af;--pri-bg:#eff6ff;--pri-l:#dbeafe;--pri-b:#bfdbfe;

--err:#dc2626;--err-bg:#fef2f2;--err-l:#fee2e2;

*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;background:var(--g50);color:var(--g800);line-height:1.6;-webkit-font-smoothing:antialiased}
.container{max-width:480px;margin:0 auto;padding:16px;padding-bottom:80px}

@media(min-width:1024px){.container{max-width:780px;padding:24px 32px 80px}}
.header{background:linear-gradient(135deg,var(--pri-dd),#1e3a8a);color:#fff;padding:16px 20px;text-align:center;position:sticky;top:0;z-index:100;box-shadow:var(--shl)}
.header h1{font-size:15px;font-weight:700;letter-spacing:.3px}

.back-btn{position:absolute;left:12px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.15);border:none;color:#fff;font-size:18px;cursor:pointer;padding:6px 10px;border-radius:var(--rs);transition:.2s}

.tab-bar{display:flex;gap:2px;margin:14px 0;background:var(--g100);padding:4px;border-radius:var(--r);overflow-x:auto;-webkit-overflow-scrolling:touch}

.card{background:#fff;border-radius:var(--r);padding:16px;margin-bottom:10px;box-shadow:var(--sh);border:1px solid var(--g100)}

.btn{width:100%;padding:12px;border:none;border-radius:var(--rs);font-size:14px;font-weight:700;cursor:pointer;transition:.15s var(--ease);display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px}

.btn-p{background:var(--pri);color:#fff}.btn-p:hover:not(:disabled){background:var(--pri-d)}
.btn-e{background:var(--err);color:#fff}.btn-s{background:var(--suc);color:#fff}

.part-div{background:linear-gradient(135deg,var(--pri-bg),var(--pur-bg));border:1px solid var(--pri-l);border-radius:var(--r);padding:12px;margin-bottom:12px;text-align:center}

.q-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.q-stem{font-size:15px;font-weight:600;line-height:1.8;color:var(--g800);white-space:pre-wrap}

.opt-btn{width:100%;min-height:44px;padding:12px 14px;margin-top:8px;border:2px solid var(--g200);border-radius:var(--rs);background:#fff;font-size:14px;text-align:left;cursor:pointer;transition:.15s;line-height:1.5;display:flex;align-items:center}

.nav-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.result-hero{background:linear-gradient(135deg,var(--pri),#1e3a8a);border-radius:var(--r);padding:24px 18px;text-align:center;color:#fff;margin-bottom:14px;box-shadow:var(--shl)}
.result-hero.fp{background:linear-gradient(135deg,var(--pur),#1e3a8a)}
.result-hero .big{font-size:44px;font-weight:900}
.result-hero .pct{font-size:14px;opacity:.8;margin-top:2px}
.result-hero .tm{font-size:12px;opacity:.6;margin-top:4px}
.dots{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin:12px 0}
.dot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff}
.dot.ok{background:var(--suc)}.dot.ng{background:var(--err)}.dot.sk{background:var(--g400)}
.bd{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.bd-i{background:rgba(255,255,255,.12);border-radius:var(--rs);padding:8px;text-align:center}

.bank-msg{background:var(--suc-bg);border:1px solid var(--suc-l);border-radius:var(--rs);padding:10px 12px;margin-bottom:12px;font-size:12px;color:var(--suc)}
.ri{background:#fff;border-radius:var(--rs);margin-bottom:6px;border:1px solid var(--g100);overflow:hidden}
.ri.rw{border-left:3px solid var(--err)}.ri.rr{border-left:3px solid var(--suc)}.ri.ru{border-left:3px solid var(--wrn)}
.ri-h{padding:10px 12px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-size:12px;font-weight:600}
.ri-h:hover{background:var(--g50)}
.ri-tag{font-size:10px;padding:2px 6px;border-radius:8px;font-weight:600}
.ri-tag-r{background:var(--err-l);color:var(--err)}
.ri-tag-g{background:var(--suc-l);color:var(--suc)}
.ri-tag-w{background:var(--wrn-l);color:var(--wrn)}
.ri-b{padding:0 12px 12px;border-top:1px solid var(--g100);display:none;font-size:13px;line-height:1.7}
.ri-b.show{display:block;padding-top:10px}
.ri-b .lbl{font-weight:700;color:var(--g500);font-size:11px;margin-top:6px;margin-bottom:2px}
.ri-b .opt-line{padding:2px 0}
.ri-b .opt-correct{color:var(--suc);font-weight:600}
.ri-b .opt-wrong{color:var(--err);text-decoration:line-through}
.ri-del{background:none;border:none;color:var(--g400);font-size:14px;cursor:pointer;padding:4px;margin-left:8px}
.ri-del:hover{color:var(--err)}
.psg-in-bank{background:var(--g50);border:1px solid var(--g200);border-radius:var(--rx);padding:10px;margin-top:6px;font-size:12px;line-height:1.8;max-height:150px;overflow-y:auto;white-space:pre-wrap}
.hi-card{background:#fff;border-radius:var(--rs);padding:12px 14px;margin-bottom:6px;box-shadow:0 1px 2px rgba(0,0,0,.04);border:1px solid var(--g100);cursor:pointer;transition:.15s}
.hi-card:hover{border-color:var(--pri-l);box-shadow:var(--sh)}
.hi-card.fp{border-left:3px solid var(--pur)}
.hi-card .hd{font-size:11px;color:var(--g400)}.hi-card .ht{font-size:13px;font-weight:700;margin:2px 0}.hi-card .hs{font-size:12px;color:var(--pri);font-weight:600}
.grp-title{font-size:11px;font-weight:700;color:var(--g400);letter-spacing:.5px;margin:14px 0 6px}
.empty{text-align:center;padding:40px 16px;color:var(--g400);font-size:13px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--g800);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:500;z-index:999;opacity:0;transition:.3s var(--ease);pointer-events:none;box-shadow:var(--shl)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:.2s}
.modal-ov.show{opacity:1;pointer-events:auto}
.modal-bx{background:#fff;border-radius:var(--r);padding:24px;max-width:360px;width:100%;box-shadow:var(--shl);text-align:center}
.modal-bx h3{font-size:16px;margin-bottom:6px}.modal-bx p{font-size:13px;color:var(--g500);margin-bottom:16px;white-space:pre-wrap}
.modal-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modal-btns .btn{font-size:13px;padding:10px}
.sub-tabs{display:flex;gap:2px;background:var(--g100);padding:3px;border-radius:var(--rs);margin-bottom:12px}
.sub-tab{flex:1;padding:7px 4px;border:none;border-radius:var(--rx);background:transparent;color:var(--g500);font-size:11px;font-weight:600;cursor:pointer;text-align:center}
.sub-tab.on{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.sub-tab.on.err-tab{color:var(--err)}
.sub-tab.on.unc-tab{color:var(--wrn)}
.save-info{background:var(--g50);border:1px solid var(--g200);border-radius:var(--rs);padding:10px 12px;font-size:11px;line-height:1.7;color:var(--g600);margin:8px 0}
.save-info strong{color:var(--g800)}
.cloud-status{padding:10px 14px;border-radius:var(--rs);font-size:12px;margin:10px 0;display:none}
.cloud-status.show{display:block}
.cloud-status.ok{background:var(--suc-bg);border:1px solid var(--suc-l);color:var(--suc)}
.cloud-status.err{background:var(--err-bg);border:1px solid var(--err-l);color:var(--err)}
.cloud-status.loading{background:var(--wrn-bg);border:1px solid var(--wrn-l);color:var(--wrn)}
.paper-card{background:#fff;border:1px solid var(--g200);border-radius:var(--rs);padding:14px;margin-bottom:8px;cursor:pointer;transition:.15s;border-left:4px solid var(--pur)}
.paper-card:hover{box-shadow:var(--shm);border-color:var(--pur-l)}
.paper-card .pc-head{display:flex;justify-content:space-between;align-items:center}
.paper-card .pc-date{font-size:11px;color:var(--g400)}
.paper-card .pc-label{font-size:13px;font-weight:700;color:var(--g800);margin:2px 0}
.paper-card .pc-stats{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.paper-card .pc-tag{font-size:10px;padding:2px 6px;border-radius:10px;font-weight:600;background:var(--pri-bg);color:var(--pri);border:1px solid var(--pri-l)}
.paper-card .pc-del{background:none;border:none;font-size:12px;color:var(--g400);cursor:pointer;padding:4px 8px}
.paper-card .pc-del:hover{color:var(--err)}

.shuffle-papers input[type=checkbox]{width:18px;height:18px;accent-color:var(--pur)}
.shuffle-papers .sp-info{font-size:10px;color:var(--g400);margin-left:auto}
.comment-box{margin-top:8px;padding:8px;background:var(--g50);border:1px solid var(--g200);border-radius:var(--rx)}
.comment-item{background:#fff;border:1px solid var(--g200);border-radius:var(--rx);padding:6px 8px;margin-bottom:4px;font-size:11px}

.comment-input{display:flex;gap:6px;margin-top:6px}
.comment-input input{flex:1;border:1px solid var(--g200);border-radius:var(--rx);padding:6px 8px;font-size:12px}
.comment-input input:focus{border-color:var(--pri);outline:none}
.comment-input button{padding:6px 10px;border:none;border-radius:var(--rx);background:var(--pri);color:#fff;font-size:11px;font-weight:600;cursor:pointer}
</style>
</head>

<div class="modal-ov" id="mo"><div class="modal-bx"><h3 id="mT"></h3><p id="mM"></p><div class="modal-btns"><button class="btn btn-o" onclick="closeM()">取消</button><button class="btn btn-e" id="mC">確定</button></div></div></div>
<script>
// ===== CONFIG =====
const CLOUD_URL = 'https://script.google.com/macros/s/AKfycbwSlrUxnW6MZw8SFdkwa1UF07QykfUM49xsFntlTO5Z2j1qViA3vSMhq1X3hgmjvW07/exec';
const CLOUD_TOKEN = 'mySecret2026';
const CLOUD_FILE = 'cre_chinese_v9.txt';

// ===== UTILS =====
function showM(t,m,cb,ok){document.getElementById('mT').textContent=t;document.getElementById('mM').textContent=m;const b=document.getElementById('mC');b.textContent=ok||'確定';b.onclick=()=>{closeM();cb()};document.getElementById('mo').classList.add('show')}
function closeM(){document.getElementById('mo').classList.remove('show')}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function nowStr(){const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+' '+p2(d.getHours())+':'+p2(d.getMinutes())}
function dateStr(){const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function shortDate(){const d=new Date();return(d.getMonth()+1)+'月'+d.getDate()+'日'}
function p2(n){return String(n).padStart(2,'0')}
function fmtT(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function fmtB(b){return b<1024?b+'B':b<1048576?(b/1024).toFixed(1)+'KB':(b/1048576).toFixed(1)+'MB'}
function uid(){return Date.now().toString(36)+Math.random().toString(36).substr(2,5)}
function qKey(q){return(q.stem||'').substring(0,50)+'##'+((q.options&&q.options[0])||'')}
function shuffleArr(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}

const PM=[
{id:1,name:"Part 1 — 閱讀理解",desc:"文章+片段閱讀",count:14,icon:"📖"},
{id:2,name:"Part 2 — 字詞辨識",desc:"錯別字+簡化字",count:8,icon:"✍️"},
{id:3,name:"Part 3 — 句子辨析",desc:"語病+邏輯",count:8,icon:"🔍"},
{id:4,name:"Part 4 — 詞句運用",desc:"填充+銜接+排序",count:15,icon:"📝"}
];

// ===== 完整出題規範 PROMPTS =====
const PROMPTS={
1:`你是CRE中文運用出卷委員。請出Part 1閱讀理解共14題。

【結構】
- Section I 文章閱讀（8題）：先寫一篇600-900字議論/說明文，再出8題
- Section II 片段閱讀（6題）：每題自帶80-150字語段於stem內

【文章要求】
- 主題：公共政策/社會現象/工作文化/教育/環保/科技與生活（不涉政治爭議/宗教/專業學術）
- 文體：議論文或說明文，中高級書面語

【Section I出題規則（8題）】

2:`你是CRE中文運用出卷委員。請出Part 2字詞辨識共8題。

3:`你是CRE中文運用出卷委員。請出Part 3句子辨析共8題。

【結構】
- 語病辨析（4題）
- 邏輯辨析（4題）

【語病題規則（4題）】
- 題幹：「選出有語病的句子」
- 4個選項各為完整句子（20-40字，用長複句）
- 恰好1句有語病，其餘3句語法完全正確
- 語病類型分配（每題用一種）：
  ① 搭配不當（「加強杜絕」）
  ② 語義重複（「目的是為了」「親自登門拜訪道謝」）
  ③ 關聯詞搭配錯誤（「由於…以致…」）
  ④ 成分殘缺/多餘
- 語病要隱蔽——讀起來順口但結構有問題
- 正確句要包含長複句（讓考生「覺得太長應該有問題」但實際無問題）

【邏輯題規則（4題）】
- 題幹：「選出沒有犯邏輯錯誤的句子」
- 4個選項各為完整句子
- 恰好1句邏輯正確，其餘3句有邏輯錯誤
- 錯誤類型（每題3個干擾項各用不同類型）：
  ① 自相矛盾（「十個全部準確，只是最後一個有差誤」）
  ② 分類交叉（「對象是男性和中下階層」——不互斥）
  ③ 肯定後件（「只有A才B。有B，所以一定A」→ 無效推理）
  ④ 否定前件（「若A則B。非A，所以非B」→ 無效推理）
  ⑤ 程度絕對化（「現代人壓力大，所以都有精神問題」）
- 正確句用「否定後件」（有效推理）或無邏輯瑕疵的普通陳述
- 正確句不可太短/太簡單

【質量檢查】
- 語病必須能明確指出具體錯誤類型（不可灰色地帶）
- 邏輯錯誤必須可用形式邏輯證明
- 內容取材：政府施政/工作/學校/社區/日常推理
- 8題正確答案ABCD均勻分佈

- answer為0-3
- 共8題

請直接輸出JSON。`,

// ===== STATE =====
let POOL={1:[],2:[],3:[],4:[]};

let UB={1:[],2:[],3:[],4:[]};

let IMP={1:0,2:0,3:0,4:0,full:0};
let PC=0;

let S={
page:'home',tab:'quiz',wbSub:'wrong',poolPart:null,
part:null,qi:0,ans:{},flags:{},
tSec:0,tOn:false,_tID:null,
psgOpen:true,mode:'normal',qs:null,
isFP:false,mapOpen:false,_bu:null,viewRec:null,
_curPsg:'',_paperLabels:''
};

// ===== TIMER =====
function tStart(){if(S._tID)clearInterval(S._tID);S.tOn=true;S._tID=setInterval(()=>{S.tSec++;const e=document.getElementById('tmr');if(e)e.textContent=fmtT(S.tSec)},1000)}
function tPause(){S.tOn=false;if(S._tID){clearInterval(S._tID);S._tID=null}}
function tReset(){tPause();S.tSec=0}
function tStop(){tPause()}

// ===== CLOUD (ALL-IN-ONE) =====
function buildSave(){
return{v:'9.2',savedAt:nowStr(),wb:WB,ub:UB,hist:HIST,imp:IMP,pc:PC,psg:PSG,pool:POOL,papers:PAPERS};
}
function applyLoad(d){
if(d.wb)WB=d.wb;if(d.ub)UB=d.ub;if(d.hist)HIST=d.hist;
if(d.psg)PSG=d.psg;if(d.imp)IMP=d.imp;if(d.pc!==undefined)PC=d.pc;
if(d.pool){for(let i=1;i<=4;i++)POOL[i]=d.pool[i]||[]}
if(d.papers)PAPERS=d.papers;
for(let i=1;i<=4;i++){if(!WB[i])WB[i]=[];if(!UB[i])UB[i]=[];if(!POOL[i])POOL[i]=[]}
}

function cloudSaveAll(){
const el=document.getElementById('cloudSt');
if(el){el.className='cloud-status show loading';el.textContent='⏳ 儲存中...';}
const saveData=JSON.stringify(buildSave());
fetch(CLOUD_URL,{method:'POST',body:JSON.stringify({token:CLOUD_TOKEN,file:CLOUD_FILE,data:saveData})})
.then(r=>r.json())
.then(res=>{
if(res.ok){
if(el){el.className='cloud-status show ok';el.textContent='✅ 已儲存 '+nowStr()+' ('+fmtB(res.bytes)+')';}
toast('☁️ 已儲存!');
}else{
if(el){el.className='cloud-status show err';el.textContent='❌ '+res.msg;}
toast('儲存失敗');
}
}).catch(err=>{
if(el){el.className='cloud-status show err';el.textContent='❌ '+err.message;}
toast('儲存失敗');
});
}

function cloudLoadAll(cb){
const el=document.getElementById('cloudSt');
if(el){el.className='cloud-status show loading';el.textContent='⏳ 讀取中...';}
fetch(CLOUD_URL+'?token='+encodeURIComponent(CLOUD_TOKEN)+'&file='+encodeURIComponent(CLOUD_FILE))
.then(r=>r.json())
.then(res=>{
if(res.ok){
let d;try{d=JSON.parse(res.data)}catch(e){
if(el){el.className='cloud-status show err';el.textContent='❌ 資料損壞';}
toast('資料損壞');if(cb)cb();return;
}
applyLoad(d);
if(el){el.className='cloud-status show ok';el.textContent='✅ 已讀取 '+nowStr();}
toast('☁️ 已讀取!');
}else{
if(el){el.className='cloud-status show err';el.textContent='⚠️ '+(res.msg||'未找到存檔');}
}
if(cb)cb();R();
}).catch(err=>{
if(el){el.className='cloud-status show err';el.textContent='❌ '+err.message;}
if(cb)cb();R();
});
}

// ===== RENDER =====
function R(){
const app=document.getElementById('app');
if(S.page==='quiz')renderQuiz(app);
else if(S.page==='result')renderResult(app);
else if(S.page==='detail')renderDetail(app);
else renderHome(app);
}

function renderHome(app){
const tabs=['quiz','pool','wrong','history','import','save'];

h+=`<div class="tab-bar">${tabs.map((t,i)=>`<button class="tab-btn ${S.tab===t?'active':''}" onclick="S.tab='${t}';S.poolPart=null;R()">${tNames[i]}</button>`).join('')}</div>`;
if(S.tab==='quiz')h+=tabQuiz();
else if(S.tab==='pool')h+=tabPool();
else if(S.tab==='wrong')h+=tabWrong();
else if(S.tab==='history')h+=tabHist();
else if(S.tab==='import')h+=tabImport();
else h+=tabSave();
h+=`</div>`;app.innerHTML=h;
}

h+=`<div class="sec-title" style="margin-top:24px">📋 出題 Prompt（複製去AI用）</div>`;

function renderBank(bank,type){

function bankItem(q,idx,pid,bank){

function renderResult(app){

if(S.isFP){h+=`<div class="bd">`;PM.forEach(p=>{const pqs=qs.filter(q=>q._part===p.id);const pc=pqs.filter(q=>{const gi=qs.indexOf(q);return S.ans[gi]===q.answer}).length;h+=`<div class="bd-i"><div class="bl">P${p.id}</div><div class="bs">${pc}/${pqs.length}</div></div>`});h+=`</div>`}
h+=`<div class="dots">`;qs.forEach((q,i)=>{const a=S.ans[i];h+=`<div class="dot ${a===undefined?'sk':a===q.answer?'ok':'ng'}">${i+1}</div>`});h+=`</div></div>`;
if(S._bu)h+=`<div class="bank-msg">✅ +${S._bu.a}錯題 · ${S._bu.r}掌握 · 現存${S._bu.tw}題${S._bu.u?` · +${S._bu.u}不確定`:''}</div>`;
h+=`<div class="sec-title">逐題溫習</div>`;
let lp=0;qs.forEach((q,i)=>{
if(S.isFP&&q._part&&q._part!==lp){lp=q._part;const pm=PM.find(p=>p.id===q._part);h+=`<div class="part-div"><h4>${pm?pm.icon:''} ${pm?pm.name:''}</h4></div>`}
const ua=S.ans[i],ok=ua===q.answer;h+=riItem(q,i,ua,ok);
});

function riItem(q,i,ua,ok){
let h=`<div class="ri ${ok?'rr':'rw'}"><div class="ri-h" onclick="togRI(${i})"><span>${ok?'✓':'✗'} Q${i+1}</span><span class="ri-tag ${ok?'ri-tag-g':'ri-tag-r'}">${ok?'正確':'錯誤'}</span></div><div class="ri-b" id="rb${i}">`;

// ===== ACTIONS =====
function goHome(){tStop();S.page='home';R()}
function pickA(i){S.ans[S.qi]=i;R()}
function viewR(id){S.viewRec=id;S.page='detail';R();scrollTo(0,0)}

function startP(pid){
if(!POOL[pid]||!POOL[pid].length){toast('題池冇題目，去「匯入」加卷');return}
let qs=JSON.parse(JSON.stringify(POOL[pid]));qs.forEach(q=>q._part=pid);
const paper=PAPERS.find(p=>POOL[pid].some(q=>q.paperId===p.id&&q.passage));
S._curPsg=paper?paper.passage||'':'';
beginQ(qs,'normal',pid,false);
}

function startShufflePapers(){
const cbs=document.querySelectorAll('.shp-cb:checked');
if(!cbs.length){toast('請揀至少一份Paper');return}
const ids=[...cbs].map(c=>c.value);
let all=[];
for(let i=1;i<=4;i++){
POOL[i].filter(q=>ids.includes(q.paperId)).forEach(q=>{all.push({...JSON.parse(JSON.stringify(q)),_part:i})});
}
if(!all.length){toast('揀咗嘅Paper冇題目');return}
const numEl=document.getElementById('shNum');
let num=numEl?parseInt(numEl.value):0;
if(!num||num>=all.length)num=all.length;
all=shuffleArr(all).slice(0,num);
const firstPaper=PAPERS.find(p=>ids.includes(p.id)&&p.passage);
S._curPsg=firstPaper?firstPaper.passage:'';
S._paperLabels=ids.map(id=>{const p=PAPERS.find(x=>x.id===id);return p?p.label:''}).filter(Boolean).join(', ');
beginQ(all,'shuffle',0,false);
}

function startReview(pid,bank){
const src=bank==='wrong'?WB:UB;
if(!src[pid]||!src[pid].length){toast('冇題目');return}
let qs=JSON.parse(JSON.stringify(src[pid]));qs.forEach(q=>q._part=pid);
S._curPsg=(qs[0]&&qs[0]._passage)||'';
beginQ(qs,'review',pid,false);
}
function startBankShuffle(bank){
const src=bank==='wrong'?WB:UB;
let all=[];Object.keys(src).forEach(k=>src[k].forEach(q=>all.push({...JSON.parse(JSON.stringify(q)),_part:+k})));
if(!all.length){toast('冇題目');return}
shuffleArr(all);S._curPsg='';
beginQ(all,'shuffle',0,false);
}

function beginQ(qs,mode,part,fp){
S.page='quiz';S.qs=qs;S.mode=mode;S.part=part;S.isFP=fp;
S.qi=0;S.ans={};S.flags={};S.tSec=0;S.tOn=false;S.mapOpen=false;S.psgOpen=true;S._bu=null;
if(S._tID){clearInterval(S._tID);S._tID=null}
R();
}

// ===== SUBMIT =====
function submitQ(){
tStop();const qs=S.qs;const submitTime=nowStr();
let cor=0,added=0,removed=0,uncAdded=0;
qs.forEach((q,i)=>{
const pid=q._part||S.part||1;if(pid<1||pid>4)return;
const key=qKey(q);const bi=WB[pid].findIndex(e=>qKey(e)===key);
if(S.ans[i]===q.answer){cor++;if(bi>=0){WB[pid].splice(bi,1);removed++}}
else if(S.ans[i]!==undefined){
if(bi<0){
const entry={stem:q.stem,options:q.options,answer:q.answer,explanation:q.explanation||'',_part:pid,dateAdded:submitTime,yourAnswer:S.ans[i],comments:[]};
if(pid===1&&S._curPsg){entry._passage=S._curPsg}
WB[pid].push(entry);added++;
}else{WB[pid][bi].yourAnswer=S.ans[i];WB[pid][bi].dateAdded=submitTime}
}
if(S.flags[i]){
const ui=UB[pid].findIndex(e=>qKey(e)===key);
if(ui<0){
const entry={stem:q.stem,options:q.options,answer:q.answer,explanation:q.explanation||'',_part:pid,dateAdded:submitTime,yourAnswer:S.ans[i],comments:[]};
if(pid===1&&S._curPsg){entry._passage=S._curPsg}
UB[pid].push(entry);uncAdded++;
}
}
});
PC++;
HIST.push({id:uid(),date:submitTime,part:S.part||0,mode:S.mode,total:qs.length,correct:cor,time:S.tSec,isFP:S.isFP,passage:S._curPsg||'',paperLabels:S._paperLabels||'',questions:qs.map(q=>({stem:q.stem,options:q.options,answer:q.answer,explanation:q.explanation||'',_part:q._part,passage:q.passage||false})),answers:{...S.ans}});
const tw=Object.values(WB).reduce((a,b)=>a+b.length,0);
S._bu={a:added,r:removed,tw,u:uncAdded};
S.page='result';R();scrollTo(0,0);toast(`已儲存！+${added}錯題`);
// 自動雲端儲存
cloudSaveAll();
}

// ===== IMPORT =====
function doImport(){
const area=document.getElementById('impA'),msg=document.getElementById('impMsg'),labelEl=document.getElementById('impLabel');
if(!area)return;
let raw=area.value.trim();if(!raw){sMsg(msg,'請paste JSON','r');return}
const cm=raw.match(/```(?:json)?\s*([\s\S]*?)```/);if(cm)raw=cm[1].trim();
let d;try{d=JSON.parse(raw)}catch(e){sMsg(msg,'JSON錯誤：'+e.message,'r');return}
const impTime=nowStr();
const label=(labelEl&&labelEl.value.trim())||shortDate()+' 練習';
const paperId='paper_'+Date.now().toString(36)+Math.random().toString(36).substr(2,4);

if(d.fullPaper&&d.parts){
let tot=0;const counts={};
for(let pid=1;pid<=4;pid++){
const pqs=d.parts[String(pid)];if(!pqs||!Array.isArray(pqs))continue;
pqs.forEach(q=>{q._part=pid;q.id=uid();q.paperId=paperId;q.paperDate=dateStr()});
POOL[pid]=POOL[pid].concat(pqs);
tot+=pqs.length;counts[pid]=pqs.length;IMP[pid]++;
}
PAPERS.push({id:paperId,date:dateStr(),label:label,addedAt:impTime,type:'全份卷',passage:d.passage||'',counts:counts,totalQ:tot});
if(d.passage)PSG=d.passage;
IMP.full++;
sMsg(msg,`✓ 全份卷「${label}」匯入！共+${tot}題`,'g');area.value='';toast('匯入成功');
cloudSaveAll();R();return;
}
if(!d.part||!d.questions){sMsg(msg,'格式錯誤：需要有 part + questions 或 fullPaper + parts','r');return}
const pid=d.part;if(pid<1||pid>4){sMsg(msg,'part須1-4','r');return}
d.questions.forEach(q=>{q._part=pid;q.id=uid();q.paperId=paperId;q.paperDate=dateStr()});
POOL[pid]=POOL[pid].concat(d.questions);
const counts={};counts[pid]=d.questions.length;
PAPERS.push({id:paperId,date:dateStr(),label:label,addedAt:impTime,type:'Part '+pid,passage:d.passage||'',counts:counts,totalQ:d.questions.length});
if(d.passage)PSG=d.passage;
IMP[pid]++;
sMsg(msg,`✓「${label}」Part ${pid} +${d.questions.length}題`,'g');area.value='';toast('匯入成功');
cloudSaveAll();R();
}
function sMsg(el,txt,c){if(!el)return;el.style.display='block';el.style.background=c==='r'?'var(--err-bg)':'var(--suc-bg)';el.style.color=c==='r'?'var(--err)':'var(--suc)';el.textContent=txt}

// ===== SAVE/LOAD =====
function doExport(){copyTxt(JSON.stringify(buildSave()));toast('存檔已複製！')}
function doLoad(){
const area=document.getElementById('loadA');if(!area)return;
let raw=area.value.trim();if(!raw){toast('請paste');return}
let d;try{d=JSON.parse(raw)}catch(e){toast('JSON錯誤');return}
applyLoad(d);toast('已還原！');area.value='';R();
}
function copyTxt(t){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).catch(()=>fbCopy(t));else fbCopy(t)}
function fbCopy(t){const ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta)}

// ===== KEYBOARD =====
document.addEventListener('keydown',e=>{
if(S.page!=='quiz')return;
if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT')return;
const qs=S.qs;if(!qs)return;const q=qs[S.qi];if(!q)return;
if(e.key>='1'&&e.key<=String(q.options.length)){e.preventDefault();pickA(parseInt(e.key)-1)}
else if(e.key==='ArrowRight'||e.key==='Enter'){e.preventDefault();if(S.qi<qs.length-1){S.qi++;R();scrollTo(0,0)}}
else if(e.key==='ArrowLeft'){e.preventDefault();if(S.qi>0){S.qi--;R();scrollTo(0,0)}}
else if(e.key.toLowerCase()==='f'){e.preventDefault();S.flags[S.qi]=!S.flags[S.qi];R()}
});

// ===== INIT =====
cloudLoadAll(()=>{});
</script>
