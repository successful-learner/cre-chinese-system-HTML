<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRE中文運用 — 練習系統 v7.3</title>
<style>
:root{
--blue-50:#eff6ff;--blue-100:#dbeafe;--blue-200:#bfdbfe;--blue-500:#3b82f6;--blue-600:#2563eb;--blue-700:#1d4ed8;--blue-800:#1e40af;--blue-900:#1e3a8a;
--green-50:#f0fdf4;--green-100:#dcfce7;--green-500:#22c55e;--green-600:#16a34a;--green-700:#15803d;
--red-50:#fef2f2;--red-100:#fee2e2;--red-500:#ef4444;--red-600:#dc2626;--red-700:#b91c1c;
--amber-50:#fffbeb;--amber-100:#fef3c7;--amber-500:#f59e0b;--amber-600:#d97706;
--purple-50:#faf5ff;--purple-100:#f3e8ff;--purple-500:#a855f7;--purple-600:#9333ea;--purple-700:#7e22ce;
--gray-50:#f9fafb;--gray-100:#f3f4f6;--gray-200:#e5e7eb;--gray-300:#d1d5db;--gray-400:#9ca3af;--gray-500:#6b7280;--gray-600:#4b5563;--gray-700:#374151;--gray-800:#1f2937;--gray-900:#111827;
--radius:12px;--radius-sm:8px;--radius-xs:6px;
--shadow-sm:0 1px 2px rgba(0,0,0,.05);--shadow:0 1px 3px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.06);--shadow-md:0 4px 6px -1px rgba(0,0,0,.1),0 2px 4px -2px rgba(0,0,0,.1);--shadow-lg:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -4px rgba(0,0,0,.1);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;background:var(--gray-50);color:var(--gray-800);line-height:1.6;-webkit-font-smoothing:antialiased;padding-bottom:40px}
.container{max-width:480px;margin:0 auto;padding:16px}
.header{background:linear-gradient(135deg,var(--blue-800),var(--blue-900));color:#fff;padding:18px 20px;text-align:center;position:sticky;top:0;z-index:100;box-shadow:var(--shadow-lg)}
.header h1{font-size:15px;font-weight:700;letter-spacing:.3px}
.header .ver{font-size:10px;opacity:.5;margin-top:2px}
.back-btn{position:absolute;left:14px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.15);border:none;color:#fff;font-size:18px;cursor:pointer;padding:6px 10px;border-radius:var(--radius-sm);transition:background .2s}
.back-btn:hover{background:rgba(255,255,255,.25)}

.tab-bar{display:flex;gap:3px;margin:16px 0;background:var(--gray-100);padding:4px;border-radius:var(--radius);overflow-x:auto}
.tab-btn{flex:1;min-width:44px;padding:9px 4px;border:none;border-radius:var(--radius-sm);background:transparent;color:var(--gray-500);font-size:11px;font-weight:600;cursor:pointer;text-align:center;transition:all .2s;white-space:nowrap}
.tab-btn.active{background:#fff;color:var(--blue-700);box-shadow:var(--shadow-sm)}

.card{background:#fff;border-radius:var(--radius);padding:18px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--gray-100)}
.card h3{font-size:14px;color:var(--blue-800);font-weight:700;margin-bottom:4px}
.card p{font-size:12px;color:var(--gray-500)}

.badge{display:inline-block;font-size:10px;padding:3px 8px;border-radius:20px;font-weight:600;margin-top:6px;margin-right:4px}
.badge-blue{background:var(--blue-50);color:var(--blue-700);border:1px solid var(--blue-200)}
.badge-red{background:var(--red-50);color:var(--red-600);border:1px solid var(--red-100)}
.badge-green{background:var(--green-50);color:var(--green-700);border:1px solid var(--green-100)}
.badge-amber{background:var(--amber-50);color:var(--amber-600);border:1px solid var(--amber-100)}
.badge-purple{background:var(--purple-50);color:var(--purple-700);border:1px solid var(--purple-100)}

.stat-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px}
.stat-card{background:#fff;border-radius:var(--radius);padding:14px;text-align:center;box-shadow:var(--shadow);border:1px solid var(--gray-100)}
.stat-num{font-size:24px;font-weight:800;color:var(--blue-700)}
.stat-lbl{font-size:10px;color:var(--gray-400);margin-top:2px;font-weight:500}

.section-title{font-size:13px;font-weight:700;color:var(--gray-600);margin:20px 0 10px;display:flex;align-items:center;gap:6px}
.section-title::before{content:'';width:3px;height:14px;background:var(--blue-600);border-radius:2px}

.part-card{background:#fff;border-radius:var(--radius);padding:18px;margin-bottom:10px;box-shadow:var(--shadow);border:1px solid var(--gray-100);cursor:pointer;transition:all .15s;position:relative;overflow:hidden}
.part-card:hover{box-shadow:var(--shadow-md);border-color:var(--blue-200)}
.part-card:active{transform:scale(.98)}
.part-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--blue-600)}
.part-card.full-paper::before{background:linear-gradient(180deg,var(--purple-500),var(--blue-600))}
.part-card.full-paper{border-color:var(--purple-100)}
.part-card h3{font-size:14px;color:var(--blue-800);font-weight:700;padding-left:6px}
.part-card.full-paper h3{color:var(--purple-700)}
.part-card p{font-size:12px;color:var(--gray-500);margin-top:2px;padding-left:6px}
.part-card .arrow{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--gray-300);font-size:18px}

.btn{width:100%;padding:13px;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:700;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-primary{background:var(--blue-700);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--blue-800)}
.btn-danger{background:var(--red-600);color:#fff}
.btn-danger:hover:not(:disabled){background:var(--red-700)}
.btn-green{background:var(--green-600);color:#fff}
.btn-green:hover:not(:disabled){background:var(--green-700)}
.btn-purple{background:var(--purple-600);color:#fff}
.btn-purple:hover:not(:disabled){background:var(--purple-700)}
.btn-gray{background:var(--gray-500);color:#fff}
.btn-outline{background:#fff;color:var(--blue-700);border:2px solid var(--blue-200)}
.btn-outline:hover{background:var(--blue-50)}
.btn-sm{padding:8px 14px;font-size:12px;width:auto;border-radius:var(--radius-xs)}

.info-box{border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;font-size:12px;line-height:1.8}
.info-box h4{font-size:13px;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.info-box ol,.info-box ul{padding-left:18px}
.info-blue{background:var(--blue-50);border:1px solid var(--blue-200);color:var(--blue-800)}
.info-amber{background:var(--amber-50);border:1px solid var(--amber-100);color:#92400e}
.info-green{background:var(--green-50);border:1px solid var(--green-100);color:var(--green-700)}
.info-red{background:var(--red-50);border:1px solid var(--red-100);color:var(--red-700)}
.info-purple{background:var(--purple-50);border:1px solid var(--purple-100);color:var(--purple-700)}

.textarea{width:100%;border:2px solid var(--gray-200);border-radius:var(--radius-sm);padding:12px;font-size:12px;font-family:'SF Mono',SFMono-Regular,Menlo,monospace;resize:vertical;transition:border-color .2s;line-height:1.5}
.textarea:focus{border-color:var(--blue-500);outline:none}
.textarea-sm{height:80px}
.textarea-md{height:120px}
.textarea-lg{height:180px}

.prompt-card{background:#fff;border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--gray-100)}
.prompt-card.master{border-color:var(--purple-100);border-left:4px solid var(--purple-500)}
.prompt-card h3{font-size:13px;color:var(--blue-800);margin-bottom:8px}
.prompt-card.master h3{color:var(--purple-700)}
.prompt-text{background:var(--gray-50);border:1px solid var(--gray-200);border-radius:var(--radius-sm);padding:12px;font-size:11px;max-height:160px;overflow-y:auto;white-space:pre-wrap;line-height:1.6;font-family:'SF Mono',monospace}

/* Quiz */
.quiz-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 0}
.progress-text{font-size:13px;color:var(--gray-500);font-weight:500}
.timer-display{font-size:22px;font-weight:800;color:var(--blue-700);font-variant-numeric:tabular-nums}
.timer-row{display:flex;gap:8px;align-items:center;margin-bottom:14px}
.timer-btn{padding:6px 12px;border-radius:var(--radius-xs);border:none;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
.timer-btn-start{background:var(--green-100);color:var(--green-700)}
.timer-btn-pause{background:var(--amber-100);color:var(--amber-600)}
.timer-btn-reset{background:var(--gray-100);color:var(--gray-500)}
.part-divider{background:linear-gradient(135deg,var(--blue-50),var(--purple-50));border:1px solid var(--blue-200);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;text-align:center}
.part-divider h4{font-size:14px;color:var(--blue-800);font-weight:700}
.part-divider p{font-size:11px;color:var(--gray-500);margin-top:2px}
.passage-toggle{background:var(--blue-50);border:1px solid var(--blue-200);border-radius:var(--radius-sm);padding:12px 16px;width:100%;text-align:left;font-size:13px;color:var(--blue-700);cursor:pointer;margin-bottom:12px;font-weight:600}
.passage-toggle:hover{background:var(--blue-100)}
.passage-content{background:var(--gray-50);border-radius:var(--radius-sm);padding:16px;margin-bottom:16px;font-size:14px;line-height:2;max-height:260px;overflow-y:auto;border:1px solid var(--gray-200)}
.q-card{background:#fff;border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);border:1px solid var(--gray-100);margin-bottom:14px}
.q-stem{font-size:15px;font-weight:600;margin-bottom:16px;line-height:1.8;color:var(--gray-800)}
.opt-btn{width:100%;min-height:44px;padding:14px 16px;margin-bottom:8px;border:2px solid var(--gray-200);border-radius:var(--radius-sm);background:#fff;font-size:14px;text-align:left;cursor:pointer;transition:all .15s;line-height:1.5;display:flex;align-items:center}
.opt-btn:hover{border-color:var(--blue-300);background:var(--blue-50)}
.opt-btn.selected{border-color:var(--blue-600);background:var(--blue-50);color:var(--blue-800);font-weight:600}
.nav-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.nav-row.single{grid-template-columns:1fr}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal-box{background:#fff;border-radius:var(--radius);padding:24px;max-width:320px;width:100%;box-shadow:var(--shadow-lg);text-align:center}
.modal-box h3{font-size:16px;color:var(--gray-800);margin-bottom:8px}
.modal-box p{font-size:13px;color:var(--gray-500);margin-bottom:18px}
.modal-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modal-btns .btn{font-size:13px;padding:10px}

/* Result */
.result-hero{background:linear-gradient(135deg,var(--blue-700),var(--blue-900));border-radius:var(--radius);padding:28px 20px;text-align:center;color:#fff;margin-bottom:16px;box-shadow:var(--shadow-lg)}
.result-hero.full-paper{background:linear-gradient(135deg,var(--purple-600),var(--blue-900))}
.result-hero .score-big{font-size:48px;font-weight:900}
.result-hero .score-label{font-size:14px;opacity:.8;margin-top:4px}
.result-hero .time-label{font-size:12px;opacity:.6;margin-top:4px}
.dot-grid{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:14px}
.dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff}
.dot.ok{background:var(--green-500)}
.dot.ng{background:var(--red-500)}
.dot.skip{background:var(--gray-400)}
.breakdown{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.breakdown-item{background:rgba(255,255,255,.1);border-radius:var(--radius-sm);padding:10px;text-align:center}
.breakdown-item .bd-label{font-size:10px;opacity:.7}
.breakdown-item .bd-score{font-size:16px;font-weight:800}
.bank-update{background:var(--green-50);border:1px solid var(--green-100);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:14px;font-size:12px;color:var(--green-700)}

.ri{background:#fff;border-radius:var(--radius-sm);margin-bottom:8px;box-shadow:var(--shadow-sm);border:1px solid var(--gray-100);overflow:hidden}
.ri-wrong{border-left:3px solid var(--red-500)}
.ri-right{border-left:3px solid var(--green-500)}
.ri-head{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.ri-head:hover{background:var(--gray-50)}
.ri-head span{font-size:13px;font-weight:600;color:var(--gray-700)}
.ri-head .tag{font-size:10px;padding:2px 6px;border-radius:10px;font-weight:600}
.ri-head .tag-ok{background:var(--green-50);color:var(--green-700)}
.ri-head .tag-ng{background:var(--red-50);color:var(--red-600)}
.ri-body{padding:0 14px 14px;border-top:1px solid var(--gray-100);display:none;font-size:13px;line-height:1.7}
.ri-body.show{display:block;padding-top:12px}
.ri-body .lbl{font-weight:700;color:var(--gray-500);font-size:11px;margin-top:8px;margin-bottom:2px}
.ri-body .your-ans{color:var(--red-600);font-weight:600}
.ri-body .correct-ans{color:var(--green-600);font-weight:600}

/* History */
.hi-group-title{font-size:12px;font-weight:700;color:var(--gray-400);letter-spacing:.5px;margin:16px 0 8px;padding-left:2px}
.hi-card{background:#fff;border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:8px;box-shadow:var(--shadow-sm);border:1px solid var(--gray-100);position:relative}
.hi-card.clickable{cursor:pointer}
.hi-card.clickable:hover{box-shadow:var(--shadow);border-color:var(--blue-200)}
.hi-card.full-paper{border-left:3px solid var(--purple-500)}
.hi-card .hi-date{font-size:11px;color:var(--gray-400)}
.hi-card .hi-title{font-size:13px;font-weight:700;color:var(--gray-700);margin:2px 0}
.hi-card .hi-score{font-size:12px;color:var(--blue-600);font-weight:600}
.hi-card .hi-mode{position:absolute;right:14px;top:14px}
.hi-card .hi-hint{font-size:10px;color:var(--blue-500);margin-top:4px}
.hi-card .hi-breakdown{font-size:10px;color:var(--gray-500);margin-top:4px}

.wb-card{background:#fff;border-radius:var(--radius-sm);padding:14px;margin-bottom:8px;box-shadow:var(--shadow-sm);border:1px solid var(--gray-100);border-left:3px solid var(--red-500)}
.wb-card .wb-stem{font-size:12px;color:var(--gray-700);line-height:1.5;margin-bottom:4px}
.wb-card .wb-answer{font-size:11px;color:var(--green-600);font-weight:600}
.wb-card .wb-meta{font-size:10px;color:var(--gray-400);margin-top:4px}

.empty-state{text-align:center;padding:50px 20px;color:var(--gray-400)}
.empty-state .ei{font-size:36px;margin-bottom:8px}
.empty-state p{font-size:13px}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--gray-800);color:#fff;padding:11px 22px;border-radius:24px;font-size:13px;font-weight:500;z-index:999;opacity:0;transition:all .3s ease;pointer-events:none;box-shadow:var(--shadow-lg)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.size-bar{height:6px;background:var(--gray-200);border-radius:3px;overflow:hidden;margin:8px 0}
.size-fill{height:100%;border-radius:3px;transition:width .3s}
.size-ok{background:var(--green-500)}
.size-warn{background:var(--amber-500)}
.size-danger{background:var(--red-500)}

.radio-group{margin:10px 0}
.radio-group label{display:block;padding:8px 12px;font-size:12px;cursor:pointer;border-radius:var(--radius-xs);transition:background .15s}
.radio-group label:hover{background:var(--gray-50)}
.radio-group input{margin-right:6px}

.mb-8{margin-bottom:8px}
.mb-12{margin-bottom:12px}
.mt-8{margin-top:8px}
.mt-12{margin-top:12px}
.mt-16{margin-top:16px}
.mt-20{margin-top:20px}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<div class="modal-overlay" id="modalOverlay">
<div class="modal-box">
<h3 id="modalTitle">確認</h3>
<p id="modalMsg">確定執行此操作？</p>
<div class="modal-btns">
<button class="btn btn-outline" id="modalCancel" onclick="closeModal()">取消</button>
<button class="btn btn-danger" id="modalConfirm">確定</button>
</div>
</div>
</div>

<script>
// ===== MODAL SYSTEM =====
let _modalCb=null;
function showModal(title,msg,confirmText,onConfirm){
document.getElementById('modalTitle').textContent=title;
document.getElementById('modalMsg').textContent=msg;
const btn=document.getElementById('modalConfirm');
btn.textContent=confirmText||'確定';
btn.onclick=function(){closeModal();if(onConfirm)onConfirm();};
document.getElementById('modalOverlay').classList.add('show');
}
function closeModal(){document.getElementById('modalOverlay').classList.remove('show');}

// ===== META =====
const PARTS_META=[
{id:1,name:"Part 1 — 閱讀理解",desc:"文章閱讀 + 片段閱讀",count:14,icon:"📖"},
{id:2,name:"Part 2 — 字詞辨識",desc:"錯別字 + 簡化字對應",count:8,icon:"✍️"},
{id:3,name:"Part 3 — 句子辨析",desc:"語病 + 邏輯錯誤",count:8,icon:"🔍"},
{id:4,name:"Part 4 — 詞句運用",desc:"填充 + 銜接 + 排序",count:15,icon:"📝"}
];
const FULL_PAPER_COUNT=45;

// ===== PASSAGE =====
const PASSAGE_BUILTIN=`隨着互聯網技術的發展和智能手機的普及，人們獲取資訊的方式已經產生了根本性的變化。在這個背景下，不少人開始質疑公共圖書館存在的必要性——既然幾乎所有資訊都能在網上找到，為什麼還需要實體的圖書館？\n\n事實上，這種疑問恰恰反映了人們對公共圖書館功能的狹隘理解。傳統上，圖書館確實以「藏書」和「借閱」為核心功能，但在數碼時代，其角色已經從單純的資訊提供者，轉變為社區學習和文化交流的樞紐。現代圖書館提供的服務早已超越書本借閱——從兒童故事時間、長者數碼素養課程，到創業者工作坊和社區對話活動，圖書館正在成為凝聚社區的公共空間。\n\n值得注意的是，數碼鴻溝問題並未因科技進步而消失。研究顯示，低收入家庭、長者及新來港人士在使用數碼設備和網上資源方面仍面對顯著困難。公共圖書館免費提供電腦設備、網絡連接及技術指導，在一定程度上縮窄了這道鴻溝。從這個角度看，圖書館的社會功能不僅沒有減退，反而在數碼時代變得更為重要。\n\n然而，我們也不能對圖書館的前景過於樂觀。經費不足、人手短缺、設施老化等問題長期困擾着不少公共圖書館。部分圖書館的藏書更新緩慢，難以跟上知識發展的步伐；加上開放時間有限，未能充分配合市民的生活節奏。若不能有效回應這些挑戰，圖書館被邊緣化的風險確實存在。\n\n歸根究底，公共圖書館的價值不在於它能否與互聯網競爭資訊量，而在於它能否提供一個平等、開放、有溫度的公共空間，讓不同背景的市民都能在此學習、交流和成長。這是任何數碼平台都無法完全取代的。`;

// ===== BUILT-IN QUESTIONS =====
const BUILTIN_QUESTIONS={

// ===== UTIL =====
function qKey(q){return(q.stem||'').substring(0,60)+'##'+(q.options?q.options[0]:'');}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2400);}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function uid(){return Date.now().toString(36)+Math.random().toString(36).substr(2,5);}
function byteSize(o){return new Blob([JSON.stringify(o)]).size;}
function fmtB(b){return b<1024?b+'B':(b/1024).toFixed(1)+'KB';}

// ===== TIMER =====
function timerStart(){
if(S._timerID)clearInterval(S._timerID);
S.timerOn=true;
S._timerID=setInterval(()=>{
S.timerSec++;
const el=document.getElementById('timerDisp');
if(el)el.textContent=fmt(S.timerSec);
},1000);
render();
}
function timerPause(){
S.timerOn=false;
if(S._timerID){clearInterval(S._timerID);S._timerID=null;}
render();
}
function timerReset(){
S.timerOn=false;
if(S._timerID){clearInterval(S._timerID);S._timerID=null;}
S.timerSec=0;
render();
}

function renderTabHistory(){

function hiCard(r){
const pn=r.isFullPaper?`全份試卷 #${r.paperNum||'?'}`:r.part===0?'混合重做':(PARTS_META.find(p=>p.id===r.part)?.name||'');
const pct=r.total?Math.round(r.correct/r.total*100):0;
const mBadge=r.isFullPaper?'badge-purple':r.mode==='normal'?'badge-blue':r.mode==='review'?'badge-amber':'badge-red';
const mLabel=r.isFullPaper?'全卷':r.mode==='normal'?'正常':r.mode==='review'?'重做':'撈亂';
const hasDetail=r.questions&&r.questions.length>0;
let bd='';
if(r.isFullPaper&&r.breakdown){
bd=`<div class="hi-breakdown">P1:${r.breakdown[1]||0} · P2:${r.breakdown[2]||0} · P3:${r.breakdown[3]||0} · P4:${r.breakdown[4]||0}</div>`;
}
return `<div class="hi-card ${hasDetail?'clickable':''} ${r.isFullPaper?'full-paper':''}" ${hasDetail?`onclick="viewRecord('${r.id}')"`:''}><div class="hi-date">${r.date}</div><div class="hi-title">${pn}</div><div class="hi-score">${r.correct}/${r.total} (${pct}%) · ${fmt(r.time)}</div>${bd}<span class="badge ${mBadge} hi-mode">${mLabel}</span>${hasDetail?'<div class="hi-hint">撳此查看詳情 →</div>':''}</div>`;
}

const pctF=Math.min(sizeF/limit*100,100);
let h=`<div class="section-title">存檔 / 讀檔</div>`;
h+=`<div class="info-box info-green"><h4>💾 存檔邏輯</h4><ul><li><b>精簡版</b>：錯題庫 + 記錄摘要（不含逐題詳情）</li><li><b>完整版</b>：+ 現有題庫 + 完整記錄（含逐題可回顧）</li></ul></div>`;
h+=`<div class="card"><h3>📊 存檔大小</h3>
<div style="margin-top:10px"><div style="display:flex;justify-content:space-between;font-size:12px"><span>精簡版</span><span style="font-weight:700">${fmtB(sizeC)}</span></div><div class="size-bar"><div class="size-fill ${pctC<60?'size-ok':pctC<85?'size-warn':'size-danger'}" style="width:${pctC}%"></div></div></div>
<div style="margin-top:8px"><div style="display:flex;justify-content:space-between;font-size:12px"><span>完整版</span><span style="font-weight:700">${fmtB(sizeF)}</span></div><div class="size-bar"><div class="size-fill ${pctF<60?'size-ok':pctF<85?'size-warn':'size-danger'}" style="width:${pctF}%"></div></div></div></div>`;
h+=`<div class="card"><h3>📤 導出存檔</h3>
<div class="radio-group"><label><input type="radio" name="saveMode" value="compact" checked> 精簡版 — ${fmtB(sizeC)}</label><label><input type="radio" name="saveMode" value="full"> 完整版 — ${fmtB(sizeF)}</label></div>
<button class="btn btn-green mt-8" onclick="doExport()">導出（複製到剪貼板）</button><textarea class="textarea textarea-sm mt-8" id="exportArea" readonly></textarea></div>`;
h+=`<div class="card"><h3 style="color:var(--red-600)">📥 讀檔</h3><textarea class="textarea textarea-md mt-12" id="loadArea" placeholder="Paste存檔JSON..." spellcheck="false"></textarea><button class="btn btn-danger mt-12" onclick="doLoad()">讀檔還原</button><div id="loadMsg" style="margin-top:8px;font-size:12px;padding:8px;border-radius:6px;display:none"></div></div>`;
return h;
}

// ===== DETAIL PAGE =====
function renderDetail(app){
const r=quizHistory.find(x=>x.id===S.viewingRecord);
if(!r||!r.questions){S.page='home';S.tab='history';render();return;}
const pn=r.isFullPaper?`全份試卷 #${r.paperNum||'?'}`:r.part===0?'混合重做':(PARTS_META.find(p=>p.id===r.part)?.name||'');
const pct=r.total?Math.round(r.correct/r.total*100):0;
let h=`<div class="header"><button class="back-btn" onclick="S.page='home';S.tab='history';render();">←</button><h1>記錄詳情</h1></div><div class="container">`;
h+=`<div class="result-hero ${r.isFullPaper?'full-paper':''}"><div class="score-big">${r.correct}/${r.total}</div><div class="score-label">${pn} · ${pct}%</div><div class="time-label">${r.date} · ${fmt(r.time)}</div>`;
if(r.isFullPaper&&r.breakdown){
h+=`<div class="breakdown">`;
PARTS_META.forEach(p=>{h+=`<div class="breakdown-item"><div class="bd-label">P${p.id}</div><div class="bd-score">${r.breakdown[p.id]||0}/${p.count}</div></div>`;});
h+=`</div>`;
}
h+=`<div class="dot-grid">`;
r.questions.forEach((q,i)=>{
const ua=r.answers?r.answers[String(i)]:undefined;
const ok=ua===q.answer;
h+=`<div class="dot ${ua!==undefined?(ok?'ok':'ng'):'skip'}">${i+1}</div>`;
});
h+=`</div></div><div class="section-title">逐題檢視</div>`;
let lastPart=0;
r.questions.forEach((q,i)=>{
if(r.isFullPaper&&q._part&&q._part!==lastPart){
lastPart=q._part;
const pm=PARTS_META.find(p=>p.id===q._part);
h+=`<div class="part-divider"><h4>${pm?pm.icon:''} ${pm?pm.name:'Part '+q._part}</h4></div>`;
}
const ua=r.answers?r.answers[String(i)]:undefined;
const ok=ua===q.answer;
h+=reviewItem(q,i,ua,ok);
});
h+=`<button class="btn btn-primary mt-20" onclick="S.page='home';S.tab='history';render();">← 返回記錄</button></div>`;
app.innerHTML=h;
}

function reviewItem(q,i,ua,ok){
let h=`<div class="ri ${ok?'ri-right':'ri-wrong'}"><div class="ri-head" onclick="toggleRI(${i})"><span>${ok?'✓':'✗'} 第${i+1}題</span><span class="tag ${ok?'tag-ok':'tag-ng'}">${ok?'正確':'錯誤'}</span></div><div class="ri-body" id="rb-${i}">`;
h+=`<div class="lbl">題目</div><div style="margin-bottom:6px">${esc(q.stem).replace(/\n/g,'<br>')}</div><div class="lbl">選項</div>`;
(q.options||[]).forEach((opt,j)=>{
let s='';
if(j===q.answer)s='color:var(--green-600);font-weight:600';
else if(j===ua&&!ok)s='color:var(--red-600);text-decoration:line-through';
h+=`<div style="${s}">${'ABCD'[j]}. ${esc(opt)}</div>`;
});
if(!ok&&ua!==undefined)h+=`<div class="lbl">你的答案</div><div class="your-ans">${'ABCD'[ua]}</div>`;
h+=`<div class="lbl">正確答案</div><div class="correct-ans">${'ABCD'[q.answer]}</div>`;
if(q.explanation)h+=`<div class="lbl">解釋</div><div>${esc(q.explanation)}</div>`;
h+=`</div></div>`;
return h;
}

// ===== QUIZ PAGE =====
function renderQuiz(app){
const qs=S.quizQs;
if(!qs||!qs[S.currentQ]){goHome();return;}
const q=qs[S.currentQ];
const headerTitle=S.isFullPaper?'全份試卷':(PARTS_META.find(p=>p.id===S.currentPart)?.name||'混合');
const mLabel=S.quizMode==='review'?' （重做）':S.quizMode==='shuffle'?' （撈亂）':'';
let h=`<div class="header"><button class="back-btn" onclick="confirmExit()">←</button><h1>${headerTitle}${mLabel}</h1></div><div class="container">`;
h+=`<div class="quiz-bar"><span class="progress-text">第 ${S.currentQ+1} / ${qs.length} 題</span><span class="timer-display" id="timerDisp">${fmt(S.timerSec)}</span></div>`;
h+=`<div class="timer-row">`;
if(!S.timerOn) h+=`<button class="timer-btn timer-btn-start" onclick="timerStart()">▶ ${S.timerSec>0?'繼續':'開始'}</button>`;
else h+=`<button class="timer-btn timer-btn-pause" onclick="timerPause()">⏸ 暫停</button>`;
if(S.timerSec>0) h+=`<button class="timer-btn timer-btn-reset" onclick="timerReset()">↺ 重置</button>`;
h+=`</div>`;
if(S.isFullPaper&&q._part){
const prevQ=S.currentQ>0?qs[S.currentQ-1]:null;
if(!prevQ||prevQ._part!==q._part){
const pm=PARTS_META.find(p=>p.id===q._part);
h+=`<div class="part-divider"><h4>${pm?pm.icon:''} ${pm?pm.name:'Part '+q._part}</h4></div>`;
}
}
const showPassage=q.passage&&q._part===1&&currentPassage;
if(showPassage){
h+=`<button class="passage-toggle" onclick="S.passageOpen=!S.passageOpen;render();">📄 ${S.passageOpen?'收起':'展開'}文章</button>`;
if(S.passageOpen) h+=`<div class="passage-content">${currentPassage.replace(/\n/g,'<br>')}</div>`;
}
h+=`<div class="q-card"><div class="q-stem">${esc(q.stem).replace(/\n/g,'<br>')}</div>`;
q.options.forEach((opt,i)=>{
const sel=S.answers[S.currentQ]===i?'selected':'';
h+=`<button class="opt-btn ${sel}" onclick="pickOpt(${i})">${'ABCD'[i]}. ${esc(opt)}</button>`;
});
h+=`</div><div class="nav-row">`;
if(S.currentQ>0)h+=`<button class="btn btn-outline" onclick="S.currentQ--;render();window.scrollTo(0,0);">← 上一題</button>`;
else h+=`<div></div>`;
if(S.currentQ===qs.length-1) h+=`<button class="btn btn-danger" onclick="submitQuiz()">交卷</button>`;
else h+=`<button class="btn btn-primary" onclick="S.currentQ++;render();window.scrollTo(0,0);">下一題 →</button>`;
h+=`</div></div>`;
app.innerHTML=h;
}

// ===== RESULT PAGE =====
function renderResult(app){
const qs=S.quizQs;
let correct=0;qs.forEach((q,i)=>{if(S.answers[i]===q.answer)correct++;});
const pct=qs.length?Math.round(correct/qs.length*100):0;
const headerTitle=S.isFullPaper?'全份試卷成績':(PARTS_META.find(p=>p.id===S.currentPart)?.name||'混合')+' 成績';
let h=`<div class="header"><h1>${headerTitle}</h1></div><div class="container">`;
h+=`<div class="result-hero ${S.isFullPaper?'full-paper':''}"><div class="score-big">${correct}/${qs.length}</div><div class="score-label">${pct}%</div><div class="time-label">用時 ${fmt(S.timerSec)}</div>`;
if(S.isFullPaper){
const bd=getBreakdown();
h+=`<div class="breakdown">`;
PARTS_META.forEach(p=>{h+=`<div class="breakdown-item"><div class="bd-label">P${p.id}</div><div class="bd-score">${bd[p.id]||0}/${bd['t'+p.id]||0}</div></div>`;});
h+=`</div>`;
}
h+=`<div class="dot-grid">`;
qs.forEach((q,i)=>{
const a=S.answers[i];const ok=a===q.answer;
h+=`<div class="dot ${a!==undefined?(ok?'ok':'ng'):'skip'}">${i+1}</div>`;
});
h+=`</div></div>`;
if(S._bankUpdate){const bu=S._bankUpdate;h+=`<div class="bank-update">✅ 錯題庫更新：+${bu.added}新 · ${bu.removed}掌握 · 現存${bu.total}題</div>`;}
const wrongCount=qs.filter((q,i)=>S.answers[i]!==q.answer&&S.answers[i]!==undefined).length;
if(wrongCount>0){
h+=`<button class="btn btn-danger mb-12" onclick="copyAllWrong()">📋 複製全部錯題（${wrongCount}題）</button>`;
}
h+=`<div class="section-title">逐題溫習</div>`;
let lastPart=0;
qs.forEach((q,i)=>{
if(S.isFullPaper&&q._part&&q._part!==lastPart){
lastPart=q._part;
const pm=PARTS_META.find(p=>p.id===q._part);
h+=`<div class="part-divider"><h4>${pm?pm.icon:''} ${pm?pm.name:''}</h4></div>`;
}
const ua=S.answers[i];const ok=ua===q.answer;
h+=reviewItem(q,i,ua,ok);
});
h+=`<button class="btn btn-primary mt-20" onclick="goHome()">返回主頁</button></div>`;
app.innerHTML=h;
}
function getBreakdown(){
const qs=S.quizQs;const bd={};
PARTS_META.forEach(p=>{bd[p.id]=0;bd['t'+p.id]=0;});
qs.forEach((q,i)=>{
const pid=q._part||1;
if(bd['t'+pid]!==undefined)bd['t'+pid]++;
if(S.answers[i]===q.answer&&bd[pid]!==undefined)bd[pid]++;
});
return bd;
}

// ===== ACTIONS =====
function setTab(t){S.tab=t;render();}
function goHome(){
if(S._timerID){clearInterval(S._timerID);S._timerID=null;}
S.timerOn=false;S.page='home';render();
}
function confirmExit(){showModal('離開測驗','確定離開？進度不會保存。','離開',goHome);}
function pickOpt(i){S.answers[S.currentQ]=i;render();}
function toggleRI(i){const el=document.getElementById('rb-'+i);if(el)el.classList.toggle('show');}
function viewRecord(id){S.viewingRecord=id;S.page='detail';render();window.scrollTo(0,0);}

// ===== START QUIZ =====
function startQuiz(pid,mode){
let qs;
if(mode==='normal'){
if(!currentQuestions[pid]||!currentQuestions[pid].length){toast('冇題目');return;}
qs=JSON.parse(JSON.stringify(currentQuestions[pid]));
qs.forEach(q=>q._part=pid);
}else if(mode==='review'){
if(!wrongBank[pid]||!wrongBank[pid].length){toast('冇錯題');return;}
qs=JSON.parse(JSON.stringify(wrongBank[pid]));
qs.forEach(q=>q._part=pid);
}else{
let all=[];
Object.keys(wrongBank).forEach(k=>{wrongBank[k].forEach(q=>{all.push({...JSON.parse(JSON.stringify(q)),_part:parseInt(k)});});});
if(!all.length){toast('冇錯題');return;}
for(let i=all.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[all[i],all[j]]=[all[j],all[i]];}
qs=all;
}
S.page='quiz';S.currentPart=pid;S.currentQ=0;S.answers={};
S.timerSec=0;S.timerOn=false;S.isFullPaper=false;
if(S._timerID){clearInterval(S._timerID);S._timerID=null;}
S.passageOpen=true;S.quizMode=mode;S.quizQs=qs;S._bankUpdate=null;
render();
}
function startFullPaper(){
let qs=[];
for(let i=1;i<=4;i++){
const partQs=JSON.parse(JSON.stringify(currentQuestions[i]||[]));
partQs.forEach(q=>q._part=i);
qs=qs.concat(partQs);
}
if(!qs.length){toast('冇題目');return;}
S.page='quiz';S.currentPart=0;S.currentQ=0;S.answers={};
S.timerSec=0;S.timerOn=false;S.isFullPaper=true;
if(S._timerID){clearInterval(S._timerID);S._timerID=null;}
S.passageOpen=true;S.quizMode='normal';S.quizQs=qs;S._bankUpdate=null;
render();
}

// ===== SUBMIT =====
function submitQuiz(){
if(S._timerID){clearInterval(S._timerID);S._timerID=null;}
S.timerOn=false;
const qs=S.quizQs;
let correct=0,added=0,removed=0;
const breakdown={};PARTS_META.forEach(p=>{breakdown[p.id]=0;});
qs.forEach((q,i)=>{
const pid=q._part||S.currentPart||1;
if(pid<1||pid>4)return;
const key=qKey(q);
const bIdx=wrongBank[pid].findIndex(e=>qKey(e)===key);
if(S.answers[i]===q.answer){
correct++;
if(breakdown[pid]!==undefined)breakdown[pid]++;
if(bIdx>=0){wrongBank[pid].splice(bIdx,1);removed++;}
}else{
if(S.answers[i]!==undefined){
if(bIdx<0){
wrongBank[pid].push({stem:q.stem,options:q.options,answer:q.answer,explanation:q.explanation||'',passage:q.passage||false,dateAdded:today(),reviewCount:1,_part:pid});
added++;
}else{wrongBank[pid][bIdx].reviewCount=(wrongBank[pid][bIdx].reviewCount||0)+1;}
}
}
});
paperCount++;
const record={
id:uid(),date:today(),part:S.currentPart||0,mode:S.quizMode,
total:qs.length,correct,time:S.timerSec,isFullPaper:S.isFullPaper,
paperNum:S.isFullPaper?paperCount:undefined,
breakdown:S.isFullPaper?breakdown:undefined,
questions:qs.map(q=>({stem:q.stem,options:q.options,answer:q.answer,explanation:q.explanation||'',_part:q._part})),
answers:{...S.answers}
};
quizHistory.push(record);
const tw=Object.values(wrongBank).reduce((s,a)=>s+a.length,0);
S._bankUpdate={added,removed,total:tw};
S.page='result';render();window.scrollTo(0,0);
toast(`+${added}入錯題庫 · ${removed}已掌握`);
}

// Copy all wrong
function copyAllWrong(){
const qs=S.quizQs;
let txt='=== 錯題記錄 ===\n';
txt+=`日期：${today()} · ${S.isFullPaper?'全份試卷':'Part '+(S.currentPart||'?')}\n\n`;
let n=0;
qs.forEach((q,i)=>{
if(S.answers[i]===undefined||S.answers[i]===q.answer)return;
n++;
txt+=`【第${i+1}題】${q._part?'(Part '+q._part+')':''}\n`;
txt+=`題目：${q.stem}\n`;
q.options.forEach((o,j)=>{txt+=`  ${'ABCD'[j]}. ${o}\n`;});
txt+=`你的答案：${'ABCD'[S.answers[i]]}\n`;
txt+=`正確答案：${'ABCD'[q.answer]}\n`;
if(q.explanation)txt+=`解釋：${q.explanation}\n`;
txt+=`${'─'.repeat(30)}\n\n`;
});
copyTxt(txt,`已複製${n}題錯題！`);
}

// ===== IMPORT =====
function doImport(){
const area=document.getElementById('importArea');
const msg=document.getElementById('importMsg');
if(!area)return;
let raw=area.value.trim();
if(!raw){showMsg(msg,'請先paste JSON。','red');return;}
const cm=raw.match(/```(?:json)?\s*([\s\S]*?)```/);if(cm)raw=cm[1].trim();
let data;
try{data=JSON.parse(raw);}catch(e){showMsg(msg,'JSON格式錯誤：'+e.message,'red');return;}
if(data.fullPaper&&data.parts){
let totalImported=0;
let errors=[];
for(let pid=1;pid<=4;pid++){
const pqs=data.parts[String(pid)];
if(!pqs||!Array.isArray(pqs)){errors.push(`Part ${pid}缺少`);continue;}
let valid=true;pqs.forEach(q=>{if(!q.stem||!q.options||q.options.length!==4||q.answer===undefined)valid=false;});
if(!valid){errors.push(`Part ${pid}格式有問題`);continue;}
pqs.forEach(q=>q._part=pid);
currentQuestions[pid]=pqs;
importedSets[pid]=(importedSets[pid]||0)+1;
totalImported+=pqs.length;
}
if(data.passage)currentPassage=data.passage;
importedSets.full=(importedSets.full||0)+1;
if(errors.length){showMsg(msg,`⚠️ 部分成功：匯入${totalImported}題。問題：${errors.join('、')}`,'red');}
else{showMsg(msg,`✓ 全份卷匯入成功！共${totalImported}題（4個Part全部更新）`,'green');}
area.value='';toast('全份卷匯入成功！');render();return;
}
if(!data.part||!data.questions||!Array.isArray(data.questions)){showMsg(msg,'需要 "part"(1-4) + "questions"，或 "fullPaper":true + "parts"。','red');return;}
const pid=data.part;
if(pid<1||pid>4){showMsg(msg,'part必須1-4。','red');return;}
let valid=true;data.questions.forEach(q=>{if(!q.stem||!q.options||q.options.length!==4||q.answer===undefined)valid=false;});
if(!valid){showMsg(msg,'題目格式有問題。','red');return;}
data.questions.forEach(q=>q._part=pid);
currentQuestions[pid]=data.questions;
if(data.passage)currentPassage=data.passage;
importedSets[pid]=(importedSets[pid]||0)+1;
showMsg(msg,`✓ 成功匯入 Part ${pid}，共 ${data.questions.length} 題！`,'green');
area.value='';toast('匯入成功！');
}
function showMsg(el,txt,color){
if(!el)return;
el.style.display='block';
el.style.background=color==='red'?'var(--red-50)':'var(--green-50)';
el.style.color=color==='red'?'var(--red-700)':'var(--green-700)';
el.textContent=txt;
}

// ===== SAVE/LOAD =====
function buildSave(mode){
if(mode==='compact'){
const historySummary=quizHistory.map(r=>({id:r.id,date:r.date,part:r.part,mode:r.mode,total:r.total,correct:r.correct,time:r.time,isFullPaper:r.isFullPaper,paperNum:r.paperNum,breakdown:r.breakdown}));
return{version:'7.3',exportDate:today(),wrongBank,history:historySummary,importedSets,paperCount};
}else{
return{version:'7.3',exportDate:today(),wrongBank,history:quizHistory,importedSets,paperCount,currentQuestions,currentPassage};
}
}
function doExport(){
const radios=document.querySelectorAll('input[name="saveMode"]');
let mode='compact';radios.forEach(r=>{if(r.checked)mode=r.value;});
const data=buildSave(mode);
const json=JSON.stringify(data);
const area=document.getElementById('exportArea');
if(area)area.value=json;
copyTxt(json,`${mode==='full'?'完整版':'精簡版'}存檔已複製！`);
}
function doLoad(){
const area=document.getElementById('loadArea');
const msg=document.getElementById('loadMsg');
if(!area)return;
let raw=area.value.trim();
if(!raw){showMsg(msg,'請paste存檔。','red');return;}
let data;
try{data=JSON.parse(raw);}catch(e){showMsg(msg,'JSON錯誤：'+e.message,'red');return;}
if(!data.wrongBank&&!data.history){showMsg(msg,'唔似有效存檔。','red');return;}
if(data.wrongBank)wrongBank=data.wrongBank;
if(data.history)quizHistory=data.history;
if(data.currentQuestions)currentQuestions=data.currentQuestions;
if(data.currentPassage)currentPassage=data.currentPassage;
if(data.importedSets)importedSets=data.importedSets;
if(data.paperCount)paperCount=data.paperCount;
const tw=Object.values(wrongBank).reduce((s,a)=>s+a.length,0);
const hasDetail=quizHistory.some(r=>r.questions&&r.questions.length>0);
showMsg(msg,`✓ 還原成功！錯題${tw}題 · 歷史${quizHistory.length}條${hasDetail?' · 含逐題詳情':''}`,'green');
area.value='';toast('讀檔成功！');
setTimeout(render,500);
}

// ===== COPY =====
function copyTxt(t,m){
if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>toast(m||'已複製')).catch(()=>fbCopy(t,m));
else fbCopy(t,m);
}
function fbCopy(t,m){const ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);toast(m||'已複製');}

// ===== INIT =====
render();
</script>
