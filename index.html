<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0">
<title>CRE中文運用 — 練習系統 v9.3</title>
<style>
:root{
--pri:#2563eb;--pri-d:#1d4ed8;--pri-dd:#1e40af;--pri-bg:#eff6ff;--pri-l:#dbeafe;--pri-b:#bfdbfe;
--suc:#16a34a;--suc-bg:#f0fdf4;--suc-l:#dcfce7;
--err:#dc2626;--err-bg:#fef2f2;--err-l:#fee2e2;
--wrn:#d97706;--wrn-bg:#fffbeb;--wrn-l:#fef3c7;
--pur:#7c3aed;--pur-bg:#faf5ff;--pur-l:#ede9fe;
--teal:#0d9488;--teal-bg:#f0fdfa;--teal-l:#ccfbf1;
--g50:#f9fafb;--g100:#f3f4f6;--g200:#e5e7eb;--g300:#d1d5db;--g400:#9ca3af;--g500:#6b7280;--g600:#4b5563;--g700:#374151;--g800:#1f2937;--g900:#111827;
--r:12px;--rs:8px;--rx:6px;
--sh:0 1px 3px rgba(0,0,0,.08);--shm:0 4px 6px rgba(0,0,0,.1);--shl:0 10px 15px rgba(0,0,0,.1);
--ease:cubic-bezier(.4,0,.2,1);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;background:var(--g50);color:var(--g800);line-height:1.6;-webkit-font-smoothing:antialiased}
.container{max-width:480px;margin:0 auto;padding:16px;padding-bottom:80px}
@media(min-width:768px){.container{max-width:680px;padding:20px 24px 80px}}
@media(min-width:1024px){.container{max-width:780px;padding:24px 32px 80px}}
.header{background:linear-gradient(135deg,var(--pri-dd),#1e3a8a);color:#fff;padding:16px 20px;text-align:center;position:sticky;top:0;z-index:100;box-shadow:var(--shl)}
.header h1{font-size:15px;font-weight:700;letter-spacing:.3px}
.header .ver{font-size:10px;opacity:.5;margin-top:1px}
.back-btn{position:absolute;left:12px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.15);border:none;color:#fff;font-size:18px;cursor:pointer;padding:6px 10px;border-radius:var(--rs);transition:.2s}
.back-btn:hover{background:rgba(255,255,255,.25)}
.tab-bar{display:flex;gap:2px;margin:14px 0;background:var(--g100);padding:4px;border-radius:var(--r);overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab-btn{flex:0 0 auto;min-width:42px;padding:9px 8px;border:none;border-radius:var(--rs);background:transparent;color:var(--g500);font-size:11px;font-weight:600;cursor:pointer;text-align:center;transition:.2s;white-space:nowrap}
.tab-btn.active{background:#fff;color:var(--pri);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.card{background:#fff;border-radius:var(--r);padding:16px;margin-bottom:10px;box-shadow:var(--sh);border:1px solid var(--g100)}
.stat-row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-bottom:14px}
@media(max-width:400px){.stat-row{grid-template-columns:1fr 1fr;gap:6px}}
.stat-card{background:#fff;border-radius:var(--r);padding:12px 6px;text-align:center;box-shadow:var(--sh);border:1px solid var(--g100)}
.stat-num{font-size:22px;font-weight:800;color:var(--pri)}
.stat-num.wrn{color:var(--wrn)}
.stat-num.err{color:var(--err)}
.stat-num.teal{color:var(--teal)}
.stat-lbl{font-size:10px;color:var(--g400);margin-top:2px;font-weight:500}
.sec-title{font-size:13px;font-weight:700;color:var(--g600);margin:18px 0 8px;display:flex;align-items:center;gap:6px}
.sec-title::before{content:'';width:3px;height:14px;background:var(--pri);border-radius:2px}
.sec-title .rt{margin-left:auto;font-size:11px;color:var(--g400);font-weight:500}
.part-card{background:#fff;border-radius:var(--r);padding:16px;margin-bottom:8px;box-shadow:var(--sh);border:1px solid var(--g100);cursor:pointer;transition:all .15s var(--ease);position:relative;overflow:hidden;border-left:4px solid var(--pri)}
.part-card:hover{box-shadow:var(--shm);transform:translateY(-1px)}
.part-card:active{transform:scale(.98)}
.part-card.fp{border-left-color:var(--pur);border-color:var(--pur-l)}
.part-card h3{font-size:13px;color:var(--g800);font-weight:700;padding-left:4px}
.part-card.fp h3{color:var(--pur)}
.part-card p{font-size:11px;color:var(--g400);margin-top:2px;padding-left:4px}
.part-card .arrow{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--g300);font-size:16px}
.btn{width:100%;padding:12px;border:none;border-radius:var(--rs);font-size:14px;font-weight:700;cursor:pointer;transition:.15s var(--ease);display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-p{background:var(--pri);color:#fff}.btn-p:hover:not(:disabled){background:var(--pri-d)}
.btn-e{background:var(--err);color:#fff}.btn-s{background:var(--suc);color:#fff}
.btn-pur{background:var(--pur);color:#fff}
.btn-wrn{background:var(--wrn);color:#fff}
.btn-teal{background:var(--teal);color:#fff}
.btn-o{background:#fff;color:var(--pri);border:2px solid var(--pri-l)}
.btn-g{background:var(--g100);color:var(--g600)}
.btn-cloud{background:linear-gradient(135deg,#4285f4,#34a853);color:#fff}
.btn-sm{padding:7px 12px;font-size:12px;width:auto;min-height:32px;border-radius:var(--rx)}
.info-box{border-radius:var(--rs);padding:12px 14px;margin-bottom:12px;font-size:12px;line-height:1.7}
.info-box h4{font-size:12px;margin-bottom:3px}
.info-box ol,.info-box ul{padding-left:16px}
.ib-b{background:var(--pri-bg);border:1px solid var(--pri-l);color:var(--pri-dd)}
.ib-w{background:var(--wrn-bg);border:1px solid var(--wrn-l);color:#92400e}
.ib-g{background:var(--suc-bg);border:1px solid var(--suc-l);color:var(--suc)}
.ib-r{background:var(--err-bg);border:1px solid var(--err-l);color:var(--err)}
.ib-p{background:var(--pur-bg);border:1px solid var(--pur-l);color:var(--pur)}
.ib-t{background:var(--teal-bg);border:1px solid var(--teal-l);color:var(--teal)}
.textarea{width:100%;border:2px solid var(--g200);border-radius:var(--rs);padding:10px;font-size:12px;font-family:'SF Mono',monospace;resize:vertical;transition:border-color .2s;line-height:1.5;min-height:80px}
.textarea:focus{border-color:var(--pri);outline:none}
.textarea-xl{min-height:300px;max-height:none}
.prompt-box{background:var(--g50);border:1px solid var(--g200);border-radius:var(--rs);padding:10px;font-size:11px;max-height:200px;overflow-y:auto;white-space:pre-wrap;line-height:1.5;font-family:monospace;margin-bottom:8px}
.quiz-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 0}
.timer-area{display:flex;align-items:center;gap:5px}
.timer-n{font-size:20px;font-weight:800;color:var(--pri);font-variant-numeric:tabular-nums}
.timer-btn{padding:4px 8px;border-radius:var(--rx);border:none;font-size:11px;font-weight:600;cursor:pointer}
.tb-go{background:var(--suc-l);color:var(--suc)}.tb-pa{background:var(--wrn-l);color:var(--wrn)}.tb-re{background:var(--g100);color:var(--g500)}
.qmap{display:flex;flex-wrap:wrap;gap:4px;padding:10px;background:var(--g50);border-radius:var(--rs);margin-bottom:12px;border:1px solid var(--g200)}
.qmap-dot{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;cursor:pointer;border:2px solid var(--g200);background:#fff;color:var(--g500);transition:.15s}
.qmap-dot:hover{border-color:var(--pri)}
.qmap-dot.cur{border-color:var(--pri);background:var(--pri-bg);color:var(--pri)}
.qmap-dot.done{border-color:var(--suc);background:var(--suc-l);color:var(--suc)}
.qmap-dot.flag{border-color:var(--wrn);background:var(--wrn-l);color:var(--wrn)}
.qmap-toggle{width:100%;background:var(--g50);border:1px solid var(--g200);border-radius:var(--rs);padding:8px;text-align:center;font-size:11px;color:var(--g500);cursor:pointer;margin-bottom:10px;font-weight:600}
.part-div{background:linear-gradient(135deg,var(--pri-bg),var(--pur-bg));border:1px solid var(--pri-l);border-radius:var(--r);padding:12px;margin-bottom:12px;text-align:center}
.part-div h4{font-size:13px;font-weight:700;color:var(--pri-d)}
.psg-toggle{width:100%;background:var(--pri-bg);border:1px solid var(--pri-l);border-radius:var(--rs);padding:10px 14px;text-align:left;font-size:12px;color:var(--pri);cursor:pointer;font-weight:600;margin-bottom:10px}
.psg-box{background:var(--g50);border:1px solid var(--g200);border-radius:var(--rs);padding:14px;margin-bottom:14px;font-size:14px;line-height:2;max-height:240px;overflow-y:auto}
.q-card{background:#fff;border-radius:var(--r);padding:18px;box-shadow:var(--sh);border:1px solid var(--g100);margin-bottom:12px}
.q-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.q-stem{font-size:15px;font-weight:600;line-height:1.8;color:var(--g800);white-space:pre-wrap}
.flag-btn{padding:6px 10px;border-radius:var(--rx);border:1.5px solid var(--g200);background:#fff;cursor:pointer;font-size:14px;transition:.15s}
.flag-btn.on{border-color:var(--wrn);background:var(--wrn-l)}
.opt-btn{width:100%;min-height:44px;padding:12px 14px;margin-top:8px;border:2px solid var(--g200);border-radius:var(--rs);background:#fff;font-size:14px;text-align:left;cursor:pointer;transition:.15s;line-height:1.5;display:flex;align-items:center}
.opt-btn:hover{border-color:var(--pri-b);background:var(--pri-bg)}
.opt-btn.sel{border-color:var(--pri);background:var(--pri-l);font-weight:600}
.nav-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.result-hero{background:linear-gradient(135deg,var(--pri),#1e3a8a);border-radius:var(--r);padding:24px 18px;text-align:center;color:#fff;margin-bottom:14px;box-shadow:var(--shl)}
.result-hero.fp{background:linear-gradient(135deg,var(--pur),#1e3a8a)}
.result-hero .big{font-size:44px;font-weight:900}
.result-hero .pct{font-size:14px;opacity:.8;margin-top:2px}
.result-hero .tm{font-size:12px;opacity:.6;margin-top:4px}
.dots{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin:12px 0}
.dot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff}
.dot.ok{background:var(--suc)}.dot.ng{background:var(--err)}.dot.sk{background:var(--g400)}
.bd{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.bd-i{background:rgba(255,255,255,.12);border-radius:var(--rs);padding:8px;text-align:center}
.bd-i .bl{font-size:9px;opacity:.7}.bd-i .bs{font-size:15px;font-weight:800}
.bank-msg{background:var(--suc-bg);border:1px solid var(--suc-l);border-radius:var(--rs);padding:10px 12px;margin-bottom:12px;font-size:12px;color:var(--suc)}
.ri{background:#fff;border-radius:var(--rs);margin-bottom:6px;border:1px solid var(--g100);overflow:hidden}
.ri.rw{border-left:3px solid var(--err)}.ri.rr{border-left:3px solid var(--suc)}.ri.ru{border-left:3px solid var(--wrn)}
.ri-h{padding:10px 12px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-size:12px;font-weight:600}
.ri-h:hover{background:var(--g50)}
.ri-tag{font-size:10px;padding:2px 6px;border-radius:8px;font-weight:600}
.ri-tag-r{background:var(--err-l);color:var(--err)}
.ri-tag-g{background:var(--suc-l);color:var(--suc)}
.ri-tag-w{background:var(--wrn-l);color:var(--wrn)}
.ri-tag-p{background:var(--pur-l);color:var(--pur)}
.ri-b{padding:0 12px 12px;border-top:1px solid var(--g100);display:none;font-size:13px;line-height:1.7}
.ri-b.show{display:block;padding-top:10px}
.ri-b .lbl{font-weight:700;color:var(--g500);font-size:11px;margin-top:6px;margin-bottom:2px}
.ri-b .opt-line{padding:2px 0}
.ri-b .opt-correct{color:var(--suc);font-weight:600}
.ri-b .opt-wrong{color:var(--err);text-decoration:line-through}
.ri-del{background:none;border:none;color:var(--g400);font-size:14px;cursor:pointer;padding:4px;margin-left:8px}
.ri-del:hover{color:var(--err)}
.psg-in-bank{background:var(--g50);border:1px solid var(--g200);border-radius:var(--rx);padding:10px;margin-top:6px;font-size:12px;line-height:1.8;max-height:150px;overflow-y:auto;white-space:pre-wrap}
.hi-card{background:#fff;border-radius:var(--rs);padding:12px 14px;margin-bottom:6px;box-shadow:0 1px 2px rgba(0,0,0,.04);border:1px solid var(--g100);cursor:pointer;transition:.15s}
.hi-card:hover{border-color:var(--pri-l);box-shadow:var(--sh)}
.hi-card.fp{border-left:3px solid var(--pur)}
.hi-card .hd{font-size:11px;color:var(--g400)}.hi-card .ht{font-size:13px;font-weight:700;margin:2px 0}.hi-card .hs{font-size:12px;color:var(--pri);font-weight:600}
.grp-title{font-size:11px;font-weight:700;color:var(--g400);letter-spacing:.5px;margin:14px 0 6px}
.empty{text-align:center;padding:40px 16px;color:var(--g400);font-size:13px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--g800);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:500;z-index:999;opacity:0;transition:.3s var(--ease);pointer-events:none;box-shadow:var(--shl)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:.2s}
.modal-ov.show{opacity:1;pointer-events:auto}
.modal-bx{background:#fff;border-radius:var(--r);padding:24px;max-width:400px;width:100%;box-shadow:var(--shl);text-align:center;max-height:90vh;overflow-y:auto}
.modal-bx h3{font-size:16px;margin-bottom:6px}.modal-bx p{font-size:13px;color:var(--g500);margin-bottom:16px;white-space:pre-wrap}
.modal-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modal-btns .btn{font-size:13px;padding:10px}
.sub-tabs{display:flex;gap:2px;background:var(--g100);padding:3px;border-radius:var(--rs);margin-bottom:12px}
.sub-tab{flex:1;padding:7px 4px;border:none;border-radius:var(--rx);background:transparent;color:var(--g500);font-size:11px;font-weight:600;cursor:pointer;text-align:center}
.sub-tab.on{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.sub-tab.on.err-tab{color:var(--err)}
.sub-tab.on.unc-tab{color:var(--wrn)}
.save-info{background:var(--g50);border:1px solid var(--g200);border-radius:var(--rs);padding:10px 12px;font-size:11px;line-height:1.7;color:var(--g600);margin:8px 0}
.save-info strong{color:var(--g800)}
.cloud-status{padding:10px 14px;border-radius:var(--rs);font-size:12px;margin:10px 0;display:none}
.cloud-status.show{display:block}
.cloud-status.ok{background:var(--suc-bg);border:1px solid var(--suc-l);color:var(--suc)}
.cloud-status.err{background:var(--err-bg);border:1px solid var(--err-l);color:var(--err)}
.cloud-status.loading{background:var(--wrn-bg);border:1px solid var(--wrn-l);color:var(--wrn)}
.paper-card{background:#fff;border:1px solid var(--g200);border-radius:var(--rs);padding:14px;margin-bottom:8px;cursor:pointer;transition:.15s;border-left:4px solid var(--pur)}
.paper-card:hover{box-shadow:var(--shm);border-color:var(--pur-l)}
.paper-card .pc-head{display:flex;justify-content:space-between;align-items:center}
.paper-card .pc-date{font-size:11px;color:var(--g400)}
.paper-card .pc-label{font-size:13px;font-weight:700;color:var(--g800);margin:2px 0}
.paper-card .pc-stats{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.paper-card .pc-tag{font-size:10px;padding:2px 6px;border-radius:10px;font-weight:600;background:var(--pri-bg);color:var(--pri);border:1px solid var(--pri-l)}
.paper-card .pc-del{background:none;border:none;font-size:12px;color:var(--g400);cursor:pointer;padding:4px 8px}
.paper-card .pc-del:hover{color:var(--err)}
.shuffle-papers{background:#fff;border:1px solid var(--g200);border-radius:var(--rs);padding:14px;margin-bottom:12px}
.shuffle-papers label{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:8px;cursor:pointer;padding:6px 0;border-bottom:1px solid var(--g50)}
.shuffle-papers label:last-of-type{border-bottom:none}
.shuffle-papers input[type=checkbox]{width:18px;height:18px;accent-color:var(--pur)}
.shuffle-papers .sp-info{font-size:10px;color:var(--g400);margin-left:auto}
.comment-box{margin-top:8px;padding:8px;background:var(--g50);border:1px solid var(--g200);border-radius:var(--rx)}
.comment-item{background:#fff;border:1px solid var(--g200);border-radius:var(--rx);padding:6px 8px;margin-bottom:4px;font-size:11px;display:flex;align-items:flex-start;gap:6px}
.comment-item .cm-txt{flex:1}
.comment-item .cm-date{font-size:10px;color:var(--g400)}
.comment-item .cm-del{background:none;border:none;color:var(--g300);font-size:12px;cursor:pointer;padding:2px;flex-shrink:0}
.comment-item .cm-del:hover{color:var(--err)}
.comment-input{display:flex;gap:6px;margin-top:6px}
.comment-input input{flex:1;border:1px solid var(--g200);border-radius:var(--rx);padding:6px 8px;font-size:12px}
.comment-input input:focus{border-color:var(--pri);outline:none}
.comment-input button{padding:6px 10px;border:none;border-radius:var(--rx);background:var(--pri);color:#fff;font-size:11px;font-weight:600;cursor:pointer}
.memo-card{background:#fff;border:1px solid var(--g200);border-radius:var(--rs);padding:14px;margin-bottom:8px;border-left:4px solid var(--teal);position:relative;transition:.15s}
.memo-card:hover{box-shadow:var(--sh)}
.memo-card.selected{border-color:var(--teal);background:var(--teal-bg);box-shadow:0 0 0 2px var(--teal-l)}
.memo-card .mc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.memo-card .mc-part{font-size:10px;padding:2px 6px;border-radius:8px;background:var(--pri-bg);color:var(--pri);font-weight:600}
.memo-card .mc-date{font-size:10px;color:var(--g400)}
.memo-card .mc-title{font-size:13px;font-weight:700;color:var(--g800);margin-bottom:4px}
.memo-card .mc-body{font-size:12px;color:var(--g600);line-height:1.6;white-space:pre-wrap;max-height:120px;overflow:hidden}
.memo-card .mc-body.expanded{max-height:none}
.memo-card .mc-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.memo-card .mc-tag{font-size:9px;padding:2px 5px;border-radius:6px;background:var(--g100);color:var(--g500)}
.memo-card .mc-actions{display:flex;gap:4px;margin-top:8px;padding-top:8px;border-top:1px solid var(--g100)}
.memo-card .mc-actions button{padding:4px 8px;border:1px solid var(--g200);border-radius:var(--rx);background:#fff;font-size:10px;cursor:pointer;color:var(--g500)}
.memo-card .mc-actions button:hover{border-color:var(--pri);color:var(--pri)}
.memo-sel-cb{position:absolute;top:12px;right:12px;width:20px;height:20px;accent-color:var(--teal)}
.note-card{background:#fff;border:1px solid var(--g200);border-radius:var(--rs);padding:14px;margin-bottom:8px;border-left:4px solid var(--pri)}
.note-card .nc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.note-card .nc-cat{font-size:10px;padding:2px 6px;border-radius:8px;font-weight:600}
.note-card .nc-cat.cat-think{background:var(--pur-bg);color:var(--pur)}
.note-card .nc-cat.cat-logic{background:var(--wrn-bg);color:var(--wrn)}
.note-card .nc-cat.cat-apply{background:var(--suc-bg);color:var(--suc)}
.note-card .nc-cat.cat-custom{background:var(--g100);color:var(--g600)}
.note-card .nc-title{font-size:13px;font-weight:700;margin-bottom:4px}
.note-card .nc-body{font-size:12px;color:var(--g600);line-height:1.7;white-space:pre-wrap}
.note-card .nc-footer{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:8px;border-top:1px solid var(--g100)}
.note-card .nc-date{font-size:10px;color:var(--g400)}
.note-card .nc-actions button{padding:4px 8px;border:1px solid var(--g200);border-radius:var(--rx);background:#fff;font-size:10px;cursor:pointer;color:var(--g500);margin-left:4px}
.note-card .nc-actions button:hover{border-color:var(--pri);color:var(--pri)}
.mode-toggle{display:flex;gap:2px;background:var(--g100);padding:3px;border-radius:var(--rs);margin:8px 0}
.mode-toggle button{flex:1;padding:8px;border:none;border-radius:var(--rx);background:transparent;font-size:12px;font-weight:600;cursor:pointer;color:var(--g500)}
.mode-toggle button.on{background:#fff;color:var(--pur);box-shadow:0 1px 2px rgba(0,0,0,.05)}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<div class="modal-ov" id="mo"><div class="modal-bx"><h3 id="mT"></h3><p id="mM"></p><div class="modal-btns"><button class="btn btn-o" onclick="closeM()">取消</button><button class="btn btn-e" id="mC">確定</button></div></div></div>
<script>
const CLOUD_URL='https://script.google.com/macros/s/AKfycbwSlrUxnW6MZw8SFdkwa1UF07QykfUM49xsFntlTO5Z2j1qViA3vSMhq1X3hgmjvW07/exec';
const CLOUD_TOKEN='mySecret2026';
const CLOUD_FILE='cre_chinese_v93.txt';

function showM(t,m,cb,ok){document.getElementById('mT').textContent=t;document.getElementById('mM').textContent=m;const b=document.getElementById('mC');b.textContent=ok||'確定';b.onclick=()=>{closeM();cb()};document.getElementById('mo').classList.add('show')}
function closeM(){document.getElementById('mo').classList.remove('show')}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function nowStr(){const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+' '+p2(d.getHours())+':'+p2(d.getMinutes())}
function dateStr(){const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function shortDate(){const d=new Date();return(d.getMonth()+1)+'月'+d.getDate()+'日'}
function p2(n){return String(n).padStart(2,'0')}
function fmtT(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function fmtB(b){return b<1024?b+'B':b<1048576?(b/1024).toFixed(1)+'KB':(b/1048576).toFixed(1)+'MB'}
function uid(){return Date.now().toString(36)+Math.random().toString(36).substr(2,5)}
function qKey(q){return(q.stem||'').substring(0,50)+'##'+((q.options&&q.options[0])||'')}
function shuffleArr(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}

const PM=[
{id:1,name:"Part 1 — 閱讀理解",short:"P1 閱讀",desc:"文章+片段閱讀",count:14,icon:"📖"},
{id:2,name:"Part 2 — 字詞辨識",short:"P2 字詞",desc:"錯別字+簡化字",count:8,icon:"✍️"},
{id:3,name:"Part 3 — 句子辨析",short:"P3 句子",desc:"語病+邏輯",count:8,icon:"🔍"},
{id:4,name:"Part 4 — 詞句運用",short:"P4 詞句",desc:"填充+銜接+排序",count:15,icon:"📝"}
];

const PROMPTS={
1:`你是CRE中文運用出卷委員。請出Part 1閱讀理解共14題。\n\n【結構】Section I 文章閱讀(8題) + Section II 片段閱讀(6題)\n\n【輸出JSON】\n{"part":1,"passage":"文章","questions":[{"stem":"","options":["","","",""],"answer":0,"explanation":"","passage":true}]}`,
2:`你是CRE中文運用出卷委員。請出Part 2字詞辨識共8題。\n\n【結構】錯別字(5題) + 簡化字(3題)\n\n【輸出JSON】\n{"part":2,"questions":[{"stem":"","options":["","","",""],"answer":0,"explanation":""}]}`,
3:`你是CRE中文運用出卷委員。請出Part 3句子辨析共8題。\n\n【結構】語病(4題) + 邏輯(4題)\n\n【輸出JSON】\n{"part":3,"questions":[{"stem":"","options":["","","",""],"answer":0,"explanation":""}]}`,
4:`你是CRE中文運用出卷委員。請出Part 4詞句運用共15題。\n\n【結構】填充(6) + 銜接(5) + 排序(4)\n\n【輸出JSON】\n{"part":4,"questions":[{"stem":"","options":["","","",""],"answer":0,"explanation":""}]}`,
full:`你是CRE中文運用出卷委員。請出全份卷45題：P1(14)+P2(8)+P3(8)+P4(15)。\n\n【輸出JSON】\n{"fullPaper":true,"passage":"P1文章","parts":{"1":[14題],"2":[8題],"3":[8題],"4":[15題]}}`
};

// ===== STATE =====
let POOL={1:[],2:[],3:[],4:[]};
let PAPERS=[];
let WB={1:[],2:[],3:[],4:[]};
let UB={1:[],2:[],3:[],4:[]};
let HIST=[];
let MEMO=[];
let NOTES=[];
let PSG='';
let IMP={1:0,2:0,3:0,4:0,full:0};
let PC=0;

let S={
page:'home',tab:'quiz',wbSub:'wrong',poolPart:null,memoFilter:'all',noteFilter:'all',
part:null,qi:0,ans:{},flags:{},
tSec:0,tOn:false,_tID:null,
psgOpen:true,mode:'normal',qs:null,
isFP:false,mapOpen:false,_bu:null,viewRec:null,
_curPsg:'',_paperLabels:'',memoSel:{}
};

function tStart(){if(S._tID)clearInterval(S._tID);S.tOn=true;S._tID=setInterval(()=>{S.tSec++;const e=document.getElementById('tmr');if(e)e.textContent=fmtT(S.tSec)},1000)}
function tPause(){S.tOn=false;if(S._tID){clearInterval(S._tID);S._tID=null}}
function tReset(){tPause();S.tSec=0}
function tStop(){tPause()}

// ===== CLOUD =====
function buildSave(){return{v:'9.3',savedAt:nowStr(),wb:WB,ub:UB,hist:HIST,memo:MEMO,notes:NOTES,imp:IMP,pc:PC,psg:PSG,pool:POOL,papers:PAPERS}}
function applyLoad(d){
if(d.wb)WB=d.wb;if(d.ub)UB=d.ub;if(d.hist)HIST=d.hist;
if(d.psg)PSG=d.psg;if(d.imp)IMP=d.imp;if(d.pc!==undefined)PC=d.pc;
if(d.pool){for(let i=1;i<=4;i++)POOL[i]=d.pool[i]||[]}
if(d.papers)PAPERS=d.papers;if(d.memo)MEMO=d.memo;if(d.notes)NOTES=d.notes;
for(let i=1;i<=4;i++){if(!WB[i])WB[i]=[];if(!UB[i])UB[i]=[];if(!POOL[i])POOL[i]=[]}
if(!MEMO)MEMO=[];if(!NOTES)NOTES=[];
}

function cloudSaveAll(){
const el=document.getElementById('cloudSt');
if(el){el.className='cloud-status show loading';el.textContent='⏳ 儲存中...';}
fetch(CLOUD_URL,{method:'POST',body:JSON.stringify({token:CLOUD_TOKEN,file:CLOUD_FILE,data:JSON.stringify(buildSave())})})
.then(r=>r.json()).then(res=>{
if(res.ok){if(el){el.className='cloud-status show ok';el.textContent='✅ 已儲存 '+nowStr()+' ('+fmtB(res.bytes)+')';}toast('☁️ 已儲存!')}
else{if(el){el.className='cloud-status show err';el.textContent='❌ '+res.msg;}}
}).catch(err=>{if(el){el.className='cloud-status show err';el.textContent='❌ '+err.message;}});
}
function cloudLoadAll(cb){
const el=document.getElementById('cloudSt');
if(el){el.className='cloud-status show loading';el.textContent='⏳ 讀取中...';}
fetch(CLOUD_URL+'?token='+encodeURIComponent(CLOUD_TOKEN)+'&file='+encodeURIComponent(CLOUD_FILE))
.then(r=>r.json()).then(res=>{
if(res.ok){let d;try{d=JSON.parse(res.data)}catch(e){};if(d)applyLoad(d);if(el){el.className='cloud-status show ok';el.textContent='✅ 已讀取 '+nowStr();}toast('☁️ 已讀取!')}
else{if(el){el.className='cloud-status show err';el.textContent='⚠️ '+(res.msg||'未找到');}}
if(cb)cb();R();
}).catch(err=>{if(el){el.className='cloud-status show err';el.textContent='❌ '+err.message;}if(cb)cb();R()});
}

// ===== RENDER =====
function R(){
const app=document.getElementById('app');
if(S.page==='quiz')renderQuiz(app);
else if(S.page==='result')renderResult(app);
else if(S.page==='detail')renderDetail(app);
else renderHome(app);
}

function renderHome(app){
const tabs=['quiz','pool','wrong','memo','notes','history','import','save'];
const tNames=['做題','題池','錯題','Memo','筆記','記錄','匯入','存檔'];
let h=`<div class="header"><h1>CRE 中文運用 — 練習系統</h1><div class="ver">v9.3</div></div><div class="container">`;
h+=`<div class="tab-bar">${tabs.map((t,i)=>`<button class="tab-btn ${S.tab===t?'active':''}" onclick="S.tab='${t}';S.poolPart=null;S.memoSel={};R()">${tNames[i]}</button>`).join('')}</div>`;
if(S.tab==='quiz')h+=tabQuiz();
else if(S.tab==='pool')h+=tabPool();
else if(S.tab==='wrong')h+=tabWrong();
else if(S.tab==='memo')h+=tabMemo();
else if(S.tab==='notes')h+=tabNotes();
else if(S.tab==='history')h+=tabHist();
else if(S.tab==='import')h+=tabImport();
else h+=tabSave();
h+=`</div>`;app.innerHTML=h;
}

// ===== TAB: 做題 =====
function tabQuiz(){
const tw=Object.values(WB).reduce((a,b)=>a+b.length,0);
const tp=Object.values(POOL).reduce((a,b)=>a+b.length,0);
let h=`<div class="stat-row"><div class="stat-card"><div class="stat-num">${HIST.length}</div><div class="stat-lbl">已完成</div></div><div class="stat-card"><div class="stat-num err">${tw}</div><div class="stat-lbl">❌ 錯題</div></div><div class="stat-card"><div class="stat-num">${tp}</div><div class="stat-lbl">📚 題池</div></div><div class="stat-card"><div class="stat-num teal">${MEMO.length}</div><div class="stat-lbl">📝 Memo</div></div></div>`;

// 按Paper做題
h+=`<div class="sec-title">📄 選Paper做題</div>`;
if(!PAPERS.length){h+=`<div class="info-box ib-w">未有Paper，去「匯入」加卷。</div>`}
else{
PAPERS.slice().reverse().forEach(p=>{
const cnt=getPaperQCount(p.id);
h+=`<div class="paper-card" onclick="startPaperDirect('${p.id}')"><div class="pc-head"><div class="pc-date">${p.date} · ${p.type}</div></div><div class="pc-label">${esc(p.label)}</div><div class="pc-stats"><span class="pc-tag">共${cnt}題</span>`;
for(let i=1;i<=4;i++){const n=POOL[i].filter(q=>q.paperId===p.id).length;if(n)h+=`<span class="pc-tag">P${i}:${n}</span>`}
h+=`</div></div>`;
});
}

// 混合練習
h+=`<div class="sec-title">🔀 混合練習</div>`;
if(!PAPERS.length){h+=`<div class="info-box ib-w">需要至少一份Paper。</div>`}
else{
h+=`<div class="shuffle-papers">`;
h+=`<div style="font-size:12px;font-weight:700;margin-bottom:10px">剔選Papers：</div>`;
PAPERS.slice().reverse().forEach(p=>{
const cnt=getPaperQCount(p.id);
h+=`<label><input type="checkbox" class="shp-cb" value="${p.id}" checked><span style="flex:1"><strong>${esc(p.label)}</strong><br><span style="font-size:10px;color:var(--g400)">${p.date} · ${p.type}</span></span><span class="sp-info">${cnt}題</span></label>`;
});
h+=`<div class="mode-toggle"><button class="on" id="mt-shuffle" onclick="document.getElementById('mt-shuffle').classList.add('on');document.getElementById('mt-order').classList.remove('on')">🔀 撈亂</button><button id="mt-order" onclick="document.getElementById('mt-order').classList.add('on');document.getElementById('mt-shuffle').classList.remove('on')">📋 按次序</button></div>`;
h+=`<div style="margin-top:8px;display:flex;align-items:center;gap:8px"><span style="font-size:12px">抽取上限：</span><input type="number" id="shNum" value="0" min="0" max="9999" style="width:60px;border:1px solid var(--g200);border-radius:4px;padding:4px 8px;font-size:12px"><span style="font-size:10px;color:var(--g400)">0 = 全部</span></div>`;
h+=`<button class="btn btn-pur" style="margin-top:12px" onclick="startMixPractice()">開始練習</button>`;
h+=`</div>`;
}
return h;
}
function getPaperQCount(pid){let c=0;for(let i=1;i<=4;i++)c+=POOL[i].filter(q=>q.paperId===pid).length;return c}

// ===== TAB: 題池 =====
function tabPool(){
if(S.poolPart)return tabPoolDetail(S.poolPart);
const tp=Object.values(POOL).reduce((a,b)=>a+b.length,0);
let h=`<div class="info-box ib-b">📚 題池共 <strong>${tp}</strong> 題 · <strong>${PAPERS.length}</strong> 份Paper</div>`;
PM.forEach(p=>{h+=`<div class="part-card" onclick="S.poolPart=${p.id};R()"><h3>${p.icon} ${p.name}</h3><p>${(POOL[p.id]||[]).length}題</p><span class="arrow">›</span></div>`});
h+=`<div class="sec-title" style="margin-top:20px">📄 Papers（${PAPERS.length}）</div>`;
if(!PAPERS.length)h+=`<div class="empty">未有Paper</div>`;
else PAPERS.slice().reverse().forEach(p=>{
const cnt=getPaperQCount(p.id);
h+=`<div class="paper-card"><div class="pc-head"><div class="pc-date">${p.date}</div><button class="pc-del" onclick="event.stopPropagation();delPaper('${p.id}')">🗑️</button></div><div class="pc-label">${esc(p.label)}</div><div class="pc-stats">`;
for(let i=1;i<=4;i++){const n=POOL[i].filter(q=>q.paperId===p.id).length;if(n)h+=`<span class="pc-tag">P${i}:${n}</span>`}
h+=`<span class="pc-tag" style="background:var(--pur-bg);color:var(--pur);border-color:var(--pur-l)">共${cnt}</span></div></div>`;
});
h+=`<div class="sec-title" style="margin-top:24px">📋 Prompt</div>`;
h+=`<div class="card" style="border-left:4px solid var(--pur)"><h3 style="color:var(--pur);font-size:13px;margin-bottom:6px">全份卷（45題）</h3><div class="prompt-box">${esc(PROMPTS.full)}</div><button class="btn btn-pur btn-sm" onclick="cpP('full')">複製</button></div>`;
PM.forEach(p=>{h+=`<div class="card"><h3 style="font-size:13px;margin-bottom:6px">${p.icon} ${p.name}</h3><div class="prompt-box">${esc(PROMPTS[p.id])}</div><button class="btn btn-s btn-sm" onclick="cpP(${p.id})">複製</button></div>`});
return h;
}
function tabPoolDetail(pid){
const pm=PM.find(p=>p.id===pid);const items=POOL[pid]||[];
const groups={};items.forEach(q=>{const k=q.paperId||'unknown';if(!groups[k])groups[k]=[];groups[k].push(q)});
let h=`<button class="btn btn-o btn-sm" style="margin-bottom:12px" onclick="S.poolPart=null;R()">← 返回</button>`;
h+=`<div class="sec-title">${pm.icon} ${pm.name}（${items.length}題）</div>`;
Object.keys(groups).forEach(pid2=>{
const paper=PAPERS.find(p=>p.id===pid2);const pqs=groups[pid2];
h+=`<div class="paper-card" onclick="togB('pool_${pid2}')"><div class="pc-label">${esc(paper?paper.label:'未分類')}</div><div class="pc-stats"><span class="pc-tag">${pqs.length}題</span></div></div>`;
h+=`<div class="ri-b" id="pool_${pid2}" style="background:var(--g50);border:1px solid var(--g200);border-radius:6px;margin-bottom:8px;margin-top:-4px;padding:10px">`;
pqs.forEach((q,i)=>{h+=`<div style="padding:4px 0;border-bottom:1px solid var(--g100);font-size:12px"><strong>Q${i+1}</strong> ${esc((q.stem||'').substring(0,60))}${q.stem.length>60?'…':''}</div>`});
h+=`</div>`;
});return h;
}
function delPaper(id){showM('刪除Paper','刪除此Paper及全部題目？',()=>{for(let i=1;i<=4;i++)POOL[i]=POOL[i].filter(q=>q.paperId!==id);PAPERS=PAPERS.filter(p=>p.id!==id);cloudSaveAll();toast('已刪除');R()},'刪除')}
function cpP(k){copyTxt(PROMPTS[k]);toast('已複製Prompt')}

// ===== TAB: 錯題 =====
function tabWrong(){
const tw=Object.values(WB).reduce((a,b)=>a+b.length,0);
const tu=Object.values(UB).reduce((a,b)=>a+b.length,0);
let h=`<div class="sub-tabs"><button class="sub-tab ${S.wbSub==='wrong'?'on err-tab':''}" onclick="S.wbSub='wrong';R()">❌ 錯題（${tw}）</button><button class="sub-tab ${S.wbSub==='uncertain'?'on unc-tab':''}" onclick="S.wbSub='uncertain';R()">⚠️ 不確定（${tu}）</button></div>`;
if(S.wbSub==='wrong')h+=renderBank(WB,'wrong');else h+=renderBank(UB,'uncertain');
return h;
}
function renderBank(bank,type){
const total=Object.values(bank).reduce((a,b)=>a+b.length,0);
if(!total)return`<div class="empty">${type==='wrong'?'🎉 冇錯題！':'⚠️ 未標記。'}</div>`;
let h=`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"><button class="btn ${type==='wrong'?'btn-e':'btn-wrn'} btn-sm" onclick="startBankShuffle('${type}')">🔀 撈亂重做（${total}）</button><button class="btn btn-g btn-sm" onclick="showM('清空','確定？',()=>{${type==='wrong'?'WB':'UB'}={1:[],2:[],3:[],4:[]};toast('已清空');R()})">🗑️ 清空</button></div>`;
PM.forEach(p=>{
const items=bank[p.id]||[];if(!items.length)return;
h+=`<div class="sec-title">${p.name}（${items.length}）<button class="btn btn-sm btn-o rt" onclick="startReview(${p.id},'${type}')">重做</button></div>`;
items.forEach((q,i)=>{h+=bankItem(q,i,p.id,type)});
});return h;
}
function bankItem(q,idx,pid,bank){
const isW=bank==='wrong';const cls=isW?'rw':'ru';const tagCls=isW?'ri-tag-r':'ri-tag-w';const tagTxt=isW?'錯誤':'不確定';
const elId=bank+pid+'_'+idx;
// find paper label
const paper=q.paperId?PAPERS.find(p=>p.id===q.paperId):null;
const paperInfo=paper?paper.label:'';
let h=`<div class="ri ${cls}"><div class="ri-h" onclick="togB('${elId}')"><span style="flex:1;min-width:0"><span style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc((q.stem||'').substring(0,35))}${q.stem.length>35?'…':''}</span>${paperInfo?`<span style="font-size:10px;color:var(--g400)">📄 ${esc(paperInfo)} · P${pid}</span>`:`<span style="font-size:10px;color:var(--g400)">P${pid}</span>`}</span><span style="display:flex;align-items:center;gap:4px;flex-shrink:0"><span class="ri-tag ${tagCls}">${tagTxt}</span><button class="ri-del" onclick="event.stopPropagation();delBank('${bank}',${pid},${idx})">✕</button></span></div>`;
h+=`<div class="ri-b" id="${elId}">`;
if(q._passage)h+=`<div class="lbl">📄 文章</div><div class="psg-in-bank">${esc((q._passage||'').substring(0,300))}${(q._passage||'').length>300?'…':''}</div>`;
h+=`<div class="lbl">題目</div><div style="white-space:pre-wrap;margin-bottom:6px">${esc(q.stem)}</div><div class="lbl">選項</div>`;
(q.options||[]).forEach((o,j)=>{let c='opt-line';if(j===q.answer)c+=' opt-correct';else if(j===q.yourAnswer&&j!==q.answer)c+=' opt-wrong';h+=`<div class="${c}">${'ABCD'[j]}. ${esc(o)}${j===q.answer?' ✓':''}${j===q.yourAnswer&&j!==q.answer?' ←你揀':''}</div>`});
h+=`<div class="lbl">正確答案</div><div style="color:var(--suc);font-weight:600">${'ABCD'[q.answer]}. ${esc((q.options||[])[q.answer]||'')}</div>`;
if(q.explanation)h+=`<div class="lbl">解釋</div><div>${esc(q.explanation)}</div>`;
// Comments with delete
h+=`<div class="comment-box"><div class="lbl" style="margin-top:0">💬 留言</div>`;
const comments=q.comments||[];
comments.forEach((c,ci)=>{h+=`<div class="comment-item"><div class="cm-txt"><div>${esc(c.text)}</div><div class="cm-date">${c.date||''}</div></div><button class="cm-del" onclick="event.stopPropagation();delComment('${bank}',${pid},${idx},${ci})">✕</button></div>`});
h+=`<div class="comment-input"><input id="cmt_${bank}_${pid}_${idx}" placeholder="輸入留言"><button onclick="addComment('${bank}',${pid},${idx})">留言</button></div></div>`;
// Save to Memo button
h+=`<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap"><button class="btn btn-teal btn-sm" onclick="saveToMemo('${bank}',${pid},${idx})">📝 存入Memo</button><button class="btn btn-o btn-sm" onclick="copyForAI('${bank}',${pid},${idx})">📋 複製問AI</button></div>`;
h+=`</div></div>`;return h;
}
function togB(id){const e=document.getElementById(id);if(e)e.classList.toggle('show')}
function delBank(bank,pid,idx){if(bank==='wrong')WB[pid].splice(idx,1);else UB[pid].splice(idx,1);toast('已移除');R()}
function addComment(bank,pid,idx){
const input=document.getElementById('cmt_'+bank+'_'+pid+'_'+idx);if(!input||!input.value.trim())return;
const src=bank==='wrong'?WB:UB;if(!src[pid][idx].comments)src[pid][idx].comments=[];

h+=`<div class="result-hero ${S.isFP?'fp':''}"><div class="big">${cor}/${qs.length}</div><div class="pct">${pct}%</div><div class="tm">⏱ ${fmtT(S.tSec)}</div>`;
if(S.isFP){h+=`<div class="bd">`;PM.forEach(p=>{const pqs=qs.filter(q=>q._part===p.id);const pc=pqs.filter(q=>{const gi=qs.indexOf(q);return S.ans[gi]===q.answer}).length;h+=`<div class="bd-i"><div class="bl">P${p.id}</div><div class="bs">${pc}/${pqs.length}</div></div>`});h+=`</div>`}
h+=`<div class="dots">`;qs.forEach((q,i)=>{const a=S.ans[i];h+=`<div class="dot ${a===undefined?'sk':a===q.answer?'ok':'ng'}">${i+1}</div>`});h+=`</div></div>`;
if(S._bu)h+=`<div class="bank-msg">✅ +${S._bu.a}錯題 · ${S._bu.r}掌握 · 現存${S._bu.tw}題${S._bu.u?` · +${S._bu.u}不確定`:''}</div>`;
h+=`<div class="sec-title">逐題溫習</div>`;
let lp=0;qs.forEach((q,i)=>{
if(S.isFP&&q._part&&q._part!==lp){lp=q._part;const pm=PM.find(p=>p.id===q._part);h+=`<div class="part-div"><h4>${pm?pm.icon:''} ${pm?pm.name:''}</h4></div>`}
const ua=S.ans[i],ok=ua===q.answer;h+=riItem(q,i,ua,ok);
});
h+=`<button class="btn btn-p" style="margin-top:16px" onclick="goHome()">返回主頁</button></div>`;app.innerHTML=h;
}
function riItem(q,i,ua,ok){
let h=`<div class="ri ${ok?'rr':'rw'}"><div class="ri-h" onclick="togRI(${i})"><span>${ok?'✓':'✗'} Q${i+1}</span><span class="ri-tag ${ok?'ri-tag-g':'ri-tag-r'}">${ok?'正確':'錯誤'}</span></div><div class="ri-b" id="rb${i}">`;
h+=`<div class="lbl">題目</div><div style="white-space:pre-wrap;margin-bottom:4px">${esc(q.stem)}</div><div class="lbl">選項</div>`;
q.options.forEach((o,j)=>{let cls='opt-line';if(j===q.answer)cls+=' opt-correct';else if(j===ua&&!ok)cls+=' opt-wrong';h+=`<div class="${cls}">${'ABCD'[j]}. ${esc(o)}${j===q.answer?' ✓':''}${j===ua&&!ok?' ←你揀':''}</div>`});
if(!ok&&ua!==undefined)h+=`<div class="lbl">你的答案</div><div style="color:var(--err)">${'ABCD'[ua]}</div>`;
h+=`<div class="lbl">正確答案</div><div style="color:var(--suc);font-weight:600">${'ABCD'[q.answer]}</div>`;
if(q.explanation)h+=`<div class="lbl">解釋</div><div>${esc(q.explanation)}</div>`;
h+=`</div></div>`;return h;
}
function togRI(i){const e=document.getElementById('rb'+i);if(e)e.classList.toggle('show')}
function renderDetail(app){
const r=HIST.find(x=>x.id===S.viewRec);
if(!r||!r.questions){toast('無法載入');goHome();return}
S.qs=r.questions;S.ans=r.answers||{};S.isFP=r.isFP;S.part=r.part;S.tSec=r.time;S._bu=null;S._curPsg=r.passage||'';
renderResult(app);
}

// ===== ACTIONS =====
function goHome(){tStop();S.page='home';R()}
function pickA(i){S.ans[S.qi]=i;R()}
function viewR(id){S.viewRec=id;S.page='detail';R();scrollTo(0,0)}

function startPaperDirect(paperId){
const paper=PAPERS.find(p=>p.id===paperId);if(!paper)return;
let all=[];
for(let i=1;i<=4;i++){POOL[i].filter(q=>q.paperId===paperId).forEach(q=>{all.push({...JSON.parse(JSON.stringify(q)),_part:i})})}
if(!all.length){toast('此Paper冇題目');return}
// Keep original order (by part, then by index in pool)
S._curPsg=paper.passage||'';
S._paperLabels=paper.label;
const isFP=paper.type==='全份卷';
beginQ(all,'order',isFP?0:all[0]._part,isFP);
}

function startMixPractice(){
const cbs=document.querySelectorAll('.shp-cb:checked');
if(!cbs.length){toast('請揀至少一份Paper');return}
const ids=[...cbs].map(c=>c.value);
let all=[];
for(let i=1;i<=4;i++){POOL[i].filter(q=>ids.includes(q.paperId)).forEach(q=>{all.push({...JSON.parse(JSON.stringify(q)),_part:i})})}
if(!all.length){toast('冇題目');return}
const isShuffle=document.getElementById('mt-shuffle')&&document.getElementById('mt-shuffle').classList.contains('on');
if(isShuffle)all=shuffleArr(all);
const numEl=document.getElementById('shNum');
let num=numEl?parseInt(numEl.value):0;
if(num>0&&num<all.length)all=all.slice(0,num);
const firstPaper=PAPERS.find(p=>ids.includes(p.id)&&p.passage);
S._curPsg=firstPaper?firstPaper.passage:'';
S._paperLabels=ids.map(id=>{const p=PAPERS.find(x=>x.id===id);return p?p.label:''}).filter(Boolean).join(', ');
beginQ(all,isShuffle?'shuffle':'order',0,false);
}

function startReview(pid,bank){
const src=bank==='wrong'?WB:UB;
if(!src[pid]||!src[pid].length){toast('冇題目');return}
let qs=JSON.parse(JSON.stringify(src[pid]));qs.forEach(q=>q._part=pid);
S._curPsg=(qs[0]&&qs[0]._passage)||'';
beginQ(qs,'review',pid,false);
}
function startBankShuffle(bank){
const src=bank==='wrong'?WB:UB;
let all=[];Object.keys(src).forEach(k=>src[k].forEach(q=>all.push({...JSON.parse(JSON.stringify(q)),_part:+k})));
if(!all.length){toast('冇題目');return}
shuffleArr(all);S._curPsg='';
beginQ(all,'shuffle',0,false);
}

function beginQ(qs,mode,part,fp){
S.page='quiz';S.qs=qs;S.mode=mode;S.part=part;S.isFP=fp;
S.qi=0;S.ans={};S.flags={};S.tSec=0;S.tOn=false;S.mapOpen=false;S.psgOpen=true;S._bu=null;
if(S._tID){clearInterval(S._tID);S._tID=null}
R();
}

// ===== SUBMIT =====
function submitQ(){
tStop();const qs=S.qs;const submitTime=nowStr();
let cor=0,added=0,removed=0,uncAdded=0;
qs.forEach((q,i)=>{
const pid=q._part||S.part||1;if(pid<1||pid>4)return;
const key=qKey(q);const bi=WB[pid].findIndex(e=>qKey(e)===key);
if(S.ans[i]===q.answer){cor++;if(bi>=0){WB[pid].splice(bi,1);removed++}}
else if(S.ans[i]!==undefined){
if(bi<0){
const entry={stem:q.stem,options:q.options,answer:q.answer,explanation:q.explanation||'',_part:pid,dateAdded:submitTime,yourAnswer:S.ans[i],comments:[],paperId:q.paperId||''};
if(pid===1&&S._curPsg)entry._passage=S._curPsg;
WB[pid].push(entry);added++;
}else{WB[pid][bi].yourAnswer=S.ans[i];WB[pid][bi].dateAdded=submitTime}
}
if(S.flags[i]){
const ui=UB[pid].findIndex(e=>qKey(e)===key);
if(ui<0){
const entry={stem:q.stem,options:q.options,answer:q.answer,explanation:q.explanation||'',_part:pid,dateAdded:submitTime,yourAnswer:S.ans[i],comments:[],paperId:q.paperId||''};
if(pid===1&&S._curPsg)entry._passage=S._curPsg;
UB[pid].push(entry);uncAdded++;
}
}
});
PC++;
HIST.push({id:uid(),date:submitTime,part:S.part||0,mode:S.mode,total:qs.length,correct:cor,time:S.tSec,isFP:S.isFP,passage:S._curPsg||'',paperLabels:S._paperLabels||'',questions:qs.map(q=>({stem:q.stem,options:q.options,answer:q.answer,explanation:q.explanation||'',_part:q._part,passage:q.passage||false})),answers:{...S.ans}});
const tw=Object.values(WB).reduce((a,b)=>a+b.length,0);
S._bu={a:added,r:removed,tw,u:uncAdded};
S.page='result';R();scrollTo(0,0);toast(`+${added}錯題`);
cloudSaveAll();
}

// ===== IMPORT =====
function doImport(){
const area=document.getElementById('impA'),msg=document.getElementById('impMsg'),labelEl=document.getElementById('impLabel');
if(!area)return;
let raw=area.value.trim();if(!raw){sMsg(msg,'請paste JSON','r');return}
const cm=raw.match(/```(?:json)?\s*([\s\S]*?)```/);if(cm)raw=cm[1].trim();
let d;try{d=JSON.parse(raw)}catch(e){sMsg(msg,'JSON錯誤：'+e.message,'r');return}
const impTime=nowStr();
const label=(labelEl&&labelEl.value.trim())||shortDate()+' 練習';
const paperId='paper_'+Date.now().toString(36)+Math.random().toString(36).substr(2,4);
if(d.fullPaper&&d.parts){
let tot=0;const counts={};
for(let pid=1;pid<=4;pid++){const pqs=d.parts[String(pid)];if(!pqs||!Array.isArray(pqs))continue;pqs.forEach(q=>{q._part=pid;q.id=uid();q.paperId=paperId;q.paperDate=dateStr()});POOL[pid]=POOL[pid].concat(pqs);tot+=pqs.length;counts[pid]=pqs.length;IMP[pid]++}
PAPERS.push({id:paperId,date:dateStr(),label,addedAt:impTime,type:'全份卷',passage:d.passage||'',counts,totalQ:tot});
if(d.passage)PSG=d.passage;IMP.full++;
sMsg(msg,`✓「${label}」全份卷 +${tot}題`,'g');area.value='';toast('匯入成功');cloudSaveAll();R();return;
}
if(!d.part||!d.questions){sMsg(msg,'格式錯誤','r');return}
const pid=d.part;if(pid<1||pid>4){sMsg(msg,'part須1-4','r');return}
d.questions.forEach(q=>{q._part=pid;q.id=uid();q.paperId=paperId;q.paperDate=dateStr()});
POOL[pid]=POOL[pid].concat(d.questions);
PAPERS.push({id:paperId,date:dateStr(),label,addedAt:impTime,type:'Part '+pid,passage:d.passage||'',counts:{[pid]:d.questions.length},totalQ:d.questions.length});
if(d.passage)PSG=d.passage;IMP[pid]++;
sMsg(msg,`✓「${label}」P${pid} +${d.questions.length}題`,'g');area.value='';toast('匯入成功');cloudSaveAll();R();
}
function sMsg(el,txt,c){if(!el)return;el.style.display='block';el.style.background=c==='r'?'var(--err-bg)':'var(--suc-bg)';el.style.color=c==='r'?'var(--err)':'var(--suc)';el.textContent=txt}

// ===== SAVE/LOAD =====
function doExport(){copyTxt(JSON.stringify(buildSave()));toast('已複製')}
function doLoad(){const a=document.getElementById('loadA');if(!a)return;let r=a.value.trim();if(!r){toast('請paste');return}let d;try{d=JSON.parse(r)}catch(e){toast('JSON錯誤');return}applyLoad(d);toast('已還原');a.value='';R()}
function copyTxt(t){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).catch(()=>fbCopy(t));else fbCopy(t)}
function fbCopy(t){const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();document.execCommand('copy');document.body.removeChild(a)}

// ===== KEYBOARD =====
document.addEventListener('keydown',e=>{
if(S.page!=='quiz')return;if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT')return;
const qs=S.qs;if(!qs)return;const q=qs[S.qi];if(!q)return;
if(e.key>='1'&&e.key<=String(q.options.length)){e.preventDefault();pickA(parseInt(e.key)-1)}
else if(e.key==='ArrowRight'||e.key==='Enter'){e.preventDefault();if(S.qi<qs.length-1){S.qi++;R();scrollTo(0,0)}}
else if(e.key==='ArrowLeft'){e.preventDefault();if(S.qi>0){S.qi--;R();scrollTo(0,0)}}
else if(e.key.toLowerCase()==='f'){e.preventDefault();S.flags[S.qi]=!S.flags[S.qi];R()}
});

cloudLoadAll(()=>{});
</script>
